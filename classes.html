"},{"ch":7,"from":157,"to":158,"section":"Behavior: Defining Features and Assumptions that Guide Its Analysis","what":"Determinism applied to behavior; variability treated as environmental, not random."}],"coverage":"strong","gap":"Cultural-level selection (the third level after phylogeny and ontogeny) appears only in a quoted passage; pragmatism gets a single paragraph.","code":[],"extra":"For selection at the cultural level, read Skinner's 1981 \"Selection by Consequences\" and Glenn (2004), both cited on p. 33.","domain":"A"},{"id":"A.3","label":"Seeing behavior, thoughts included, through radical behaviorism","refs":[{"ch":1,"from":11,"to":14,"section":"Skinner's Radical Behaviorism","what":"Mentalism, hypothetical constructs, explanatory fictions, methodological behaviorism, and private events as behavior."},{"ch":1,"from":15,"to":15,"section":"What Is Behaviorism?","what":"Don Baer's plain-talk answer: behavior has environmental causes we can rearrange."},{"ch":29,"from":681,"to":682,"section":"The \"Self\" as Behavior Controller","what":"Radical behaviorism applied to self-control; willpower and drive shown as explanatory fictions."}],"coverage":"strong","gap":"","code":[],"extra":"","domain":"A"},{"id":"A.4","label":"Philosophy, basic research, applied research, and practice compared","refs":[{"ch":1,"from":19,"to":21,"section":"Four Interrelated Domains of Behavior Analytic Science and Professional Practice Guided by That Science","what":"Each of the four domains defined with examples; Figure 1.2 contrasts their activities, goals, scope, and precision; translational research links lab and applied work."},{"ch":1,"from":7,"to":7,"section":"A Brief History of Behavior Analysis","what":"Names the three branches: behaviorism, experimental analysis of behavior, applied behavior analysis."},{"ch":1,"from":10,"to":11,"section":"Experimental Analysis of Behavior","what":"How Skinner's lab research founded EAB and its methods."},{"ch":1,"from":14,"to":16,"section":"Applied Behavior Analysis","what":"How applied work grew out of lab findings, up to JABA in 1968."}],"coverage":"strong","gap":"","code":[],"extra":"","domain":"A"},{"id":"A.5","label":"Baer, Wolf, and Risley's seven defining dimensions","refs":[{"ch":1,"from":16,"to":18,"section":"Characteristics of Applied Behavior Analysis","what":"Each of the seven dimensions explained: applied, behavioral, analytic, technological, conceptually systematic, effective, generality."},{"ch":1,"from":24,"to":24,"section":"Summary","what":"One-line definition of each dimension for quick review."}],"coverage":"strong","gap":"","code":[],"extra":"","domain":"A"},{"id":"B.1","label":"Behavior, single instances, and function-based response groups","refs":[{"ch":2,"from":26,"to":27,"section":"Behavior","what":"Behavior defined, response as one instance, topography, response class, and repertoire."},{"ch":2,"from":34,"to":35,"section":"Consequences Select Response Classes, Not Individual Responses","what":"Why reinforcement strengthens a whole family of similar-function responses, not one copy."},{"ch":30,"from":718,"to":719,"section":"Response Generalization","what":"Untrained variations that do the same job; reinforcing some class members spreads to others."},{"ch":27,"from":629,"to":630,"section":"Function Versus Topography","what":"Same-looking acts can serve different functions; different-looking acts can share one."}],"coverage":"strong","gap":"","code":[],"extra":"","domain":"B","content":{"bigIdea":"Behavior is a living organism's movement as it interacts with its surroundings; a response is one occurrence of it; a response class is a set of responses grouped because they produce the same effect.","explainer":"Behavior is movement by a living organism that interacts with its surroundings. That includes movement under the skin, such as a gland secreting or a few muscle fibers contracting. Three things are not behavior: states (\"being anxious\"), things that happen to a person (\"getting a sticker\"), and motion caused by an outside force (being shoved). Quick check: if a dead body could \"do\" it, it is not behavior.\n\nA response is one single occurrence. Maya raising her hand at 10:02 is a response; her hand-raise at 10:15 is another. Each response has a topography, its physical shape, and no two are exactly alike.\n\nA response class is a set of responses that all accomplish the same thing in the environment, even when they look different. Saying \"help,\" handing over a help card, and tapping a teacher's arm can all be one class if each one gets assistance. Function decides membership, not form. Two identical-looking acts can be different behaviors when different variables control them.\n\nWhy it matters: reinforcement strengthens the whole class, not just the exact copy that was reinforced. Untrained members with the same effect can increase too. And blocking one problem behavior can make a different-looking member of its class show up.","keyPoints":["Behavior = movement of a living organism interacting with its environment (it passes the dead man test).","Response = one occurrence of behavior; technically, the action of an effector (a muscle or gland).","Topography = the physical form of a response; it varies a little every time.","Response class = responses grouped by shared effect (function), even when their forms differ.","Consequences strengthen or weaken whole response classes, not single copies."],"traps":[{"trap":"Calling states or things done to a person \"behavior\" (\"being bored,\" \"receiving a token\").","fix":"Ask whether the person's own body moves and acts on the environment. States and received events fail; \"yawning\" or \"pocketing the token\" pass."},{"trap":"Grouping responses into one class because they look alike.","fix":"A response class is defined by what the responses accomplish. Different forms that get the same result belong together; look-alike acts that get different results do not."},{"trap":"Treating \"response\" and \"behavior\" as the same word on exam items.","fix":"A response is one countable occurrence. \"Behavior\" usually names the broader class (\"greeting behavior\"). If the item points to a single instance, the answer is response."}],"example":{"scenario":"Jonah, age 6, gets out of handwriting work three ways: tearing the worksheet, putting his head down, or saying \"my hand hurts.\" Each usually leads his aide to remove the task. On Tuesday he tore the worksheet at 9:05 and again at 9:40.","analysis":"The tears at 9:05 and 9:40 are two responses. Tearing, head-down, and \"my hand hurts\" differ in topography but share one effect, the task goes away, so they form one response class. A plan that targets only tearing could let the other members increase."}}},{"id":"B.2","label":"One stimulus versus groups of related stimuli","refs":[{"ch":2,"from":27,"to":28,"section":"Environment; Classifying and Describing Stimuli","what":"Stimulus as an energy change; stimuli described by form, timing, and function; stimulus class."},{"ch":17,"from":402,"to":403,"section":"Teaching Concepts","what":"Antecedent stimulus classes, plus feature-based versus arbitrary classes with clear examples."},{"ch":19,"from":456,"to":456,"section":"What Was Learned","what":"Equivalence classes: physically unlike stimuli that become interchangeable members of one class."}],"coverage":"strong","gap":"","code":[],"extra":"","domain":"B","content":{"bigIdea":"A stimulus is a single energy change a person detects through the senses; a stimulus class is a collection of stimuli that have chosen features of form, timing, or function in common.","explainer":"A stimulus is any change in energy that reaches a person through their senses: a bell starting to ring, a light flashing, a smell, a stomach cramp, a sense of losing balance. Behavior analysts mostly study changes rather than steady background conditions, and mostly changes outside the body, because those are easier to observe and arrange.\n\nAny stimulus can be described three ways: by its form (size, color, loudness), by its timing (before the behavior is an antecedent; after it is a consequence), and by its function (what it actually does to behavior).\n\nA stimulus class is a collection of stimuli that have some chosen element in common on one or more of those dimensions. One item is a stimulus; the group is the class.\n\nTwo kinds of antecedent class show up on exams. In a feature class, members share physical features (mugs, paper cups, teacups) or a relation (\"longer than\"). Responding spreads easily to new members that look similar.\n\nIn an arbitrary class, members share no physical features but evoke the same response. A raised palm, a whistle blast, and a red STOP card can all mean \"freeze.\" These classes are usually built with matching-to-sample (equivalence) training, and responding does not spread to them by physical resemblance.","keyPoints":["Stimulus = a change in energy that a person's sense receptors pick up, outside or inside the body.","Describe stimuli by form, by timing (antecedent or consequence), and by function.","Stimulus class = stimuli grouped by shared, specified elements on one or more of those dimensions.","Feature classes share physical features or a relation; arbitrary classes share only the response they evoke.","The same stimulus can serve different functions in different situations."],"traps":[{"trap":"Mixing up a stimulus class with a response class.","fix":"A stimulus class groups things the person detects (sights, sounds, events). A response class groups things the person does. Ask: is the group made of environmental events or of the learner's actions?"},{"trap":"Assuming every stimulus class must look alike.","fix":"Only feature classes share physical form or a relation. Arbitrary class members (a whistle, a raised palm, a STOP card) share nothing physical; they belong together because they evoke the same response."},{"trap":"Treating a stimulus as having one fixed role.","fix":"Classify by what the stimulus does in that context. A timer beep can mean \"start your worksheet\" in class and \"take the cookies out\" at home, so one stimulus can sit in different classes."}],"example":{"scenario":"In a community-skills group, Ana learns to put any apple (red, green, tiny, or bruised) into the fruit bin. Her teacher also trains her so that hearing \"apple,\" seeing the printed word APPLE, or seeing the printed word MANZANA all lead her to pick up an apple.","analysis":"Each apple and each word is one stimulus. The varied apples form a feature stimulus class: they share physical features, so new apples get sorted easily. The spoken word, APPLE, and MANZANA form an arbitrary class: they look and sound unlike each other but control the same response."}}},{"id":"B.3","label":"Learning through pairings versus learning through consequences","refs":[{"ch":2,"from":28,"to":32,"section":"Respondent Behavior","what":"Reflexes, US/CS pairing, respondent extinction, and higher-order conditioning, with a diagram."},{"ch":2,"from":32,"to":34,"section":"Operant Behavior","what":"Behavior selected by consequences; Table 2.3 compares respondent and operant side by side."},{"ch":17,"from":398,"to":399,"section":"Respondent Eliciting and Operant Discriminative Functions of Antecedent Stimuli","what":"How a conditioned stimulus elicits while a discriminative stimulus evokes."}],"coverage":"strong","gap":"","code":[],"extra":"","domain":"B","content":{"bigIdea":"Respondent conditioning gives a neutral stimulus the power to elicit a reflexive response by pairing it with a stimulus that already elicits it; operant conditioning changes how often a behavior occurs through the consequences that follow it.","explainer":"Respondent behavior is the response half of a reflex. A stimulus comes first and draws the response out (elicits it): pepper triggers a sneeze; a sudden bang makes the heart race. No consequence is needed.\n\nRespondent conditioning (classical or Pavlovian) is stimulus-stimulus pairing. A neutral stimulus (NS) is presented just before or along with an unconditioned stimulus (US), over and over, until the NS alone elicits the response. The NS is now a conditioned stimulus (CS). If the CS keeps occurring without the US, it gradually loses that power. That is respondent extinction.\n\nOperant behavior is selected by what happens after it. In operant conditioning, a consequence that closely follows a response changes how often similar responses occur in the future. An increase is reinforcement; a decrease is punishment. Antecedents matter here too: a discriminative stimulus (SD) evokes behavior, but only because responding in its presence was followed by different consequences.\n\nExam test: ask what built the behavior. Two stimuli occurring together, with no response required? Respondent. A consequence following the response? Operant. Don't judge by appearance. Tears from onion fumes are respondent; tears that reliably bring a parent's comfort can be operant.","keyPoints":["Respondent: a prior stimulus elicits the response; new elicitors are made by pairing a neutral stimulus with a US (or an existing CS).","Respondent extinction: present the CS alone again and again until it no longer elicits the response.","Operant: consequences select the behavior; reinforcement raises and punishment lowers future frequency.","A CS elicits; an SD evokes. The SD gets its power from past consequences, not from pairing with a US.","Form does not tell you which type a behavior is; the controlling variables do."],"traps":[{"trap":"Labeling any behavior that follows a cue as respondent.","fix":"Operant behavior also happens after cues (SDs). Ask whether the cue got its power from pairing with a US or CS (respondent) or from a history of consequences for responding in its presence (operant)."},{"trap":"Thinking any pairing procedure means respondent conditioning.","fix":"Operant work pairs stimuli too: pairing praise with snacks turns praise into a conditioned reinforcer, a consequence for operant behavior. Respondent pairing instead creates a new elicitor of a reflexive response."},{"trap":"Deciding by form: \"crying or sweating is always respondent.\"","fix":"The same form can be either. Tears from onion fumes are elicited; tears that reliably bring a parent's comfort can be maintained by that consequence. Look for what controls the behavior."}],"example":{"scenario":"At a clinic, a cold alcohol swab always comes right before a toddler's shot. After a few visits, the smell of the swab alone makes his heart race and his muscles tense. He has also learned that saying \"all done!\" after the shot earns a sticker, and he now says it every visit.","analysis":"The swab smell began as a neutral stimulus, was paired with the painful shot (a US), and now elicits a racing heart as a CS: respondent conditioning. Saying \"all done!\" increased because a sticker followed it: operant conditioning (reinforcement). One visit, two kinds of learning."}}},{"id":"B.4","label":"Adding versus removing a stimulus to strengthen behavior","refs":[{"ch":2,"from":36,"to":37,"section":"Reinforcement","what":"Positive versus negative reinforcement, the 2x2 figure, and the classic punishment mix-up."},{"ch":11,"from":253,"to":254,"section":"Positive Reinforcement Defined","what":"Operation and defining effect of positive reinforcement with simple two-term examples."},{"ch":12,"from":287,"to":289,"section":"Definition of Negative Reinforcement","what":"Negative reinforcement defined, contrasted with positive reinforcement and with punishment."},{"ch":12,"from":289,"to":290,"section":"Escape and Avoidance Contingencies","what":"Escape, discriminated (signaled) avoidance, and free-operant avoidance, with a homework example."}],"coverage":"strong","gap":"","code":[],"extra":"","domain":"B","content":{"bigIdea":"Both kinds of reinforcement make a behavior happen more often; positive means a stimulus was added after the behavior, and negative means a stimulus that was already there was taken away.","explainer":"Reinforcement always means one thing: the behavior happens more often in the future because of what followed it. If the behavior does not go up, it was not reinforcement, no matter how nice the consequence looked.\n\nTreat positive and negative like math signs, not like good and bad. In positive reinforcement, a stimulus is added (or turned up) right after the behavior, and the behavior increases. A toddler says \"juice\" and gets juice. In negative reinforcement, a stimulus that was already present is removed (or turned down) right after the behavior, and the behavior increases. You buckle your seat belt and the chime stops.\n\nNegative reinforcement comes in two forms. Escape: the behavior ends something already happening, like closing a window against street noise. Avoidance: the behavior prevents or delays something before it starts, like leaving early to beat traffic. Avoidance can follow a warning signal (discriminated avoidance) or have no signal at all (free-operant avoidance).\n\nTo classify, ask two questions in order. Did the behavior increase? Then it is reinforcement. Was a stimulus added, or was one that was already there removed? That tells you positive or negative. Negative reinforcement is never punishment, because punishment makes behavior go down.","keyPoints":["Reinforcement of any kind = the behavior increases in the future.","Positive = a stimulus is added or made stronger after the behavior.","Negative = a stimulus already present is removed or weakened after the behavior.","Negative reinforcement includes escape (end it) and avoidance (prevent or postpone it).","Positive and negative describe the stimulus change, not whether it feels pleasant."],"traps":[{"trap":"Calling negative reinforcement a kind of punishment because the word \"negative\" sounds bad.","fix":"Check what the behavior did. Negative reinforcement makes behavior go up; punishment makes it go down. \"Negative\" only means a stimulus was taken away."},{"trap":"Picking positive or negative based on whether the consequence feels pleasant.","fix":"Ask only whether a stimulus was added or an existing one was removed. Getting rid of a pounding headache is negative reinforcement, even though it feels wonderful."},{"trap":"Missing avoidance because nothing visibly changes after the behavior.","fix":"If the behavior keeps an unpleasant event from starting, or pushes it later, and the behavior increases, that is negative reinforcement (avoidance), even though the event never shows up."}],"example":{"scenario":"Every evening, the neighbor's dog barks for long stretches. Maya started putting on noise-canceling headphones once the barking begins. Over two weeks, she reaches for the headphones faster and more often whenever the barking starts.","analysis":"The barking was already happening, the headphones take it away, and headphone use increased. That is negative reinforcement, specifically escape. Nothing pleasant was added; an ongoing sound was removed."}}},{"id":"B.5","label":"Adding versus removing a stimulus to weaken behavior","refs":[{"ch":2,"from":37,"to":38,"section":"Punishment","what":"Punishment defined by effect; positive versus negative means added versus removed."},{"ch":14,"from":327,"to":329,"section":"Definition and Characteristics of Punishment","what":"Defining effect, positive versus negative punishment, and punishment versus negative reinforcement."},{"ch":15,"from":352,"to":353,"section":"Negative Punishment (chapter opening); Time-Out from Positive Reinforcement Defined","what":"Negative punishment contrasted with positive punishment; time-out as one negative-punishment form."},{"ch":15,"from":361,"to":361,"section":"Response Cost Defined","what":"Response cost: losing reinforcers already earned, the second negative-punishment form."}],"coverage":"strong","gap":"","code":[],"extra":"","domain":"B","content":{"bigIdea":"Both kinds of punishment make a behavior happen less often; positive punishment adds a stimulus after the behavior, and negative punishment takes away a stimulus, usually a reinforcer, that was already there.","explainer":"In behavior analysis, punishment is defined only by its effect: a consequence that follows a behavior and makes that behavior happen less often in the future. How harsh it feels, or whether someone meant it as a penalty, does not matter. A detention that never lowers the behavior is not punishment.\n\nPositive punishment: a stimulus is added (or turned up) right after the behavior, and the behavior decreases. A worker posts a joke in the team chat, her boss replies with a sharp public correction, and she posts jokes less often.\n\nNegative punishment: something the person already has is taken away (or reduced) right after the behavior, and the behavior decreases. Two common procedures are both negative punishment. Response cost takes away reinforcers already earned, like a fine. Time-out removes access to reinforcers, or the chance to earn them, for a set period. Removal only works if the person actually wants what is lost.\n\nDo not confuse positive punishment with negative reinforcement. Both can involve the same unpleasant event. In positive punishment, the event appears after the behavior and the behavior goes down. In negative reinforcement, the event was already there, the behavior removes it, and the behavior goes up. A threat comes before behavior, so it is an antecedent, not punishment.","keyPoints":["Punishment of any kind = the behavior decreases in the future.","Positive punishment = a stimulus is added or intensified after the behavior.","Negative punishment = a stimulus already present, usually a reinforcer, is removed or reduced.","Time-out and response cost are both negative punishment.","Judge by the effect on behavior, not by intent or harshness."],"traps":[{"trap":"Calling a consequence punishment because it was meant as a penalty, such as a trip to the office.","fix":"Look at the data. If the behavior did not decrease, it was not punishment. It may even be reinforcing the behavior, for example by letting the student escape class."},{"trap":"Mixing up positive punishment and negative reinforcement because both involve something unpleasant.","fix":"Ask when the unpleasant event shows up. Added after the behavior and the behavior drops: positive punishment. Already present, removed by the behavior, and the behavior rises: negative reinforcement."},{"trap":"Treating time-out or response cost as separate principles, or calling them positive because something \"happens\" to the person.","fix":"Both take away reinforcers. Time-out removes access or the chance to earn them for a while; response cost removes ones already earned. Both are negative punishment."}],"example":{"scenario":"Each time a 15-year-old texts during family dinner, her parent takes her phone for the rest of the evening. At first she texted at dinner almost nightly. After a month, dinnertime texting happens about once a week.","analysis":"Texting is followed by losing the phone, a reinforcer she already had, and texting decreased. Removal plus a decrease is negative punishment. If texting had not dropped, taking the phone would not count as punishment at all."}}},{"id":"B.6","label":"Consequences the behavior produces itself versus ones another person provides","refs":[{"ch":11,"from":261,"to":263,"section":"Automatic Reinforcement","what":"Two meanings of automatic reinforcement, sensory examples, and when the label is assumed."},{"ch":27,"from":628,"to":629,"section":"Functions of Behavior","what":"Social positive, tangible, automatic positive, social negative, and automatic negative functions."},{"ch":12,"from":291,"to":292,"section":"The Source of Negative Reinforcement","what":"Same relief delivered by another person versus by the person's own action."},{"ch":2,"from":28,"to":28,"section":"Temporal Loci of Stimuli","what":"Definition of a socially mediated contingency: another person supplies antecedent or consequence."},{"ch":18,"from":422,"to":423,"section":"Reinforcement Controlling the Tact: Automatic Reinforcement","what":"Every basic principle, punishment and extinction included, can work with no other person involved; two sources of automatic reinforcement."},{"ch":11,"from":283,"to":283,"section":"Use Direct Rather Than Indirect Reinforcement Contingencies When Possible","what":"Direct (automatic) versus indirect (socially mediated) contingencies in teaching, with a container-opening study."}],"coverage":"strong","gap":"Automatic punishment is only touched on (a footnote on p. 328 and one line on p. 423); expect items asking whether a punisher came from another person or straight from the behavior itself.","code":[],"extra":"","domain":"B","content":{"bigIdea":"A contingency is socially mediated when another person delivers the antecedent or consequence, and automatic when the behavior produces its consequence directly, with no one else involved.","explainer":"Every consequence has a source. The question that sorts these two is simple: did another person have to act for the consequence to happen?\n\nIn a socially mediated contingency, another person delivers the antecedent, the consequence, or both. A child says \"push me\" and a parent pushes the swing. A student yells and the teacher takes away the hard assignment. Attention, items handed over by others, and escape from someone's demands are all socially mediated.\n\nIn an automatic contingency, the behavior produces its consequence directly, and no one else is involved. Rocking creates a pleasant movement sensation. Rubbing a sore knee eases the ache. Turning a key starts the car. \"Automatic\" says nothing about speed or awareness; it only means no social mediation.\n\nBoth sources come in positive and negative versions, and punishment can be automatic too: grabbing a hot pan burns your hand without anyone delivering the burn.\n\nThis matters for treatment. Automatic reinforcement is suspected when a behavior keeps going with no social consequence, such as when the person is alone, and only after social functions have been ruled out. Ignoring or time-out may not reduce it, because the reinforcer does not come from you.","keyPoints":["Socially mediated: another person provides the antecedent and/or the consequence.","Automatic: the response produces its own consequence, with no other person involved.","Both can be positive or negative, and punishment can be automatic too.","Assume automatic reinforcement only after social sources are ruled out.","Ignoring or time-out may not reduce automatically reinforced behavior."],"traps":[{"trap":"Mixing up automatic reinforcement with the automaticity of reinforcement.","fix":"Automaticity means reinforcement works whether or not the person notices it, for any contingency. Automatic reinforcement means no other person delivers the consequence."},{"trap":"Assuming every automatic contingency is positive sensory stimulation, like stimming.","fix":"If the behavior itself removes something unpleasant, such as scratching an itch or rubbing a sore ear, it is automatic negative reinforcement."},{"trap":"Labeling a behavior automatic just because the reinforcer is not obvious.","fix":"First rule out attention, tangibles, and escape, for example by checking whether it persists when the person is alone. Labeling too early can end the search for the real reinforcer."}],"example":{"scenario":"Kai, age 9, hums loudly during independent reading. Observations show he hums just as much when alone in the room as when adults react, and humming does not drop when his reading work is taken away.","analysis":"Humming continues with no one present and is not tied to attention or escape, so the likely reinforcer is automatic: the sound and feel of humming. Planned ignoring would not touch it; treatment would need to mask or compete with that sensory consequence."}}},{"id":"B.7","label":"Inborn, learned, and broadly backed consequences","refs":[{"ch":2,"from":38,"to":39,"section":"Stimulus Changes That Function as Reinforcers and Punishers","what":"Unconditioned versus conditioned reinforcers and punishers, and how pairing creates learned ones."},{"ch":11,"from":263,"to":264,"section":"Classifying Reinforcers","what":"Unconditioned, conditioned, and generalized conditioned reinforcers; why money and attention work broadly."},{"ch":14,"from":329,"to":330,"section":"Types of Punishers","what":"Unconditioned, conditioned, and generalized conditioned punishers, including reprimands as examples."},{"ch":12,"from":291,"to":291,"section":"Events That Serve as Negative Reinforcers: Learning History","what":"Unconditioned versus conditioned negative reinforcers, such as pain versus nagging."}],"coverage":"strong","gap":"","code":[],"extra":"","domain":"B","content":{"bigIdea":"A consequence gets its power either from our species' biology (unconditioned), from being paired with other consequences in a person's own history (conditioned), or from being paired with so many that it works under almost any motivation (generalized conditioned).","explainer":"Reinforcers and punishers can be sorted by where their power comes from.\n\nUnconditioned (also called primary or unlearned) consequences work with no learning history. Our species evolved to be affected by them: food, water, warmth, and oxygen as reinforcers; pain, restraint, harsh tastes, or losing your balance as punishers. They still depend on motivation. A snack does little right after a big meal.\n\nConditioned (secondary or learned) consequences started out neutral. They got their power by being paired with consequences that already worked. A therapist's \"Yes!\" that keeps coming just before a favorite snack can start to reinforce on its own. Because every person's history differs, conditioned consequences vary from person to person. How well one works right now depends on motivation for whatever backs it up, not just on how many pairings happened.\n\nGeneralized conditioned consequences are learned ones backed by many different reinforcers or punishers. Money, tokens, and attention are common reinforcers; a sharp \"No!\" or a frown are common punishers. With so much standing behind them, they work under almost any motivating condition.\n\nTwo reminders. \"Generalized\" means working across many motivational states, not strengthening many behaviors. And every label here is decided by the effect on behavior, never by how pleasant or unpleasant something seems.","keyPoints":["Unconditioned = works with no learning history (food, water, warmth; pain, restraint).","Conditioned = started neutral, gained power by pairing with consequences that already worked.","Generalized conditioned = backed by many reinforcers or punishers, so it works across most motivating conditions (money, tokens, attention, reprimands).","A conditioned consequence's strength right now depends on motivation for its backup, not just the number of pairings.","Classify by the effect on behavior, never by how nice or nasty something seems."],"traps":[{"trap":"Thinking a reinforcer is \"generalized\" because it strengthens lots of different behaviors.","fix":"Any reinforcer can strengthen whatever behavior it immediately follows. \"Generalized\" means it is backed by many reinforcers, so it keeps working no matter what the person currently wants."},{"trap":"Calling praise or attention unconditioned because almost everyone likes it.","fix":"Ask whether it needed a learning history. Praise and attention gain power through pairing with many other reinforcers, which makes them generalized conditioned reinforcers. Food, water, and warmth need no history."},{"trap":"Assuming an unconditioned reinforcer works anytime, or that more pairings always make a conditioned reinforcer stronger.","fix":"Both depend on the current motivating operation. Food barely reinforces after a big meal, and a cue paired only with food weakens when the learner is full, however many pairings came before."}],"example":{"scenario":"In a feeding clinic, a therapist says \"Yes!\" each time she hands a toddler a bite of his favorite cracker. A week later, saying \"Yes!\" alone right after he lifts his spoon increases spoon lifting before lunch, but barely works right after lunch.","analysis":"\"Yes!\" began neutral and became a conditioned reinforcer through pairing with food, an unconditioned reinforcer. Because only one kind of reinforcer backs it, its power rises and falls with hunger. Pairing it with many reinforcers (toys, play, hugs) could make it a generalized conditioned reinforcer that holds up across conditions."}}},{"id":"B.8","label":"Basic ratio and interval reinforcement schedules","refs":[{"ch":13,"from":301,"to":303,"section":"Chapter opening; Intermittent Reinforcement; Defining Basic Intermittent Schedules of Reinforcement","what":"CRF, extinction, ratio versus interval, fixed versus variable: the four basic schedules."},{"ch":13,"from":303,"to":309,"section":"Schedule Effects and Consistency of Performance","what":"FR, VR, FI, VI defined with typical response patterns, pauses, scallops, limited hold."},{"ch":13,"from":311,"to":311,"section":"Variations on Basic Intermittent Schedules of Reinforcement (Figure 13.7)","what":"One-page table comparing FR, VR, FI, and VI: definitions, typical response patterns, and sample cumulative curves."},{"ch":26,"from":617,"to":617,"section":"Time-based NCR Schedules","what":"Fixed-time and variable-time delivery that ignores responding."}],"coverage":"strong","gap":"FT and VT schedules are not taught beside FR/VR/FI/VI; the book covers them only as noncontingent reinforcement (p. 281; pp. 615-617). Know that they deliver reinforcers on a clock regardless of responding.","code":[],"extra":"","domain":"B","content":{"bigIdea":"A schedule of reinforcement is the rule for which responses pay off: ratio schedules count responses, interval schedules wait for time to pass and then reinforce one response, and each can be fixed or variable.","explainer":"A schedule of reinforcement is the rule that says which responses earn a reinforcer. At one end is continuous reinforcement (CRF): every response pays off, which is ideal for teaching something new. At the other end is extinction: nothing pays off. Between them sit intermittent schedules, used mainly to keep an established behavior going.\n\nTwo questions sort the four basic intermittent schedules.\n\nFirst, what does the rule count? Ratio schedules count responses. Interval schedules count time, then reinforce the first response after that time is up. Under a ratio, working faster earns reinforcers sooner. Under an interval, extra responses during the wait earn nothing.\n\nSecond, does the requirement stay the same? Fixed means yes. Variable means it changes from one reinforcer to the next around an average (VR 10 = every 10th response on average).\n\nEach schedule leaves a fingerprint. FR: a pause after each reinforcer, then a fast run. VR: high, steady responding with few pauses. FI: a pause, then responding that speeds up as the interval ends (the \"scallop\"). VI: slow-to-moderate but steady responding.\n\nDon't confuse interval schedules with time-based ones. On fixed-time (FT) or variable-time (VT) schedules, used in noncontingent reinforcement, the reinforcer arrives on the clock no matter what the person does.","keyPoints":["Ratio = a number of responses; interval = time passes, then one response.","Fixed = same requirement every time; variable = changes around an average.","FR: pause, then fast run. VR: high and steady. FI: pause, then scallop. VI: steady, slow to moderate.","CRF builds new behavior; intermittent schedules maintain it.","FT/VT deliver by the clock with no response needed; that is not FI/VI."],"traps":[{"trap":"Mixing up ratio and interval schedules when both involve someone working.","fix":"Ask: would responding faster bring the reinforcer sooner? If yes, it is a ratio schedule. If availability depends on time passing and extra responses do nothing, it is an interval schedule."},{"trap":"Believing that on an FI schedule the reinforcer is delivered as soon as the time is up.","fix":"Time only makes the reinforcer available; a response must still occur. If the reinforcer arrives on the clock regardless of behavior, it is a fixed-time (FT) schedule, as used in noncontingent reinforcement."},{"trap":"Treating the FR pause and the FI pause as the same pattern.","fix":"Both pause after reinforcement. After the pause, FR responding runs fast and steady to the end of the ratio; FI responding starts slow and speeds up as the interval ends (the scallop)."}],"example":{"scenario":"At a vocational program, Dev earns a sticker after every 10 envelopes he stuffs. Staff notice he rests for a minute after each sticker, then works quickly. They switch to giving a sticker after an unpredictable number of envelopes, averaging 10. His rests after stickers mostly disappear.","analysis":"Both plans are ratio schedules: the count of envelopes, not time, decides when a sticker comes, so faster work earns stickers sooner. The first is FR 10, with its typical pause after reinforcement. The second is VR 10; since any envelope might pay off, responding stays high and steady."}}},{"id":"B.9","label":"Recognizing operant extinction when reinforcement stops","refs":[{"ch":24,"from":583,"to":584,"section":"Extinction Defined","what":"Extinction as procedure, process, principle; not forgetting, response blocking, or NCR."},{"ch":24,"from":585,"to":586,"section":"Extinction Procedures","what":"Matching extinction to function: attention, escape extinction, and sensory extinction."},{"ch":24,"from":586,"to":589,"section":"Secondary Effects of Extinction","what":"Extinction burst, response variation, spontaneous recovery, resurgence, and emotional responding."},{"ch":24,"from":589,"to":590,"section":"Variables Affecting Resistance to Extinction","what":"Why intermittent history, motivation, and low effort make behavior persist longer."}],"coverage":"strong","gap":"","code":[],"extra":"","domain":"B","content":{"bigIdea":"Operant extinction happens when a behavior that used to produce a reinforcer no longer produces it, so the behavior gradually occurs less often.","explainer":"Operant extinction means a behavior that used to be reinforced stops producing that reinforcer, and so it occurs less over time. The person can still do the behavior. It just doesn't pay off anymore.\n\nThe key is withholding the reinforcer that actually maintains the behavior, which is why function comes first. If attention maintains it, attention no longer follows. If escape maintains it, the behavior no longer ends the task (escape extinction). If a sensory consequence maintains it, that sensation is masked or removed (sensory extinction). \"Just ignore it\" counts as extinction only when attention is the reinforcer.\n\nSeveral things look like extinction but aren't: a drop caused by something else, such as punishment; forgetting (weakening from no chance to practice); response blocking (physically stopping the behavior); and noncontingent reinforcement (giving the reinforcer on a time schedule, which lowers motivation for it).\n\nExpect side effects. Early on, the behavior may jump in rate (an extinction burst) or in force or loudness (an initial increase in magnitude), take new forms, or come with emotional outbursts or aggression. Later, it may briefly return on its own (spontaneous recovery), or come back when reinforcement for a replacement behavior stops (resurgence).\n\nBehavior tends to hold out longer in extinction after intermittent reinforcement, under strong motivation, after a long reinforcement history, and when it takes little effort.","keyPoints":["Extinction = the maintaining reinforcer no longer follows the behavior; the behavior can still occur.","Match the form to the function: attention, escape, or sensory extinction.","Not extinction: forgetting, response blocking, NCR, punishment, or any other cause of a decrease.","Expect a burst, new response forms, emotional responding, spontaneous recovery, and possible resurgence.","Intermittent history, strong motivation, long history, and low effort increase resistance to extinction."],"traps":[{"trap":"Assuming \"planned ignoring\" is always extinction.","fix":"Extinction withholds whatever actually maintains the behavior. Ignoring fits only attention-maintained behavior. For escape-maintained behavior, the behavior must stop ending the task."},{"trap":"Calling response blocking or noncontingent reinforcement \"extinction.\"","fix":"In extinction the behavior can still happen but produces nothing. Blocking physically prevents it. NCR delivers the reinforcer on a time schedule regardless of behavior, lowering motivation rather than cutting the response-reinforcer link."},{"trap":"Deciding extinction has failed when the behavior gets worse at first or briefly comes back.","fix":"An early burst is common and often signals the correct reinforcer is being withheld. Spontaneous recovery is usually short if extinction stays in place. Stay consistent: reinforcing the behavior again can bring it right back."}],"example":{"scenario":"Mila, age 6, screams \"Snack!\" at the pantry, and her dad has usually handed her crackers. An assessment confirms the crackers maintain screaming. Dad now never gives crackers after screaming, but does when Mila signs \"please.\" On day two, her screams are louder and she kicks the pantry door.","analysis":"Withholding the crackers that maintained screaming is extinction of positively reinforced behavior. Louder screaming fits an early burst and a rise in magnitude; kicking the door is new response variation. Both are expected and suggest the right reinforcer was withheld. Reinforcing signing gives Mila a better way to get snacks."}}},{"id":"B.10","label":"Kinds of antecedent control over operant behavior","refs":[{"ch":17,"from":396,"to":399,"section":"Stimulus Control: Basic Concepts and Processes","what":"SD and S-delta, generalization, faulty and conditional control, SD versus CS and MO."},{"ch":17,"from":404,"to":405,"section":"Factors Affecting the Development of Stimulus Control","what":"Salience, overselective control, stimulus blocking, and overshadowing."},{"ch":14,"from":330,"to":331,"section":"Discriminative Effects of Punishment","what":"The discriminative stimulus for punishment (SDp) with everyday examples."},{"ch":16,"from":378,"to":379,"section":"Distinguishing Between MOs and SDs","what":"SD signals availability; MO changes value. Headache-and-aspirin comparison."}],"coverage":"strong","gap":"Ch. 17 covers most kinds on pp. 396-399 and 404-405, but the punishment SD (SDp) sits in Ch. 14 and the MO comparison in Ch. 16; exam items mix SD, S-delta, SDp, conditional, faulty, and overselective control.","code":[],"extra":"","domain":"B","content":{"bigIdea":"Stimulus control is present when an antecedent changes how a behavior occurs, and each kind of control differs in what history with consequences gave that antecedent its power.","explainer":"Stimulus control means an antecedent changes how a behavior occurs (its rate, latency, duration, or magnitude) because responding in that stimulus's presence has met different consequences than responding in its absence.\n\nThree signals to know. An SD (discriminative stimulus) marks a history of reinforcement: the response has paid off here. An S-delta marks a history of no reinforcement, or smaller or poorer reinforcement, for that same response. An SDp marks a history of punishment, so the response gets less likely when it appears.\n\nSimple or conditional? In a simple discrimination, one stimulus is enough. In a conditional discrimination, a second stimulus decides which choice is correct: after \"hand me the spoon,\" the spoon is the SD; after \"hand me the cup,\" the cup is.\n\nControl can be flawed. Faulty stimulus control is control by an irrelevant cue, like answer position or color coding on a worksheet. Overselective control is control by an extremely narrow slice of the stimulus, such as one small detail of an object.\n\nNot everything that comes before behavior is an SD. A conditioned stimulus elicits respondent behavior. A motivating operation changes how much a consequence is worth. An SD only signals that the consequence is available.","keyPoints":["Stimulus control: an antecedent changes a response's rate, latency, duration, or magnitude.","SD = history of reinforcement; S-delta = no or weaker reinforcement; SDp = history of punishment.","Simple discrimination: one stimulus controls. Conditional: a second stimulus decides which choice is the SD.","Faulty control = an irrelevant cue runs the behavior; overselective = an extremely narrow set of features does.","SDs signal availability; MOs change value; conditioned stimuli elicit respondent behavior."],"traps":[{"trap":"Calling any antecedent that reliably comes right before a behavior an SD, such as a hard task that sets off escape behavior.","fix":"Ask: with the stimulus gone, would the consequence still be worth having? If yes (valuable but unavailable), it is an SD. If no (escape means nothing without a task), it is a motivating operation."},{"trap":"Treating S-delta as \"the stimulus that means punishment.\"","fix":"An S-delta signals no reinforcement, or weaker reinforcement, for the response. A stimulus correlated with punishment for the response is an SDp."},{"trap":"Mixing up faulty and overselective stimulus control.","fix":"Faulty: an irrelevant cue (position, color, a highlighted word) controls the answer, often because of poorly built materials. Overselective: control is limited to a tiny part of the stimulus, one detail instead of the whole."}],"example":{"scenario":"When Ms. Reyes flicks the lights, her first graders line up, and lining up then earns a sticker. When the substitute flicks the lights, lining up earns nothing, and few students move. Jalen walks in the hallway only when the principal is there; she has scolded him for running before.","analysis":"Ms. Reyes's light flick is an SD: lining up has been reinforced in its presence. The substitute's flick is an S-delta: the same response went unreinforced. The principal is an SDp: running has been punished when she is present, so it happens less around her."}}},{"id":"B.11","label":"Responding selectively versus spreading to similar situations","refs":[{"ch":17,"from":396,"to":397,"section":"Stimulus Discrimination / Stimulus Generalization","what":"Tight versus loose stimulus control, with generalization gradients and examples."},{"ch":17,"from":401,"to":402,"section":"Teaching Concepts","what":"Concepts need generalization within a class and discrimination between classes."},{"ch":30,"from":715,"to":720,"section":"Generalized Behavior Change: Definitions and Key Concepts","what":"Stokes and Baer's definition; setting/situation versus response generalization; overgeneralization; why 'stimulus generalization' is a narrower technical term."}],"coverage":"strong","gap":"","code":[],"extra":"","domain":"B","content":{"bigIdea":"Discrimination is a response staying tied to the stimulus that signaled reinforcement, while generalization is the same response spreading to similar, untrained stimuli; they are two ends of one scale of stimulus control.","explainer":"Discrimination and generalization describe how tightly a behavior is tied to the stimulus that was present when it was reinforced.\n\nStimulus discrimination is tight control. The response happens when the SD is present and rarely when it is absent, because only the SD has been correlated with reinforcement (or better reinforcement).\n\nStimulus generalization is loose control. A response trained with one stimulus also shows up with untrained stimuli that share its physical features. Reinforce a toddler for saying \"bird\" to a robin, and you will likely hear \"bird\" for a sparrow before you hear it for a squirrel.\n\nThe two trade off. A generalization gradient plots responding across test stimuli: a flat line means broad generalization and weak control, while a steeper slope means sharper discrimination. Differential reinforcement moves behavior toward discrimination.\n\nConcepts need both. To learn \"triangle,\" a child must generalize across big, small, tilted, and striped triangles, yet discriminate triangles from squares. So teach with varied examples and with nonexamples.\n\nMind the vocabulary. In applied work, \"generalization\" often means a skill showing up in a new setting (setting/situation generalization) or in new, untrained forms (response generalization). Overgeneralization means the behavior is controlled by an overly broad set of stimuli.","keyPoints":["Discrimination: the response occurs with the SD and rarely without it (tight control).","Generalization: a trained response occurs with untrained, physically similar stimuli (loose control).","Flat gradient = broad generalization, little control; steeper gradient = sharper discrimination.","Concepts need generalization within a class and discrimination between classes.","Setting/situation generalization, response generalization, and maintenance are applied outcome terms."],"traps":[{"trap":"Labeling every new behavior \"generalization\" without saying what spread.","fix":"Same response with a new stimulus or setting = stimulus (setting/situation) generalization. A new, untrained response that does the same job = response generalization. The response lasting after the intervention ends = response maintenance."},{"trap":"Assuming more generalization is always the goal.","fix":"Responding on occasions that do not fit (overgeneralization) means control is too broad. Fix it with discrimination training: reinforce the response with examples and not with nonexamples."},{"trap":"Teaching a concept with examples alone.","fix":"A concept needs generalization within the class and discrimination from other classes. Present varied examples plus nonexamples that come close."}],"example":{"scenario":"A therapist teaches Mia to say \"apple\" to a photo of a red apple. In a probe, Mia also says \"apple\" to a green apple and to a red rubber ball. The therapist then reinforces \"apple\" for many kinds of apples and stops reinforcing it for round red objects that are not apples.","analysis":"Saying \"apple\" to the green apple and the ball is stimulus generalization: both share features with the trained photo. The green apple belongs in the class; the ball shows control that is too broad. Reinforcing varied apples but not look-alikes builds generalization within the class and discrimination from nonmembers."}}},{"id":"B.12","label":"Unlearned motivators such as deprivation, satiation, and pain","refs":[{"ch":16,"from":379,"to":381,"section":"Unconditioned Motivating Operations (UMOs)","what":"Nine UMOs with tables of establishing and abolishing effects."},{"ch":16,"from":373,"to":375,"section":"Definition and Characteristics of Motivating Operations","what":"Value-altering and behavior-altering effects; EO versus AO; evocative versus abative."},{"ch":16,"from":378,"to":379,"section":"Distinguishing Between MOs and SDs","what":"Telling a UMO like pain apart from a discriminative stimulus."},{"ch":16,"from":381,"to":382,"section":"MOs for Punishment","what":"How motivating operations also change punisher effectiveness."},{"ch":16,"from":382,"to":383,"section":"Multiple Effects of MOs","what":"The same event can act as a UMO before behavior and as a punisher or reinforcer after it (Tables 16.3 and 16.4)."}],"coverage":"strong","gap":"","code":[],"extra":"","domain":"B","content":{"bigIdea":"An unconditioned motivating operation changes how effective a consequence is without any learning history (deprivation, temperature extremes, and pain are examples), even though the behaviors it evokes are learned.","explainer":"A motivating operation (MO) is an environmental variable with two effects. Its value-altering effect makes a consequence more effective as a reinforcer (an establishing operation, EO) or less effective (an abolishing operation, AO). Its behavior-altering effect raises (evocative) or lowers (abative) how often, right now, a person does anything that has produced that consequence before.\n\nAn MO is unconditioned (a UMO) when its value-altering effect needs no learning history. Cooper's UMOs that raise value and evoke behavior: deprivation of food, water, sleep, activity, oxygen, or sex; becoming too warm or too cold; and rising pain. The matching events (eating, drinking, sleeping, being active, breathing, sexual stimulation, returning to a comfortable temperature, pain easing) lower value and abate behavior.\n\nOnly the value change is unlearned. The behaviors a UMO evokes, such as asking for a drink or turning on a fan, are usually learned.\n\nA UMO is not an SD. Back pain does not signal that relief is available; it is what makes relief worth anything. No pain, no value in relief.\n\nMOs work on punishers too. With a pounding headache, loud noise punishes more strongly, so turning up the TV becomes less likely.","keyPoints":["Every MO has a value-altering effect and a behavior-altering effect.","EO: raises a reinforcer's value and evokes related behavior. AO: lowers value and abates it.","UMO: the value change needs no learning; the behavior it evokes is usually learned.","Cooper's UMOs: deprivation (food, water, sleep, activity, oxygen, sex), too warm, too cold, more pain.","An SD signals availability; a UMO changes value. MOs also change how well punishers work."],"traps":[{"trap":"Thinking an MO is conditioned whenever the behavior it evokes was learned.","fix":"\"Unconditioned\" refers only to the value-altering effect. Asking for juice is learned, but water deprivation still makes drinks valuable with no learning, so it is a UMO."},{"trap":"Calling pain or hunger an SD because it reliably comes before the behavior.","fix":"For an SD, the consequence stays valuable when the stimulus is absent; it is just unavailable. Pain relief has no value when there is no pain, so pain works as an MO."},{"trap":"Listing \"attention deprivation\" as a UMO.","fix":"For most adults, attention is a conditioned reinforcer, so restricting it acts as a conditioned MO. Cooper notes attention may be unconditioned for infants."}],"example":{"scenario":"After a two-hour hike on a hot afternoon, Marcus, who communicates with a speech-generating device, taps \"water\" again and again and also taps \"fan.\" Once he has finished two bottles of water and cooled off in the air-conditioned van, he stops tapping either button.","analysis":"Water deprivation and becoming too warm are UMOs. They made water and cooling more valuable (establishing effect) and evoked the tapping that had produced them (evocative effect). Drinking and cooling off then acted as abolishing operations, lowering that value and abating the tapping."}}},{"id":"B.13","label":"Behavior guided by rules versus direct experience","refs":[{"ch":2,"from":42,"to":42,"section":"Complexity of the Human Repertoire","what":"Rule-governed versus contingency-shaped behavior defined; rules learned faster than shaping."},{"ch":11,"from":255,"to":255,"section":"Immediacy of Reinforcement","what":"Rules explain effects of delayed consequences; five signs behavior is rule-governed."},{"ch":13,"from":303,"to":303,"section":"Schedule Effects and Consistency of Performance","what":"A person's own rule overrides schedule effects: responding persists during extinction."},{"ch":20,"from":519,"to":520,"section":"Excessive Rule Following Interferes with Well-being Behaviors","what":"Rule-governed behavior (instructional control) is often insensitive to changing contingencies; how rigid self-rules cause problems."},{"ch":18,"from":427,"to":427,"section":"Verbal Function-altering Effect","what":"A heard instruction changes how later stimuli work; some authors reserve 'rule-governed behavior' for this effect."}],"coverage":"partial","gap":"The pieces are scattered: rules are learned faster (p. 42), delayed outcomes act through rules rather than direct reinforcement (p. 255), and rule-governed behavior resists changing contingencies (pp. 303, 519). The book never sets the two kinds side by side.","code":[],"extra":"Footnote 3 on p. 255 lists deeper readings; Hayes (1989) and Malott & Shane (2014) both treat rules versus direct contingencies in depth.","domain":"B","content":{"bigIdea":"Rule-governed behavior is controlled by words that describe a contingency, while contingency-shaped behavior is selected by consequences the person has contacted directly.","explainer":"Some behavior is learned by doing. You act, a consequence follows within seconds, and over many repetitions those consequences select what works. Cooper calls this contingency-shaped behavior, and notes that \"contingency-selected\" may be the more accurate label, since everyday environments rarely shape new behavior step by step.\n\nOther behavior happens because the contingency was put into words. A rule is a verbal statement of an antecedent-behavior-consequence relation: \"Save your work every 10 minutes or a crash can wipe it out.\" Behavior controlled by a rule is rule-governed behavior, also called instructional control. Rules can come from other people or from the person herself (self-rules).\n\nWhy it matters: reinforcement works directly only over a few seconds. When a grade, paycheck, or award weeks away seems to change behavior, the change is coming through language and rule following, not through direct reinforcement.\n\nRules have real advantages. They are learned faster than shaped behavior, and they let people act effectively without ever contacting the contingency. The cost: rule-governed behavior often stays the same when the actual contingencies change, so people may keep following an outdated or self-made rule that no longer pays off.","keyPoints":["Rule = a verbal description of a contingency: in this situation, this behavior leads to this outcome.","Contingency-shaped = selected by consequences the person contacted directly and quickly.","A response-to-consequence delay of more than 30 seconds is a strong sign the change is not direct reinforcement; look for a rule.","Rules are learned faster than shaping and work even when the person has no history with the contingency.","Rule-governed behavior, including behavior under self-rules, often resists change when the real contingencies shift."],"traps":[{"trap":"Believing a reward that arrives weeks or months later (a grade, a bonus, a trophy) reinforced the behavior directly.","fix":"Direct reinforcement works over seconds; with a long delay, other behavior comes in between. If a remote outcome seems to work, a rule linking the behavior to that outcome is doing the work."},{"trap":"Assuming a rule has to come from someone else, like a teacher, parent, or supervisor.","fix":"People also generate their own rules from experience (\"I always freeze on tests\"). Self-rules control behavior just as rules from others do, and they can be wrong."},{"trap":"Expecting rule-following to adjust as soon as the consequences change.","fix":"Contingency-shaped behavior tracks the consequences it contacts. Rule-governed behavior often does not: a person may keep responding through extinction because of a rule she holds."}],"example":{"scenario":"A new RBT's supervisor tells her, \"Finish session notes within 24 hours, or the insurance claim can be denied next month.\" She has never had a claim denied and gets no praise for timely notes, yet she writes every note the same day.","analysis":"A denial weeks away, one she has never contacted, cannot reinforce or punish note writing directly. Her same-day notes are controlled by the supervisor's verbal description of the contingency, so this is rule-governed behavior (instructional control)."}}},{"id":"B.14","label":"Mand, tact, echoic, intraverbal, and other basic operants","refs":[{"ch":18,"from":415,"to":417,"section":"The Elementary Verbal Operants and Listener Discriminations; Classifying the Verbal Operants","what":"Each operant's controlling antecedent and consequence, plus a classification flowchart."},{"ch":18,"from":417,"to":420,"section":"Motivating Operations and the Mand","what":"Mands controlled by MOs and specific reinforcement; types of mands."},{"ch":18,"from":420,"to":422,"section":"Nonverbal Stimulus Control and the Tact","what":"Tacts under nonverbal stimulus control; private events, tact extension and abstraction."},{"ch":18,"from":424,"to":427,"section":"Verbal Behavior Controlled by Verbal SDs","what":"Echoic, imitation, copying text, textual, taking dictation, and intraverbal in detail."}],"coverage":"strong","gap":"The chapter files echoic, motor imitation, and copying text under 'duplic' and textual and taking dictation under 'codic'; the exam's 'transcription' is the book's 'taking dictation'.","code":[],"extra":"","domain":"B","content":{"bigIdea":"Each elementary verbal operant is defined by what evokes it (a motivating operation, a nonverbal stimulus, or a verbal stimulus) and what reinforces it, never by the words themselves.","explainer":"Skinner sorted verbal behavior by function: what evokes a response and what reinforces it. The words alone never tell you the operant, and the same word can be a different operant on different occasions.\n\nMand: evoked by a motivating operation (MO) and reinforced by the specific thing that MO made valuable. A chilly child says \"blanket\" and is handed one.\n\nTact: evoked by something nonverbal the speaker contacts (sees, hears, smells, feels) and reinforced by generalized conditioned reinforcement such as praise. A child spots a rainbow and says \"rainbow.\"\n\nThe rest are evoked by verbal stimuli, the products of someone's verbal behavior.\n\nDuplic: the response has formal similarity to the stimulus (same sense mode, physical resemblance). This covers the echoic (hear \"go,\" say \"go\"), motor imitation of signs, and copying text.\n\nCodic: parts correspond point to point, but the modes differ. This covers textual behavior (see a printed word, say it) and taking dictation (hear a word, write it; exam items often call this transcription).\n\nIntraverbal: no point-to-point correspondence. \"What do bees make?\" leads to \"Honey.\"\n\nTo classify, ask in order: Does an MO control the form? Is the antecedent nonverbal? If it is verbal, is there formal similarity? If not, point-to-point correspondence? If neither, it is intraverbal.","keyPoints":["Mand: MO plus specific reinforcement (you get what you asked for).","Tact: nonverbal stimulus plus generalized conditioned reinforcement (praise, \"that's right\").","Duplic (echoic, sign imitation, copying text): verbal stimulus with formal similarity.","Codic (textual, taking dictation): point-to-point correspondence without formal similarity.","Intraverbal: verbal stimulus with no point-to-point correspondence, such as answering a question."],"traps":[{"trap":"Classifying by the word said, as in \"any time a child says 'cookie' it is a mand.\"","fix":"Ask what evoked the response and what followed it. Wanting a cookie and then getting one is a mand. Seeing a cookie and hearing \"Yes, cookie!\" is a tact."},{"trap":"Calling every answer to a question an intraverbal.","fix":"If the answer depends on an object in view (\"What color is this crayon?\" while holding it), nonverbal control is involved, and Cooper treats such a response as part tact, part intraverbal. A pure intraverbal needs only the words."},{"trap":"Mixing up textual behavior, copying text, and taking dictation.","fix":"Name the two modes. See print and say it: textual. See print and write it: copying text (a duplic, formal similarity). Hear words and write them: taking dictation (a codic)."}],"example":{"scenario":"At snack, Mia (age 4) points to a bag and says \"pretzel.\" Her therapist hands her one and she eats it. Later, paging through a picture book after lunch, Mia sees a pretzel and says \"pretzel,\" and the therapist says, \"Yes, a pretzel!\"","analysis":"Same word, two operants. At snack, an MO (wanting pretzels) evoked it and the pretzel itself followed: a mand. In the book, the picture, a nonverbal stimulus, evoked it and praise followed: a tact."}}},{"id":"B.15","label":"New untaught relations emerging from taught ones","refs":[{"ch":19,"from":453,"to":456,"section":"Research Foundations and Core Concepts","what":"Sidman's reading studies; reflexivity, symmetry, transitivity, and emergent relations defined."},{"ch":18,"from":423,"to":424,"section":"Generative Learning","what":"Equivalence, recombinative generalization via matrix training, bidirectional naming, joint control, RFT."},{"ch":20,"from":500,"to":502,"section":"The Vocabulary of Nonequivalence Relations","what":"Mutual entailment, combinatorial entailment, and transformation of function beyond 'same as' relations."},{"ch":2,"from":42,"to":42,"section":"Complexity of the Human Repertoire","what":"Quick learning without direct teaching: equivalence and contingency adduction introduced."},{"ch":30,"from":721,"to":721,"section":"Other Types of Generalized Outcomes","what":"Short roundup of emergent performances: equivalence, recombinative generalization, bidirectional naming, relational framing, contingency adduction."}],"coverage":"strong","gap":"","code":[],"extra":"","domain":"B","content":{"bigIdea":"With the right teaching arrangement, learners show new relations and skills that were never directly taught or reinforced, so a small amount of instruction produces a large amount of learning.","explainer":"Generative learning is when skills a learner already has make new skills appear, or arrive faster, without direct teaching or reinforcement of the new skill. A few taught relations can produce many.\n\nStimulus equivalence. Using matching-to-sample, teach A to B and A to C (spoken word to picture; spoken word to printed word). Then probe, with no reinforcement, for reflexivity (match a stimulus to itself), symmetry (reverse a trained relation, B to A), and transitivity, usually checked with a combined equivalence test (relate two stimuli never paired, B to C). Passing all of them means the stimuli form an equivalence class and are interchangeable.\n\nTransfer of function. Once a class forms, a new function taught for one member (fear, value, an action) spreads to the other members.\n\nBeyond \"same as.\" Relational frame theory widens the terms. Mutual entailment is any derived reverse relation (taller one way, shorter the other). Combinatorial entailment is a relation derived through a shared stimulus. Transformation of function means functions change in line with the relation.\n\nRecombinative generalization. Taught \"big dog\" and \"little cat,\" the learner says \"little dog.\" Matrix training builds this. Bidirectional naming and contingency adduction are other generative routes.","keyPoints":["Emergent (derived) relations appear on probe trials without reinforcement; nobody taught them directly.","Reflexivity: A = A. Symmetry: if A = B, then B = A. Transitivity: if A = B and B = C, then A = C.","Transfer of function: something learned about one class member carries over to the other members.","RFT terms: mutual entailment includes symmetry; combinatorial entailment includes transitivity; transformation includes transfer of function.","Recombinative generalization (via matrix training) and bidirectional naming also produce untaught responses."],"traps":[{"trap":"Calling any untrained correct response \"stimulus generalization.\"","fix":"Generalization rests on physical similarity to a trained stimulus. Equivalence links stimuli that look nothing alike (a spoken word, a picture, a printed word) because of how they were related in training."},{"trap":"Mixing up symmetry and transitivity.","fix":"Symmetry reverses one trained pair (taught A to B, shows B to A). Transitivity links two stimuli never trained together through a shared one (taught A to B and B to C, shows A to C)."},{"trap":"Assuming every derived relation means \"same as.\"","fix":"Opposite, more-than, and before-after relations are derived too, and the reverse can differ: if Sam is taller than Ana, then Ana is shorter than Sam. That is mutual entailment, not symmetry."}],"example":{"scenario":"An RBT teaches Jordan to pick the numeral 7 when he hears \"seven,\" and to pick a card showing seven dots when he hears \"seven.\" She never pairs numerals with dot cards. On unreinforced probes, Jordan matches the numeral 7 to the seven-dot card, and the dot card to the numeral.","analysis":"The numeral and the dots were each tied to the spoken word, never to each other. Matching them in both directions passes the combined equivalence test (symmetry plus transitivity), so the three stimuli likely form an equivalence class: new relations from limited teaching."}}},{"id":"C.1","label":"What we can measure about a behavior","refs":[{"ch":4,"from":76,"to":80,"section":"Measurable Dimensions of Behavior","what":"The three basic properties (repeatability, temporal extent, temporal locus); count, rate, celeration, duration, latency, and IRT explained."},{"ch":4,"from":80,"to":82,"section":"Derivative Measures: Percentage; Trials-to-Criterion","what":"Derived measures: percent and number of tries to reach a goal, with their limits."},{"ch":4,"from":82,"to":83,"section":"Definitional Measures","what":"Topography (form) and magnitude (force or loudness) as measurable features."},{"ch":4,"from":84,"to":86,"section":"Table 4.1 (Fundamental, derived, and definitional dimensions)","what":"One-stop summary table: each dimension, how to calculate it, and sample statements."}],"coverage":"strong","gap":"","code":[],"extra":"","domain":"C"},{"id":"C.2","label":"Describing behavio er"},{"ch":27,"from":630,"to":630,"section":"Teach Alternative Behaviors","what":"Using FBA results to pick a replacement that serves the same function"}],"coverage":"strong","gap":"","code":["2.14"],"extra":"","domain":"H"},{"id":"H.5","label":"Side effects of reinforcement, extinction, and punishment","refs":[{"ch":14,"from":336,"to":338,"section":"Possible Side Effects and Problems with Punishment","what":"Aggression, escape, contrast, modeling, and overuse by the person punishing"},{"ch":15,"from":367,"to":367,"section":"Response Cost Considerations","what":"Fines can spark aggression, avoidance of the setting, and less of the wanted behavior"},{"ch":24,"from":586,"to":589,"section":"Secondary Effects of Extinction","what":"Bursts, new response variations, spontaneous recovery, resurgence, and aggression"},{"ch":12,"from":298,"to":298,"section":"Changes in Teacher and Caregiver Responding as a Function of Negative Reinforcement","what":"How relief from problem behavior can strengthen poor caregiver habits"},{"ch":13,"from":309,"to":310,"section":"Thinning Intermittent Reinforcement","what":"Ratio strain from thinning too fast: pausing, avoidance, aggression"}],"coverage":"strong","gap":"No single section on reinforcement's downsides; more is scattered: DRA relapse and resurgence (p. 599) and DRO accidentally strengthening other behavior (p. 605).","code":["2.14","2.15"],"extra":"","domain":"H"},{"id":"H.6","label":"Checking client progress and treatment fidelity","refs":[{"ch":10,"from":226,"to":230,"section":"Treatment Integrity/Procedural Fidelity","what":"Why fidelity matters, threats like drift, and how to measure it"},{"ch":6,"from":145,"to":152,"section":"Interpreting Graphically Displayed Behavioral Data","what":"Reading level, trend, and variability within and between phases"},{"ch":4,"from":74,"to":75,"section":"Practitioners Need Measurement","what":"Ongoing versus before-and-after evaluation, and mistakes made without data"}],"coverage":"strong","gap":"Fidelity material is written for researchers; she must translate it into routine checks on RBTs and caregivers carrying out her plans.","code":["2.17","2.18"],"extra":"","domain":"H"},{"id":"H.7","label":"Using data to keep, change, or stop procedures","refs":[{"ch":4,"from":74,"to":75,"section":"Practitioners Need Measurement","what":"Frequent data drive decisions to continue, modify, or end treatment"},{"ch":6,"from":150,"to":152,"section":"Visual Analysis Between Conditions","what":"Judging whether graphed data show real change across conditions"},{"ch":31,"from":780,"to":780,"section":"Evidenced-based Best Practice and Least Restrictive Alternatives","what":"No progress: review data and modify; progress: fade and check generalization"},{"ch":30,"from":749,"to":751,"section":"Modifying and Terminating Successful Interventions","what":"Withdrawing intervention parts step by step while performance holds"}],"coverage":"strong","gap":"No general rule for when to change a program (e.g., how many flat sessions); the one concrete rule is for punishment (adjust if no clear drop within two sessions, p. 346), and p. 244 only notes that formal rules for reading graphs exist.","code":["2.17","2.18"],"extra":"","domain":"H"},{"id":"H.8","label":"Working with caregivers and other professionals","refs":[{"ch":31,"from":775,"to":776,"section":"Coordinating with Other Professionals","what":"Working on interdisciplinary teams and weighing other providers' treatments"},{"ch":30,"from":752,"to":753,"section":"Involve Significant Others","what":"Enlist family and staff as active supporters, and ask others not to undercut the plan"},{"ch":3,"from":51,"to":52,"section":"Interviewing Significant Others","what":"Gathering caregiver input and checking their willingness to help implement"},{"ch":3,"from":66,"to":67,"section":"Prioritizing Target Behaviors","what":"Settling goal conflicts by involving client, parents, and staff in choosing goals"},{"ch":10,"from":228,"to":229,"section":"Training, Practice, and Feedback","what":"Training caregivers and staff with modeling, rehearsal, and feedback"}],"coverage":"partial","gap":"Little on everyday teamwork: routinely sharing data with teachers, SLPs, OTs, or physicians, and documenting collaboration as the Code requires; disagreements are covered mainly for unproven treatments (pp. 775-776) and goal conflicts (pp. 66-67).","code":["2.09","2.10","3.06"],"extra":"Ethics Code 2.09, 2.10, and 3.06; the collaboration papers cited on p. 775 (Brodhead, 2015; Kelly & Tincani, 2013).","domain":"H"},{"id":"I.1","label":"Why good supervision matters; costs of poor supervision","refs":[{"ch":31,"from":766,"to":766,"section":"Recognizing the Need","what":"Why supervision drives service quality; BACB supervisor training requirements"},{"ch":31,"from":767,"to":767,"section":"Developing the Supervisor's Skill Set","what":"When supervision fails: skills go untaught, supervisees may quit the field, and overloaded supervisors train poorly"},{"ch":31,"from":768,"to":768,"section":"Developing the Supervisor's Skill Set","what":"Two cases: a struggling supervisee stalling client progress, an absent supervisor"}],"coverage":"partial","gap":"Risks get one sentence (supervisee leaves the field, strained relationship, harm to the field's image) plus two cases; job satisfaction is never mentioned and no step-by-step supervision model is taught.","code":["4.02","4.03","4.04","4.06"],"extra":"Sellers, Valentino & LeBlanc (2016), 'Recommended practices for individual supervision of aspiring behavior analysts,' Behavior Analysis in Practice.","domain":"I"},{"id":"I.2","label":"Rapport, two-way feedback, and trust with supervisees","refs":[{"ch":31,"from":768,"to":768,"section":"Figure 31.5 Identifying and Managing Performance Issues in a Supervisory Context","what":"Raising a performance problem supportively and reinforcing progress"},{"ch":31,"from":766,"to":767,"section":"Developing Competence in Supervision and Mentorship","what":"The supervisor as lifelong mentor; strained supervisory relationships hurt learning"}],"coverage":"thin","gap":"Active listening, reciprocal feedback, and building rapport with supervisees aren't taught; the book only notes that damaged relationships hurt outcomes.","code":["1.13","4.06","4.08"],"extra":"LeBlanc, Sellers & Ala'i (2020), Building and Sustaining Meaningful and Effective Relationships as a Supervisor and Mentor.","domain":"I"},{"id":"I.3","label":"Making supervision fair and equitable for everyone","refs":[{"ch":31,"from":762,"to":762,"section":"Personal Histories","what":"Not about supervision: how your background can bias professional judgment"}],"coverage":"none","gap":"Equity in supervision (fair access to training and opportunities, unbiased evaluation, adjusting for supervisee differences) is absent from the book.","code":["1.07","1.08","4.07"],"extra":"Study Code 1.07, 1.08, and 4.07 closely; exam equity questions will rest on these standards.","domain":"I"},{"id":"I.4","label":"Spelling out who does what in supervision","refs":[{"ch":31,"from":767,"to":768,"section":"Developing the Supervisor's Skill Set","what":"Write down supervision terms and both people's expectations at the start; the Anca case shows what happens when you don't"},{"ch":31,"from":768,"to":768,"section":"Figure 31.5 Identifying and Managing Performance Issues in a Supervisory Context","what":"Before blaming the supervisee, ask whether you ever stated your expectations clearly"},{"ch":28,"from":672,"to":673,"section":"Contingency Contract Components","what":"Model for specific terms: who, what, when, how well"}],"coverage":"partial","gap":"Book cites the old Code's 5.05 supervision contract; the supervisor's own duties (meeting schedule, feedback timing) get little detail.","code":["1.04","4.01","4.06"],"extra":"Sellers, Valentino & LeBlanc (2016) describe setting up the supervisory relationship and its written agreement.","domain":"I"},{"id":"I.5","label":"Assess the supervisee first, then pick training targets","refs":[{"ch":31,"from":766,"to":766,"section":"Developing the Supervisor's Skill Set","what":"Skill areas to build: conceptual, applied, social, time management, ethics"},{"ch":31,"from":768,"to":768,"section":"Figure 31.5 Identifying and Managing Performance Issues in a Supervisory Context","what":"Pinpointing specific deficits and writing a development plan"},{"ch":5,"from":107,"to":107,"section":"Selecting Observers Carefully","what":"Pretest a trainee's current skill before training begins"}],"coverage":"thin","gap":"No supervisee skill-assessment tools (competency checklists, observation rubrics) or method for deciding which skills to target first.","code":["4.06","4.08","4.09"],"extra":"Sellers, Valentino & LeBlanc (2016); the BCaBA Test Content Outline also works as a skills self-check list.","domain":"I"},{"id":"I.6","label":"Teaching supervisees new procedures until they master them","refs":[{"ch":31,"from":768,"to":768,"section":"Figure 31.5 Identifying and Managing Performance Issues in a Supervisory Context","what":"Fix a specific skill gap with instructions, modeling, rehearsal, and feedback"},{"ch":10,"from":228,"to":229,"section":"Training, Practice, and Feedback","what":"Written steps alone fail; add modeling, rehearsal, feedback to criterion"},{"ch":11,"from":271,"to":272,"section":"Box 11.2 Training Practitioners to Conduct Stimulus Preference Assessments (SPA)","what":"Training staff on preference assessments: video models, practice, feedback, boosters"},{"ch":5,"from":107,"to":107,"section":"Training Observers to an Objective Standard of Competency","what":"Five-step, criterion-based training for data collectors"},{"ch":28,"from":662,"to":662,"section":"Training Staff","what":"Model-lead-test, role-play, feedback, and booster sessions for staff"}],"coverage":"partial","gap":"Behavioral skills training (BST) is never named or taught as a package; Figure 31.5 lists its four parts in one line, and the eviden
