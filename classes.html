.9.","page":637,"ch":27},{"term":"conditioned motivating operation (CMO)","def":"A motivating operation whose value-altering effect is learned, not inborn. Example: needing to open a tight jar makes a jar opener valuable and evokes asking for one.","page":378,"ch":16},{"term":"conditioned negative reinforcer","def":"A stimulus that started neutral but now strengthens behavior that removes it, because it was paired with other negative reinforcers. Example: a boss's frown, after frowns came with reprimands.","page":291,"ch":12},{"term":"conditioned punisher","def":"A stimulus that starts neutral but, after pairing with other punishers, weakens behavior it follows. Example: 'No!' once paired with losing a toy. Also called a secondary or learned punisher.","page":28,"ch":2},{"term":"conditioned reflex","def":"A learned reflex: a stimulus elicits a response only because of the person's own life history (ontogeny). Example: feeling queasy at the smell of a food that made you sick.","page":28,"ch":2},{"term":"conditioned reinforcer","def":"A reinforcer with learned power: it was once neutral, but pairing with other reinforcers made it work (e.g., praise, tokens, money). Also called a secondary or learned reinforcer.","page":28,"ch":2},{"term":"conditioned stimulus (CS)","def":"A stimulus that elicits respondent behavior only because of pairing: it was neutral until paired with a US (unconditioned stimulus) or another CS. Example: the dentist's drill sound.","page":28,"ch":2},{"term":"confidentiality","def":"Keeping client information private: nothing about a current or past client is shared with anyone unless the client (or guardian) gives explicit, usually signed, permission, apart from limited legal exceptions.","page":760,"ch":31},{"term":"conflict of interest","def":"Being pulled two ways: a personal or professional interest competes with your duties, making impartial judgment hard. Example: recommending extra therapy hours when your bonus depends on billing.","page":759,"ch":31},{"term":"confounding variable","def":"Something outside the experimenter's control that does or may affect the behavior being measured, muddying conclusions about the independent variable. Example: a medication change midway through a study.","page":157,"ch":7},{"term":"conjunctive schedule (conj)","def":"Reinforcement comes only when the requirements of two or more schedules have all been met (e.g., 10 responses AND 2 minutes elapsed).","page":314,"ch":13},{"term":"consequence","def":"The 'C' in ABC: any stimulus change following a behavior. Not all matter equally: those that come right away and fit the person's current motivation shape future behavior most.","page":28,"ch":2},{"term":"constant time delay","def":"Shifts control from prompts to the natural cue: prompt right after the instruction (0-s delay) for a few trials, then always wait a fixed time (often 3–4 s) before prompting.","page":406,"ch":17},{"term":"contextual control","def":"Context decides a stimulus's function: a third layer of antecedent control (five-term contingency), so one stimulus can join different equivalence classes (e.g., 'bat' at a zoo vs. a ballpark).","page":458,"ch":19},{"term":"contextual stimulus","def":"A cue telling the learner which kind of relating pays off (gets reinforced) here: sameness, opposition, comparison, etc. Example: the words 'is the opposite of.'","page":508,"ch":20},{"term":"contingency","def":"How operant behavior and the variables controlling it are related: whether a consequence depends on the behavior, and how they line up in time. Often summarized as the three-term contingency.","page":26,"ch":2},{"term":"contingency contract","def":"A mutually agreed, written if-then deal: do specific tasks, earn specific reinforcers. Example: dishes nightly earns the car on Saturday. Also called behavioral contract.","page":657,"ch":28},{"term":"contingency reversal","def":"Swapping the reinforcement contingencies of two different responses. Example: calling out had earned attention and hand-raising was ignored; now hand-raising earns attention and calling out is ignored.","page":634,"ch":27},{"term":"contingency-shaped behavior","def":"Behavior learned by directly experiencing its consequences, not by following a rule or instruction. Example: learning how hard to push a stiff door by trying.","page":42,"ch":2},{"term":"contingent","def":"A consequence is contingent when it depends on the behavior: it is delivered only if, and after, the target behavior happens.","page":37,"ch":2},{"term":"contingency space analysis","def":"Graphs a consequence's probability with versus without a behavior. More likely with it: positive contingency; less likely: negative; no difference: neutral. Example: attention follows 70% of yells, 10% otherwise.","page":637,"ch":27},{"term":"contingent observation","def":"Time-out within the same setting: the person can still watch the activity but is moved out of the action, losing access to reinforcement. Example: a sideline seat during the game.","page":354,"ch":15},{"term":"continuous measurement","def":"Measurement where nothing slips through: every time the target behavior occurs during the session, it gets recorded. Examples: event recording, duration, latency.","page":104,"ch":5},{"term":"continuous reinforcement (CRF)","def":"Reinforcing the target behavior every single time it occurs (same as FR 1). Most useful when first teaching a new behavior.","page":302,"ch":13},{"term":"contrived contingency","def":"A contingency that exists only because a practitioner designed it: planned reinforcement or punishment to build, keep, or generalize a behavior change. Example: a token board for homework.","page":722,"ch":30},{"term":"contrived mediating stimulus","def":"A cue that gains control over the skill during teaching, then prompts it in new settings. Example: a wallet card of ordering steps, practiced in class, used at restaurants.","page":744,"ch":30},{"term":"copying text","def":"An elementary verbal operant: writing evoked by written words that it matches in form (formal similarity), with a history of generalized reinforcement. Example: copying spelling words off the board.","page":415,"ch":18},{"term":"count","def":"A simple tally of how many times a behavior happens. Always note the observation time: 12 hits in 5 minutes isn't like 12 in an hour.","page":76,"ch":4},{"term":"countercontrol","def":"Pushback against coercive or aversive control: the controlled person escapes, attacks, or passively resists the controller. Example: a harshly scolded employee quietly slows down on purpose.","page":763,"ch":31},{"term":"counting time","def":"The period during which responses are counted. You need it to turn a count into a rate.","page":76,"ch":4},{"term":"cumulative record","def":"A graph where each response adds to a running total on the vertical axis, so the line never drops; steeper slope = higher response rate.","page":127,"ch":6},{"term":"cumulative recorder","def":"Lab machine for cumulative records: a roll of paper scrolls at constant speed while a pen ticks upward each time a response occurs, plotting rate live.","page":134,"ch":6},{"term":"data","def":"Usually numbers: the results you get from measuring. In ABA, they capture a measurable dimension of behavior, like rate or duration. Plural: 'the data show'; one value is a 'datum.'","page":125,"ch":6},{"term":"data path","def":"The straight lines joining each data point to the next one in the same series. Together they show the level and trend of behavior over time.","page":128,"ch":6},{"term":"deictic relation","def":"Relating yourself, treated as one stimulus, to things outside you; the basis of perspective-taking (I/you, here/there, now/then).","page":503,"ch":20},{"term":"delay discounting","def":"The further off a reward is, the less it sways choices now, no matter how big or important (e.g., choosing $20 today over $50 next month). Also called temporal discounting.","page":684,"ch":29},{"term":"delayed multiple baseline design","def":"A multiple baseline whose baselines don't start together: one tier (behavior, setting, or person) begins first, sometimes even reaching treatment, and the other tiers' baselines are added later, staggered.","page":199,"ch":9},{"term":"dependent group contingency","def":"The whole group's reinforcer rides on one member (or a few): if they meet the goal, everyone earns it. Example: everyone gets game time if Jordan finishes his reading log.","page":665,"ch":28},{"term":"dependent variable","def":"An experiment's 'effect' side: the behavior measure you watch for change as the independent variable is manipulated. In ABA, a measure of socially significant behavior (e.g., words read per minute).","page":127,"ch":6},{"term":"deprivation","def":"Going without: the time since someone last had a particular reinforcer. Also a procedure: holding back a reinforcer before a session so it works better. Opposite: satiation.","page":37,"ch":2},{"term":"derived stimulus relations","def":"Relations a learner shows without direct teaching, arising indirectly from other teaching or experience. Example: taught A>B and B>C, she says A>C. Also called emergent stimulus relations.","page":455,"ch":19},{"term":"descending baseline","def":"A baseline whose data path trends downward: the measure keeps falling across sessions.","page":163,"ch":7},{"term":"descriptive functional behavior assessment","def":"Watching problem behavior where it naturally happens and recording what comes before and after it, without changing anything. Examples: ABC recording, scatterplots.","page":635,"ch":27},{"term":"determinism","def":"A core assumption of science: the world is orderly, so events, behavior included, are lawfully related to other events, not random chance. That's why behavior can be predicted and changed.","page":4,"ch":1},{"term":"differential reinforcement","def":"Reinforce the responses that hit a set standard (long enough, right form) and let the rest of that response class go unreinforced (extinction). Basis of shaping, DRA, DRI, DRO.","page":541,"ch":22},{"term":"differential reinforcement of alternative behavior (DRA)","def":"Cut problem behavior by reinforcing a desirable alternative behavior while the problem behavior no longer earns reinforcement. Example: asking for a break earns one; tearing the worksheet doesn't.","page":596,"ch":25},{"term":"differential reinforcement of diminishing rates (DRD)","def":"Reinforcement after each interval in which responses stayed under a criterion that is gradually lowered (e.g., fewer than 6, then 4, then 2 call-outs per 10 minutes).","page":311,"ch":13},{"term":"differential reinforcement of high rates (DRH)","def":"Reinforcement at the end of an interval if responses exceed a criterion that is gradually raised (e.g., more than 4, then 6, then 9 math facts per 2 minutes).","page":310,"ch":13},{"term":"differential reinforcement of incompatible behavior (DRI)","def":"Reducing problem behavior by reinforcing a behavior that can't physically occur at the same time, and withholding reinforcement for the problem. Example: reinforcing hands in lap instead of hair-pulling.","page":596,"ch":25},{"term":"differential reinforcement of low rates (DRL)","def":"Lowers a behavior that's fine but too frequent: reinforce each response spaced a minimum time after the last, or responses kept at or under a set count per period.","page":310,"ch":13},{"term":"differential reinforcement of other behavior (DRO)","def":"Reinforcement is delivered when the problem behavior has not occurred during an interval or at a set moment (momentary DRO). Example: a sticker for every 10 minutes without spitting.","page":596,"ch":25},{"term":"direct measurement","def":"Measuring the very behavior you care about, not a stand-in for it. Example: counting a child's correct words read, rather than asking the teacher to rate her reading.","page":103,"ch":5},{"term":"direct replication","def":"Re-running a study as an exact copy, changing nothing about its conditions, to check whether the original results repeat.","page":238,"ch":10},{"term":"disciplinary standards","def":"What happens after a violation: the BACB's rules for corrective action, discipline, or revoking a credential, scaled to the circumstances.","page":764,"ch":31},{"term":"discontinuous measurement","def":"Measurement that samples behavior, so some occurrences can slip through unrecorded. Examples: partial-interval, whole-interval, and momentary time sampling.","page":104,"ch":5},{"term":"discrete trial","def":"An operant that can occur only when a chance is given, so the number of chances sets its rate (e.g., after 'Touch red'). Also called restricted or controlled operant.","page":78,"ch":4},{"term":"discriminated avoidance","def":"Avoidance with a warning: a signal comes first, and responding while it's on keeps an aversive stimulus from ever starting. Example: ducking at 'Heads up!' so the ball misses.","page":289,"ch":12},{"term":"discriminated operant","def":"An operant whose frequency depends on the antecedent situation: it occurs more when certain stimuli are present. Example: a child asks Grandma for candy far more than Dad.","page":40,"ch":2},{"term":"discriminative stimulus (SD)","def":"A stimulus that evokes a behavior because that behavior was reinforced when the stimulus was present and not when it was absent. Example: an 'Open' sign evokes trying the door.","page":35,"ch":2},{"term":"discriminative stimulus for punishment (SDp)","def":"A cue for likely punishment: the behavior was punished when this stimulus was present, not when absent, so it now occurs less around it. Example: cursing less near the boss.","page":330,"ch":14},{"term":"distinction relation","def":"Relating two stimuli to each other by how they differ rather than how they're alike (e.g., 'a bat is not a bird').","page":503,"ch":20},{"term":"double-blind control","def":"Neither the participant nor the researchers can tell when the treatment is present, so expectations, differential treatment, and observer bias can't confound results. Example: medication vs. look-alike placebo.","page":226,"ch":10},{"term":"DRI/DRA reversal technique","def":"A control for testing reinforcement: instead of baseline, the same reinforcer follows an incompatible or alternative behavior. Higher target responding during reinforcement shows the contingency, not mere contact, mattered.","page":172,"ch":8},{"term":"DRO reversal technique","def":"A control for testing reinforcement: instead of baseline, the same reinforcer follows set periods without the target behavior (DRO). Higher responding during reinforcement shows the contingency, not mere contact, mattered.","page":178,"ch":8},{"term":"drop-out component analysis","def":"A component analysis: begin with the whole package (e.g., prompts, praise, tokens), then take parts away one by one. A part is essential if outcomes slip without it.","page":224,"ch":10},{"term":"duplic","def":"Verbal behavior whose form copies a verbal stimulus with formal similarity (same sense mode, looks or sounds alike), kept going by generalized reinforcement. Echoics and copying text are examples.","page":415,"ch":18},{"term":"duration","def":"How long a behavior lasts, timed from start to finish; can also be totaled across a session. Example: a 4-minute tantrum, or 20 total minutes of reading.","page":74,"ch":4},{"term":"echoic","def":"A verbal operant where hearing someone say something evokes saying the same thing back; stimulus and response sound alike (formal similarity), with generalized reinforcement. Teacher: \"ball.\" Child: \"ball.\"","page":415,"ch":18},{"term":"ecological assessment","def":"Looking at the whole picture: collecting data across a person's settings and people (home, school, work, family) because behavior and surroundings shape each other in complex ways.","page":58,"ch":3},{"term":"elementary verbal operants","def":"Five basic types of speaker behavior (mand, tact, intraverbal, duplic, codic), each told apart by the antecedent that evokes it and its reinforcement history. Michael's (1982) label for Skinner's categories.","page":415,"ch":18},{"term":"emergent stimulus relations","def":"Untaught stimulus relations that show up because other, linked relations were taught or experienced. Example: taught A-B and B-C, a learner matches C to A. Also called derived stimulus relations.","page":455,"ch":19},{"term":"empiricism","def":"Basing knowledge on objective observation: a finding counts only if anyone could watch and verify it, not because of the scientist's hunches or preferences.","page":4,"ch":1},{"term":"enriched environment","def":"Making preferred items and activities freely available, not earned by any behavior, so the person has a richer alternative to the stimulation problem behavior provides. Same as environmental enrichment.","page":615,"ch":26},{"term":"environment","def":"Everything actually going on around the person, or around the body part in question. Behavior never happens in a vacuum; there is always an environment it occurs in.","page":26,"ch":2},{"term":"environmental enrichment (EE)","def":"An antecedent strategy: preferred items and activities are freely available, not earned, so they compete with problem behavior's sensory payoff. Example: fidget toys at a desk to reduce hand-mouthing.","page":null,"ch":null},{"term":"equal-interval scale","def":"A graph axis where each equal step of distance stands for the same absolute amount; going from 10 to 20 takes the same space as 50 to 60.","page":128,"ch":6},{"term":"equivalence test","def":"Taught A-B and B-C? Test C-A. Getting it right needs symmetry (reversing a relation) and transitivity (linking relations) at once, so one probe checks both.","page":456,"ch":19},{"term":"equivalence-class formation","def":"Teach some matches (A-B, B-C) and new ones appear on their own: A-A, B-A, A-C. Proven by passing reflexivity, symmetry, and transitivity probes without reinforcement. Also: stimulus equivalence.","page":456,"ch":19},{"term":"errorless learning","def":"Teaching arranged so the learner rarely makes mistakes: strong prompts come first and fade slowly as control shifts to the natural cue. Example: tracing dotted letters that gradually disappear.","page":405,"ch":17},{"term":"escape contingency","def":"A contingency where a response ends a stimulus that is already present. Example: putting on headphones stops the noise of a loud coworker.","page":289,"ch":12},{"term":"escape extinction","def":"Extinction for behavior maintained by negative reinforcement: the behavior no longer ends the aversive situation. Example: whining no longer gets the worksheet taken away.","page":584,"ch":24},{"term":"establishing operation (EO)","def":"A motivating operation that raises how effective something is as a reinforcer right now. Example: after a long run in the heat, water becomes a much stronger reinforcer than usual.","page":373,"ch":16},{"term":"ethical codes of behavior","def":"A profession's official rulebook for right conduct, written or adopted by its organization to guide members on the job. For behavior analysts now: the BACB's 2022 Ethics Code.","page":762,"ch":31},{"term":"ethics","def":"How you act and decide on core questions: What's right? What's worth doing? What makes a good behavior analyst? The book cites the 2016 code; the 2022 Code now governs.","page":759,"ch":31},{"term":"event recording","def":"Measuring by tallying each time the behavior happens, which yields a count. Example: clicking a counter every time a student raises a hand.","page":83,"ch":4},{"term":"evocative effect (of a motivating operation)","def":"An MO's immediate increase in behaviors that have produced the reinforcer that MO affects. Example: after a waterless hike, someone heads straight for the fountain.","page":373,"ch":16},{"term":"exact count-per-interval IOA","def":"Split the session into intervals; count the intervals where both observers' tallies match exactly, divide by all intervals, times 100. The toughest IOA test for most event-recorded data.","page":113,"ch":5},{"term":"exclusion (training)","def":"Teaching arbitrary matches via a reliable bias: with an unfamiliar sample, learners choose the unfamiliar comparison over known ones. Example: asked for the 'zorp,' a child picks the unknown item.","page":471,"ch":19},{"term":"exclusion time-out","def":"Time-out by removal: after the problem behavior, the person leaves (or is taken from) the room or area for a set time. Example: 2 minutes in another room after hitting.","page":353,"ch":15},{"term":"experiment","def":"Measuring behavior (the DV) across at least two conditions that are identical except for one deliberately changed factor (the IV), so any difference can be pinned on that factor.","page":3,"ch":1},{"term":"experimental analysis of behavior (EAB)","def":"The basic science Skinner founded, studying behavior for its own sake. Hallmarks: response rate, repeated measures, within-subject comparisons, visual analysis, and a focus on functional relations over theory testing.","page":5,"ch":1},{"term":"experimental control","def":"Two meanings: (a) an experiment convincingly shows a functional relation, reliably changing behavior by manipulating the IV; (b) how tightly a researcher manages the IV and holds confounds constant.","page":156,"ch":7},{"term":"experimental design","def":"The plan for which conditions a study runs and in what sequence, chosen so behavior can be compared with the IV present, absent, or set at different values. Example: A-B-A-B.","page":157,"ch":7},{"term":"explanatory fiction","def":"A label for a behavior that gets treated as its cause, even though it only renames what we saw and explains nothing. Example: 'He skips homework because he's lazy.'","page":12,"ch":1},{"term":"external validity","def":"Whether a study's results would hold up with different people, places, or target behaviors. Example: a reading program that also works in other schools has strong external validity.","page":157,"ch":7},{"term":"extinction","def":"A once-reinforced behavior no longer produces its reinforcer, so it occurs less and less, back toward its pre-reinforcement level or to zero. Example: tantrums no longer get candy.","page":31,"ch":2},{"term":"extinction burst","def":"A temporary jump in responding right when extinction starts. Example: jabbing a broken elevator button harder and faster before giving up.","page":587,"ch":24},{"term":"extinction-induced variability","def":"During extinction, new and varied forms of the behavior may appear. Example: shaking, kicking, and pressing every button on a vending machine that ate your money.","page":542,"ch":22},{"term":"extraneous variable","def":"Something in the study setting other than the IV, like noise, time of day, or lighting, that researchers hold steady so stray changes don't creep in.","page":160,"ch":7},{"term":"fading","def":"Slowly changing a cue that already controls a response (its size, color, position) until a new cue controls it, without losing the response. Features can be faded in or out.","page":405,"ch":17},{"term":"feature stimulus class","def":"Stimuli grouped because they are physically alike in some way (all have wheels, all are red) or share a relation (all bigger than their neighbor). Contrast: arbitrary stimulus class.","page":402,"ch":17},{"term":"fixed interval (FI)","def":"The first response after a set time (counted from the last reinforcer) is reinforced; earlier ones earn nothing. Example: FI 5-min, a student's first hand-raise after 5 minutes earns praise.","page":303,"ch":13},{"term":"fixed ratio (FR)","def":"Reinforcement after a set number of responses, the same every time. On FR 10, every 10th response is reinforced.","page":303,"ch":13},{"term":"fixed-interval DRO (FI-DRO)","def":"A DRO that divides the session into equal intervals; reinforcement is delivered after each interval in which the problem behavior did not occur at all.","page":601,"ch":25},{"term":"fixed-momentary DRO (FM-DRO)","def":"A DRO that checks only at set, evenly spaced moments; reinforcement is given if the problem behavior is not happening at that exact moment.","page":601,"ch":25},{"term":"fixed-time schedule (FT)","def":"Delivers a stimulus noncontingently on a constant timetable, the same time between each delivery no matter what the person does. Example: attention every 2 minutes (FT 2-min).","page":278,"ch":11},{"term":"formal similarity","def":"Stimulus and response match in two ways: same sense mode (both heard, seen, or felt) and they physically look or sound alike. Examples: echoics, copying text, imitating a sign.","page":415,"ch":18},{"term":"forward chaining","def":"Teaching a chain from the first step: the learner learns step 1 while the trainer finishes the rest, then steps 1-2, and so on until the whole chain is independent.","page":559,"ch":23},{"term":"fraudulent conduct","def":"Knowingly deceiving others on purpose, in a way that can hurt them. Example: billing an insurer for therapy sessions that never happened.","page":769,"ch":31},{"term":"free operant","def":"Operant behavior that can happen almost any time, takes little time, leaves the person ready to go again, and can occur at many rates (e.g., math facts per minute).","page":77,"ch":4},{"term":"free-operant avoidance","def":"Avoidance where a response at any point before a scheduled aversive event pushes that event back; unlike discriminated avoidance, no warning signal comes first.","page":289,"ch":12},{"term":"frequency","def":"How often behavior happens. The word gets used two ways: as rate (responses per unit of time, e.g., 4 per minute) or as plain count (e.g., 12 times).","page":76,"ch":4},{"term":"full-session DRL","def":"DRL with one check as the session ends: total responses at or under the limit earn the reinforcer. Example: 3 or fewer call-outs all class earns a sticker.","page":607,"ch":25},{"term":"function-altering effect (relevant to operant relations)","def":"Learning that leaves a mark: after reinforcement, punishment, extinction, or recovery from punishment, the links among MOs, stimuli, and responses in someone's repertoire have changed. Respondents: via stimulus pairing/unpairing.","page":377,"ch":16},{"term":"function-based definition","def":"Defining a response class only by the effect responses have on the environment, not by their form. Example: \"elopement\" is any way of leaving class without permission.","page":67,"ch":3},{"term":"functional analysis","def":"Two meanings: (a) any demonstration of functional relations between environment and behavior; (b) experimentally arranging everyday antecedents and consequences to see which ones maintain a person's problem behavior.","page":5,"ch":1},{"term":"functional behavior assessment (FBA)","def":"Gathering information (interviews, observation, sometimes a functional analysis) to learn what a problem behavior gets or avoids for someone; findings guide a plan that reduces it and builds better behavior.","page":629,"ch":27},{"term":"functional communication training (FCT)","def":"Teaching a better way to ask for what problem behavior was getting (e.g., signing 'break' instead of throwing work), and reinforcing it (DRA). An antecedent intervention for EO-evoked problem behavior.","page":224,"ch":10},{"term":"functional relation","def":"What an experiment lets you claim when behavior (DV) changes reliably each time a specific environmental variable (IV) is manipulated, and other causes are unlikely. Written b = f(x).","page":4,"ch":1},{"term":"functionally equivalent","def":"Different-looking behaviors that do the same job for the person because they produce the same consequence. Example: screaming and signing 'help' both bring an adult over.","page":642,"ch":27},{"term":"general case analysis","def":"Choosing teaching examples that together sample every kind of stimulus variation and response the learner will meet in generalization settings. Example: practicing on several vending machine models before community outings.","page":727,"ch":30},{"term":"generalization","def":"A catch-all label for several processes and outcomes: behavior that lasts over time, appears in new settings, or shows up in new untaught forms. See the specific types.","page":715,"ch":30},{"term":"generalization across subjects","def":"A spillover effect: an intervention aimed at one person also changes the behavior of others nearby who were never treated. Example: classmates quiet down when one student's call-outs are targeted.","page":721,"ch":30},{"term":"generalization probe","def":"A check of whether a skill shows up where it was never trained, such as a new room, person, or materials. Example: checking hand-washing at grandma's house.","page":715,"ch":30},{"term":"generalization setting","def":"A place where you want the skill, but that differs in some important way from the teaching setting. Example: the grocery store, after shopping practice in the clinic.","page":716,"ch":30},{"term":"generalized behavior change","def":"Change that goes beyond what was directly taught: it lasts (response maintenance), spreads to new settings (stimulus/setting generalization), or takes new forms (response generalization), alone or combined. Also: generalized outcome.","page":715,"ch":30},{"term":"generalized conditioned reinforcer","def":"A learned reinforcer linked to lots of other reinforcers, so it stays effective without depending on any one EO (such as food deprivation). Examples: money, tokens, praise.","page":264,"ch":11},{"term":"generalized imitation","def":"Copying brand-new models the learner was never taught, prompted, or reinforced for imitating, across many settings. Example: a child copies a new clapping game right away. A higher-order response class.","page":530,"ch":21},{"term":"generative learning","def":"Speaker and listener skills a learner already has make new ones appear, or come faster, without direct teaching or reinforcement. Example: a child taught to select 'zebra' also names it.","page":414,"ch":18},{"term":"generic (tact) extension","def":"Naming something new correctly because it has every defining feature of the thing the name was learned for. Example: calling a never-seen red apple 'apple' after learning on green ones.","page":null,"ch":null},{"term":"Good Behavior Game","def":"An interdependent group contingency: the class splits into teams that get marks for misbehavior; the team with fewest marks, or any team under a set limit, wins a reward.","page":666,"ch":28},{"term":"graph","def":"A picture of data that lets you see how measures of behavior change and how they relate to the variables in play, like sessions or treatment phases.","page":125,"ch":6},{"term":"group contingency","def":"The group's reward hinges on behavior: one member's, a chosen few members', or every member meeting the goal. Example: class pizza party if all students read 5 books.","page":664,"ch":28},{"term":"habilitation","def":"A repertoire changed so it earns the person the most reinforcement and fewest punishers, now and long term. Example: asking for help instead of melting down at work. Also: adjustment.","page":52,"ch":3},{"term":"habit reversal","def":"A multi-part package for unwanted habits like nail biting or tics: awareness training (noticing the response and its triggers), competing response training, and motivation and generalization strategies.","page":687,"ch":29},{"term":"habituation","def":"A stimulus that keeps coming loses its punch: reflexive responses to it shrink with quick, repeated presentations. Example: jumping less at each new firework in a show.","page":30,"ch":2},{"term":"hero procedure","def":"Another name for a dependent group contingency: one person's behavior earns a reward for the whole group. Example: if Jamal finishes his reading, everyone gets free time.","page":665,"ch":28},{"term":"hierarchical relation","def":"A nested stimulus relation: a category containing several stimuli belongs to a larger category (e.g., beagles and poodles are dogs; dogs, cats, and horses are mammals).","page":507,"ch":20},{"term":"high-probability (high-p) request sequence","def":"Building momentum toward compliance: 2 to 5 quick, easy requests the learner reliably does, then the hard (low-p) request right away. Example: 'High five, touch nose, clap... now clean up.'","page":620,"ch":26},{"term":"high-probability instructional sequence (high-p)","def":"Same tactic as the high-p request sequence, used to boost compliance and cut escape-maintained problem behavior: once the learner follows several easy instructions, the target (low-p) instruction comes immediately.","page":615,"ch":26},{"term":"higher-order conditioning","def":"Pairing a neutral stimulus with an existing CS until it becomes a CS too. Example: a chime paired with a feared drill sound starts eliciting tension. Also: secondary conditioning.","page":504,"ch":20},{"term":"higher-order operant class","def":"A broad response class defined by a general antecedent-response rule (e.g., 'do what the model does'), not by specific stimuli or responses. Examples: generalized imitation, instruction following, naming.","page":490,"ch":19},{"term":"history of reinforcement","def":"A person's past learning: broadly, all of it; narrowly, what has happened before with one particular behavior. Example: a child's tantrums have paid off at home for years.","page":43,"ch":2},{"term":"hypothetical construct","def":"An inner process or thing that is inferred but never actually seen, like a 'memory bank' or 'willpower,' offered to explain behavior.","page":10,"ch":1},{"term":"imitation","def":"Behavior that is set off by someone's model, matches its form, follows it closely in time, and is controlled mainly by that model. Example: a toddler copies a parent waving.","page":528,"ch":21},{"term":"imitation training","def":"Step-by-step, evidence-based teaching that gets a learner who doesn't imitate to copy models of new behaviors. Example: saying 'Do this,' clapping, and prompting then fading help.","page":529,"ch":21},{"term":"impure tact","def":"A verbal response with two sources: something present (tact control) plus a current MO (mand control). Example: a child who hasn't eaten for hours sees cookies and says 'cookie.'","page":null,"ch":null},{"term":"independent group contingency","def":"Everyone in the group faces the same criterion, but each person earns reinforcement based only on their own performance.","page":665,"ch":28},{"term":"independent variable","def":"The factor a researcher deliberately turns on, off, up, or down (e.g., a token system) to test its effect on behavior (the DV). Also called intervention or treatment variable.","page":127,"ch":6},{"term":"indirect functional assessment","def":"Learning about a problem behavior secondhand: interviews, checklists, or rating scales completed by teachers, parents, or the person, asking what events tend to go with it. Example: the QABF.","page":639,"ch":27},{"term":"indirect measurement","def":"Drawing conclusions about a behavior from something else, like a survey or parent report, instead of observing the behavior itself. The inference step makes it less valid than direct measurement.","page":103,"ch":5},{"term":"indiscriminable contingency","def":"Reinforcement arranged so the learner can't predict which response will pay off, so behavior keeps going. Tools: intermittent schedules, delayed rewards. Used to promote generalized behavior change.","page":733,"ch":30},{"term":"informed consent","def":"Agreeing to services or research only after being told everything relevant. Valid consent needs capacity to decide, a free choice, and understanding of key facts; usually written, signed, and dated.","page":759,"ch":31},{"term":"instructional setting","def":"Where teaching takes place, counting every feature of it, intended or not (room, teacher, noise), that can affect learning, keeping, or generalizing the skill. Contrast: generalization setting.","page":716,"ch":30},{"term":"interdependent group contingency","def":"All or nothing: the group earns the reward only when each member hits the shared goal. Example: the class gets extra recess only if everyone turns in homework.","page":666,"ch":28},{"term":"intermittent schedule of reinforcement (INT)","def":"Reinforcing a behavior only part of the time, not every time it occurs. Example: praise for every third correct answer. Contrast with continuous reinforcement (CRF).","page":321,"ch":13},{"term":"internal validity","def":"Confidence that the IV, and nothing else, produced the behavior change. It's weak if, say, a medication change happened at the same time treatment started.","page":157,"ch":7},{"term":"interobserver agreement (IOA)","def":"How closely two or more observers' records match when each records the same behavior on their own. Example: two staff count hand-raises separately, then compare totals.","page":107,"ch":5},{"term":"interresponse time (IRT)","def":"The time from the end of one response to the start of the next; a measure of temporal locus. Example: 40 seconds between finishing one math problem and starting another.","page":77,"ch":4},{"term":"interrupted chain procedure","def":"Chain interruption variation: a familiar routine is blocked at a set step until the learner answers a prompt. Example: juice withheld until the child answers 'What do you need?'","page":573,"ch":23},{"term":"interval DRL","def":"DRL in equal time blocks: each block whose count stays at or under the limit earns a reinforcer when it ends. Example: 1 or fewer questions per 10-minute block.","page":607,"ch":25},{"term":"interval-by-interval IOA","def":"IOA for interval or time-sampling data: intervals where observers agree (occurrence or nonoccurrence) divided by total intervals, times 100. Also called point-by-point or total interval IOA.","page":115,"ch":5},{"term":"interview-informed synthesized contingency analysis","def":"An efficient FA format: problem behavior in test sessions produces a bundle of reinforcers at once (e.g., attention plus a break); in control sessions, it's given freely throughout.","page":634,"ch":27},{"term":"intraverbal","def":"A verbal operant evoked by a verbal stimulus without point-to-point correspondence to it. Example: \"How are you?\" evokes \"Good.\" It underlies conversation and answering questions.","page":415,"ch":18},{"term":"intraverbal control","def":"When a verbal stimulus helps evoke a response but is not enough by itself; it works alongside other controlling variables.","page":419,"ch":18},{"term":"irreversibility","def":"Restoring an earlier phase's exact conditions fails to bring back that phase's level of responding. Example: a learned skill stays after teaching is withdrawn. A problem for reversal designs.","page":179,"ch":8},{"term":"joint control","def":"Two of your own verbal responses team up to evoke a response neither would alone. Example: repeating 'blue' while scanning cards, then picking the one you also tact 'blue.'","page":42,"ch":2},{"term":"lag reinforcement schedule","def":"Reinforcing variety: a response pays off only if it differs from the last one (Lag 1) or the last several (Lag 2+). Example: Lag 1 bans repeating the previous greeting.","page":747,"ch":30},{"term":"latency","def":"Short for response latency: the time between a stimulus and the start of the response that follows it.","page":76,"ch":4},{"term":"latency-based functional analysis","def":"FA variant: rather than counting responses, time how fast problem behavior starts once the EO is presented, ending the session right then. The quickest condition suggests the function.","page":635,"ch":27},{"term":"least-to-most response prompts","def":"Prompting that starts with the least help and adds more each time the learner doesn't respond correctly within a set time, e.g., independent chance, then verbal, gesture, then physical guidance.","page":406,"ch":17},{"term":"level","def":"Where the data sit on the y-axis: the value a set of data points centers on. Example: baseline points hovering around 8 tantrums daily give a level near 8.","page":125,"ch":6},{"term":"level system","def":"Part of some token economies: performance moves a person up a ladder of levels (or down); each step up demands more but unlocks bigger perks and more freedom.","page":657,"ch":28},{"term":"limited hold","def":"A time limit on an FI or VI schedule: once the interval ends, the reinforcer waits only briefly; miss that window and it's gone and a new interval starts.","page":309,"ch":13},{"term":"line graph","def":"ABA's go-to graph, built on two perpendicular axes (a Cartesian plane): x is usually time or sessions, y the behavior measure; each point shows one pairing, and lines connect them.","page":127,"ch":6},{"term":"listener","def":"Whoever responds to and reinforces what a speaker says; their presence can also cue talking. You can be your own listener, e.g., silently thinking over what you just said.","page":413,"ch":18},{"term":"listener discriminations","def":"When a verbal SD evokes a specific nonverbal response because of past reinforcement. Example: \"Touch your nose\" and the child touches their nose.","page":415,"ch":18},{"term":"local response rate","def":"Response rate over a short stretch inside a longer period, versus the overall rate. Example: on a cumulative record, the steep run of responding just before an FI reinforcer.","page":135,"ch":6},{"term":"magnitude","def":"The force or intensity of a response (e.g., how loud a scream is); some response classes count only if they meet a magnitude criterion. Also called amplitude.","page":75,"ch":4},{"term":"maintenance","def":"(a) An outcome: the skill continues after the intervention is partly or fully removed (response maintenance, a DV). (b) A phase where treatment is withdrawn or thinned (an IV).","page":715,"ch":30},{"term":"mand","def":"Asking for (or refusing) something: any verbal response evoked by an MO and reinforced by that specific thing. Example: after recess with no water, a child signs 'drink.'","page":415,"ch":18},{"term":"massed practice","def":"A self-management tactic: deliberately repeating an unwanted behavior many times in one stretch, which sometimes makes it less frequent afterward. Example: purposely cracking your knuckles over and over.","page":704,"ch":29},{"term":"matching law","def":"With options available at once (concurrent schedules), each option's share of responding matches its share of reinforcement: A paying off twice as often as B draws about double the responding.","page":315,"ch":13},{"term":"matching-to-sample procedure","def":"Each trial shows a sample, then two or more comparisons; picking the comparison that matches the sample earns reinforcement. A discrete-trial method used to study conditional relations and equivalence.","page":453,"ch":19},{"term":"mean count-per-interval IOA","def":"Split the session into short counting intervals, find the two observers' percent agreement in each, then average those percentages. Stricter than total count IOA.","page":113,"ch":5},{"term":"mean duration-per-occurrence IOA","def":"For duration data: compute the two observers' percent agreement on the length of each occurrence, then average them. Stricter and usually more meaningful than total duration IOA.","page":114,"ch":5},{"term":"measurement","def":"Attaching numbers to events so they can be described and compared. In ABA it takes three steps: pick the behavior, define it observably, choose how to observe and record it.","page":74,"ch":4},{"term":"measurement bias","def":"Error that is not random: the data lean the same way every time, always reading too high or always too low compared with what really happened.","page":102,"ch":5},{"term":"measurement by permanent product","def":"Measuring behavior after the fact by checking what it left behind in the environment, such as completed worksheets, made beds, or washed dishes.","page":93,"ch":4},{"term":"mentalism","def":"Explaining behavior by pointing to an inner, mental world (separate from behavior) that is assumed to cause or steer what people do.","page":12,"ch":1},{"term":"metaphorical (tact) extension","def":"Using a tact learned for one thing to name a new thing that shares some, not all, key features, like calling a fluffy cloud \"cotton candy.\"","page":null,"ch":null},{"term":"methodological behaviorism","def":"The view that only publicly observable events count as science, so private events like thoughts and feelings are left out of study.","page":12,"ch":1},{"term":"metonymical (tact) extension","def":"Naming something with a word tied to it only by association, not by shared key features, like saying \"Grandpa\" when seeing his empty reading chair.","page":null,"ch":null},{"term":"mixed schedule (mix)","def":"A compound schedule like a multiple schedule but with no cue: two or more basic schedules take turns, usually in random order, and nothing signals which one is currently running.","page":318,"ch":13},{"term":"modeling","def":"Teaching a new skill by showing it, live or through video, pictures, or other symbolic models, so the learner can imitate exactly what to do.","page":529,"ch":21},{"term":"momentary time sampling","def":"A method where the observer notes only whether the behavior is happening at the exact moment each interval ends, ignoring the rest of the interval.","page":88,"ch":4},{"term":"most-to-least response prompts","def":"Start with full physical guidance, then give less help across trials (typically physical, then visual, then verbal) until the natural cue alone controls the response.","page":406,"ch":17},{"term":"motivating operation (MO)","def":"Something in the environment that, for now, (a) makes a reinforcer or punisher more or less effective and (b) makes behavior that has produced it more or less frequent.","page":38,"ch":2},{"term":"motor imitation (relating to sign language)","def":"A copying-type (duplic) verbal operant in sign language: the learner reproduces a sign they just saw, matching its form, maintained by generalized reinforcement.","page":415,"ch":18},{"term":"multielement design","def":"Two or more conditions trade off quickly (A Monday, B Tuesday) on a preset plan, not by performance; separated data paths show effects. Also called alternating treatments design.","page":173,"ch":8},{"term":"multiple baseline across behaviors design","def":"One person, one setting, two or more different behaviors: the intervention is introduced to each behavior at a different time, e.g., calling out, then leaving seat, then talking.","page":194,"ch":9},{"term":"multiple baseline across settings design","def":"One person and one behavior; the intervention starts in two or more settings, situations, or time periods in turn, e.g., tantrums at home, then school, then the store.","page":194,"ch":9},{"term":"multiple baseline across subjects design","def":"One target behavior, one setting, two or more people (or groups): the intervention begins for each person at a different time, e.g., three students' on-task behavior in one classroom.","page":194,"ch":9},{"term":"multiple baseline design","def":"Baselines for two or more behaviors run at the same time; treatment starts on one, then is added to the others one by one. Each should change only once treated.","page":194,"ch":9},{"term":"multiple control (of verbal behavior)","def":"Two kinds. Convergent: several variables combine to evoke one verbal response. Divergent: one variable boosts several possible responses, e.g., \"dog\" can evoke \"bark,\" \"leash,\" or \"puppy.\"","page":419,"ch":18},{"term":"multiple-exemplar training","def":"Practice that varies the situations and the ways of responding, e.g., greeting many people, in many places, with \"hi,\" \"hello,\" or a wave, so both setting and response generalization follow.","page":509,"ch":20},{"term":"multiple probe design","def":"Like a multiple baseline, but baseline is sampled with occasional probes rather than continuously. Fits skill sequences where step 4 is unlikely to improve until steps 1-3 are learned.","page":199,"ch":9},{"term":"multiple schedule (mult)","def":"A compound schedule: two or more basic schedules take turns, each with its own cue (SD), e.g., FR 5 under a green light, VI 1-min under red.","page":316,"ch":13},{"term":"multiple treatment interference","def":"When a study gives a participant more than one treatment, the effects can bleed into each other, so a change seen under one treatment may partly reflect another.","page":190,"ch":8},{"term":"multiple treatment reversal design","def":"A reversal-style design that includes two or more different treatments, so each can be compared with baseline, with the others, or both (e.g., A-B-A-C-A).","page":174,"ch":8},{"term":"mutual entailment","def":"Teach one direction of a relation, such as A goes with B, and the learner derives the reverse, B goes with A, with no training on it.","page":500,"ch":20},{"term":"naive observer","def":"A data collector who doesn't know what the study is testing, which condition is running, or both, so personal expectations are less likely to sway the numbers.","page":108,"ch":5},{"term":"naturally existing contingency","def":"A contingency the behavior analyst didn't create; it's already at work in the person's world, including ones other people arranged, such as a teacher's praise or a paycheck.","page":722,"ch":30},{"term":"negative punishment","def":"Behavior becomes less frequent because a stimulus is removed or reduced right after it. Example: cursing costs a teen phone time, and the cursing drops.","page":37,"ch":2},{"term":"negative reinforcement","def":"Behavior becomes more frequent because it promptly ends, reduces, postpones, or prevents a stimulus. Example: buckling up silences the seatbelt chime, so people buckle up more.","page":36,"ch":2},{"term":"negative reinforcer","def":"A stimulus that strengthens behavior when that behavior ends or reduces it, like a pounding headache whose relief strengthens taking pain medicine.","page":289,"ch":12},{"term":"negligence","def":"Putting a client's health or safety at risk through a lapse in professional integrity, usually by omission: skipping something the provider should have done (nonfeasance), like ignoring a reported allergy.","page":775,"ch":31},{"term":"neutral stimulus (NS)","def":"A stimulus change, like a tone before conditioning, that elicits no respondent behavior. Pairing it with an unconditioned stimulus (US) can turn it into a conditioned stimulus (CS).","page":31,"ch":2},{"term":"nodal stimulus (node)","def":"The stimulus (or set) that two or more trained conditional discriminations have in common, tying them together so equivalence can emerge. Train A-B and A-C, and A is the node.","page":473,"ch":19},{"term":"nonequivalence relations","def":"Derived (untaught) relations not based on sameness, like opposite, more/less, or before/after. Taught \"a dime is worth more than a nickel,\" she derives \"a nickel is worth less.\"","page":498,"ch":20},{"term":"noncontingent reinforcement (NCR)","def":"Giving a known reinforcer by the clock (fixed-time or variable-time), regardless of behavior. A common antecedent intervention for reducing problem behavior, e.g., attention every 2 minutes for attention-maintained yelling.","page":176,"ch":8},{"term":"noncontingent reinforcement (NCR) reversal technique","def":"Replaces the usual no-reinforcement baseline with NCR as the comparison condition. Higher responding with contingent reinforcement than with NCR shows the contingency, not mere contact with the reinforcer, drives behavior.","page":null,"ch":null},{"term":"nonconcurrent multiple baseline across participants design","def":"Participants each get an A-B sequence (baseline, then treatment), but they enter the study at different times instead of together. Useful when you can't track everyone simultaneously.","page":199,"ch":9},{"term":"nonexclusion time-out","def":"Time-out where the person isn't removed: after the target behavior they stay put, but reinforcement is cut off for a set time, e.g., no tokens or praise for two minutes.","page":354,"ch":15},{"term":"normalization","def":"Philosophy: people with disabilities, however severe, belong in mainstream community life as fully as possible. Practice: moving teaching into ever more ordinary places and routines so behavior fits cultural norms.","page":62,"ch":3},{"term":"observed value","def":"Whatever number your observation system records, such as 14 hits counted, whether or not it's right. These recorded numbers are what researchers analyze. Contrast with the true value.","page":102,"ch":5},{"term":"observer drift","def":"An observer gradually, without meaning to, starts scoring differently than they were trained, often by loosening or tightening the behavior's definition in their head. The result is measurement error.","page":107,"ch":5},{"term":"observer reactivity","def":"An observer records differently because they know someone is checking their data, e.g., scoring more carefully on days a second observer will compare records.","page":108,"ch":5},{"term":"ontogeny","def":"How one individual develops and changes over its own life, including what it learns through its personal history of reinforcement. Contrast: phylogeny is the species' history.","page":33,"ch":2},{"term":"operant behavior","def":"Behavior whose future depends on what it produces: consequences select it, keep it going, and tie it to cues (stimulus control). Each person's learning history (ontogeny) builds their operant repertoire.","page":26,"ch":2},{"term":"operant conditioning","def":"How operant learning happens. What immediately follows a response changes how often that type of response occurs later under similar conditions and motivation: up for reinforcement, down for punishment.","page":26,"ch":2},{"term":"overall response rate","def":"Response rate figured across an entire time period, e.g., 60 responses in 30 minutes = 2 per minute, even if most came in short bursts. Compare local response rate.","page":135,"ch":6},{"term":"overcorrection","def":"Positive punishment through effort: after each problem behavior, the learner must do real work connected to undoing the harm. Two forms: restitutional and positive practice.","page":338,"ch":14},{"term":"overselective stimulus control","def":"Only a very narrow set of stimuli or features controls responding, often hurting learning, e.g., recognizing Dad only by his glasses. Also called stimulus overselectivity.","page":404,"ch":17},{"term":"overshadowing","def":"The most eye-catching part of a compound stimulus takes control, blocking a more relevant part from gaining it, e.g., a child \"reads\" flashcards by their pictures, not the printed words.","page":404,"ch":17},{"term":"parametric analysis","def":"An experiment that tests several values of one independent variable (e.g., 1, 3, and 5 tokens) to see how the amount changes the effect.","page":161,"ch":7},{"term":"parsimony","def":"Check the plain explanations before the fancy ones: only after simple, logical accounts have been tested and excluded (by experiment or reasoning) should complex or abstract accounts be considered.","page":4,"ch":1},{"term":"partial-interval recording","def":"Split the session into brief intervals (often 5-10 s); score an interval if the behavior happens at any moment in it. Tends to overestimate how long it really occurred.","page":88,"ch":4},{"term":"partition time-out","def":"After the target behavior, the person stays in the room but sits behind a partition or in a designated spot. Also called select space time-out.","page":355,"ch":15},{"term":"percentage","def":"Two amounts of the same kind (count vs. count, or time vs. time) compared as \"how many out of every 100,\" e.g., 18 correct of 20 trials is 90%.","page":78,"ch":4},{"term":"perspective shifting","def":"Taking a viewpoint other than \"me, here, now\": responding as someone else would, or as if in another place or time, e.g., \"If I were you, I'd feel nervous too.\"","page":514,"ch":20},{"term":"philosophic doubt","def":"Healthy skepticism toward all scientific knowledge and theory, your own findings included: keep asking whether it's true and valid, no matter how well accepted it is.","page":4,"ch":1},{"term":"phylogeny","def":"A species' evolutionary past. It explains behavior that natural selection built in across generations, like unconditioned reflexes, rather than behavior learned in one lifetime (ontogeny).","page":33,"ch":2},{"term":"pivotal behavior","def":"Learning this behavior also changes other behaviors nobody taught. Example: once a child learns to start interactions (self-initiation), other social skills improve without direct teaching.","page":60,"ch":3},{"term":"placebo control","def":"Running a fake-treatment condition that looks exactly like the real one (e.g., a sugar pill matched to the real pill) so participants can't tell which they're getting.","page":226,"ch":10},{"term":"planned activity check (PLACHECK)","def":"A group form of momentary time sampling: at set moments, the observer counts how many people in the group are doing the target behavior.","page":91,"ch":4},{"term":"planned ignoring","def":"A form of time-out where others briefly stop giving attention, touch, and conversation (social reinforcers) as soon as the target behavior happens, e.g., turning away when a child whines.","page":354,"ch":15},{"term":"point-to-point correspondence","def":"Each part of the response lines up with each part of the verbal stimulus, start to finish. Seen in echoics, sign imitation, copying text, textuals, and transcription.","page":415,"ch":18},{"term":"positive practice overcorrection","def":"Overcorrection that teaches: after problem behavior, the learner performs the correct version (or an incompatible behavior) a set number of times, e.g., running in the hall means five practice walks.","page":341,"ch":14},{"term":"positive punishment","def":"Behavior becomes less frequent because a stimulus is added right after it. Example: touching a hot stove brings pain, and the child touches the stove less.","page":37,"ch":2},{"term":"positive reinforcement","def":"Behavior becomes more frequent because a stimulus is added right after it. Example: a teacher praises hand-raising, and students raise hands more often.","page":36,"ch":2},{"term":"positive reinforcer","def":"A stimulus that strengthens behavior when it is added or begins after that behavior, like a sticker, snack, or high-five.","page":254,"ch":11},{"term":"postreinforcement pause","def":"The learner stops responding for a while just after getting reinforced, then starts again, a pattern common on fixed-ratio (FR) and fixed-interval (FI) schedules.","page":303,"ch":13},{"term":"practice effects","def":"Performance gets better simply because the person does the task over and over during repeated baseline measurement, not because of treatment.","page":165,"ch":7},{"term":"pragmatism","def":"An idea counts as true to the degree it helps people act effectively. For behavior analysts, \"Does it work?\" is a main test of a finding's worth.","page":12,"ch":1},{"term":"precision teaching","def":"A teaching approach: pinpoint skills, measure baseline rate per minute, set an aim, measure daily, plot on a Standard Celeration Chart, and change instruction when progress stalls.","page":138,"ch":6},{"term":"prediction","def":"A forecast of what a not-yet-collected (or unknown) measure will show, e.g., \"if nothing changes, baseline stays this steady.\" Baseline logic rests on it, plus verification and replication.","page":156,"ch":7},{"term":"Premack principle","def":"A high-probability activity can reinforce a low-probability one when access depends on doing the low one first. \"Grandma's Law\": finish homework, then video games.","page":265,"ch":11},{"term":"principle of behavior","def":"A well-tested rule linking behavior to something that controls it; many experiments confirm it holds across people, species, settings, and time. Examples: reinforcement, extinction.","page":36,"ch":2},{"term":"private events","def":"Behavior inside the skin, like thinking or feeling, that only the person can directly access. Radical behaviorism treats it as behavior governed by the same variables as public behavior.","page":419,"ch":18},{"term":"procedural fidelity","def":"How faithfully a study's procedures are carried out in every phase and condition, baseline as well as treatment. Treatment integrity, by contrast, looks only at the intervention.","page":226,"ch":10},{"term":"programming common stimuli","def":"A generalization tactic: identify key features of the setting where the skill is needed and build them into the teaching setting so the two are alike.","page":730,"ch":30},{"term":"progressive-ratio (PR) schedule of reinforcement","def":"An FR variation where the ratio keeps rising within the session, by equal steps (arithmetic: 2, 4, 6) or by a constant proportion (geometric: 2, 4, 8).","page":313,"ch":13},{"term":"progressive schedule of reinforcement","def":"Reinforcement gets leaner with every opportunity, on a preset plan that doesn't depend on how the person responds. Steps can be arithmetic or geometric. Covers progressive-ratio (PR) and progressive-interval (PI).","page":313,"ch":13},{"term":"progressive time delay","def":"Fading prompts by first giving the prompt together with the natural cue (0-s delay), then gradually lengthening the wait before prompting, shifting control to the natural cue.","page":406,"ch":17},{"term":"punisher","def":"Any stimulus change that, coming right after a behavior, reduces how often that behavior occurs later. Defined by its effect, not by how unpleasant it seems.","page":327,"ch":14},{"term":"punishment","def":"The basic principle at work when a response becomes less frequent because a stimulus change immediately follows it. Can be positive (something added) or negative (something removed).","page":327,"ch":14},{"term":"radical behaviorism","def":"Skinner's philosophy of behavior. It seeks to explain everything people do, even private thinking and feeling, through variables in their own learning history (ontogeny) and their species' history (phylogeny).","page":9,"ch":1},{"term":"range-bound changing criterion design","def":"Instead of one target per phase, each step of a changing criterion design sets a floor and a ceiling, e.g., 3-5 cigarettes a day, and responding should land between them.","page":211,"ch":9},{"term":"rate","def":"Count per unit of time: responses divided by observation time, e.g., 30 words in 3 minutes = 10 per minute. \"Frequency\" means rate to some authors, count to others.","page":75,"ch":4},{"term":"ratio scale","def":"A graph axis built so the same proportional change always covers the same distance: doubling from 5 to 10 spans as much space as doubling from 50 to 100.","page":136,"ch":6},{"term":"ratio strain","def":"What can happen when a ratio requirement is raised too far, too fast (e.g., FR 2 straight to FR 20): avoidance, aggression, erratic pausing, or responding that stops altogether.","page":309,"ch":13},{"term":"reactivity","def":"Behavior changes just because it's being observed and measured, e.g., a student works harder once an observer appears. The more noticeable the observer and their purpose, the bigger the risk.","page":58,"ch":3},{"term":"recombinative generalization","def":"Responding correctly to never-taught combinations of familiar parts: after learning \"red cup\" and \"blue ball,\" the child picks out the \"red ball\" on the first try.","page":424,"ch":18},{"term":"recovery from punishment","def":"A previously punished behavior occurs without being punished and rebounds. It parallels extinction: extinction undoes reinforcement's effect; this undoes punishment's effect.","page":331,"ch":14},{"term":"reflex","def":"A stimulus together with the respondent behavior it reliably elicits, like an air puff and a blink. Reflexes guard against harm, keep the body in balance, and aid reproduction.","page":28,"ch":2},{"term":"reflexive conditioned motivating operation (CMO-R)","def":"A stimulus that comes before things get worse (or better) and so becomes an MO. Example: a task demand before hard work makes its own removal reinforcing and evokes escape.","page":387,"ch":16},{"term":"reflexivity","def":"Matching a stimulus to an identical one (A = A) without ever being taught or reinforced for that match, e.g., picking the same cup photo. Also called generalized identity matching.","page":455,"ch":19},{"term":"reinforcement","def":"The basic principle at work when a response becomes more frequent because a stimulus change immediately follows it. Can be positive (something added) or negative (something removed).","page":253,"ch":11},{"term":"reinforcer","def":"Any stimulus change that, coming right after a behavior, increases how often that behavior occurs later. Defined by its effect, not by whether it seems pleasant.","page":657,"ch":28},{"term":"reinforcer assessment","def":"Direct tests of whether stimuli truly work as reinforcers: make them contingent on a target response and check whether that response increases. A preference ranking alone can't confirm this.","page":268,"ch":11},{"term":"reinforcer-abolishing effect (of a motivating operation)","def":"An MO's effect of making a stimulus less effective as a reinforcer, e.g., right after a big lunch, food is worth less as a reinforcer.","page":375,"ch":16},{"term":"reinforcer-establishing effect (of a motivating operation)","def":"An MO's effect of making a stimulus more effective as a reinforcer, e.g., after skipping lunch, food becomes a stronger reinforcer.","page":374,"ch":16},{"term":"relational frame","def":"A particular pattern of relating stimuli by context rather than physical features, such as \"same as,\" \"opposite of,\" or \"bigger than\" (a type of arbitrarily applicable relational responding).","page":455,"ch":19},{"term":"relational frame theory (RFT)","def":"This theory of derived relations says that practice relating things across many examples builds a generalized relating skill, and that relating stimuli is, at heart, verbal behavior.","page":455,"ch":19},{"term":"relevance of behavior rule","def":"Target a behavior for change only if it will likely earn reinforcement in the person's everyday life, so the skill keeps paying off after teaching ends.","page":59,"ch":3},{"term":"reliability (of measurement)","def":"Consistency: measure the same event again and again and a reliable system keeps giving matching numbers, like a scale reading 150 every time, even if the true weight is 145.","page":102,"ch":5},{"term":"repeatability","def":"Because a behavior can recur across time, we can count it. With temporal extent and temporal locus, it's one of three dimensions every behavioral measure is built on.","page":76,"ch":4},{"term":"repertoire","def":"Two uses: the full collection of behaviors someone is able to perform, or just the skills that matter for one task or setting, like her cooking repertoire.","page":414,"ch":18},{"term":"replication","def":"Within a study: re-running conditions to show the effect is reliable (supports internal validity). Across studies: redoing the experiment to see if results hold for other people, settings, or behaviors.","page":159,"ch":7},{"term":"research question","def":"What a study is trying to learn, e.g., \"Does a token system raise homework completion?\" Articles often present it as the purpose. Every design decision should trace back to it.","page":157,"ch":7},{"term":"resistance to extinction","def":"How much operant behavior keeps occurring once it is placed on extinction, relative to other behavior or conditions.","page":589,"ch":24},{"term":"respondent behavior","def":"Behavior triggered (elicited) by a stimulus that comes before it, like salivating at food or flinching at a bang. It's the response half of a reflex.","page":26,"ch":2},{"term":"respondent conditioning","def":"Pair a neutral stimulus (NS) with an unconditioned stimulus (US); eventually the NS alone elicits a response and is now a conditioned stimulus (CS). Also called classical or Pavlovian conditioning.","page":26,"ch":2},{"term":"respondent extinction","def":"Keep presenting a conditioned stimulus (CS) without ever following it with the unconditioned stimulus (US), like a bell with no food, until the CS stops eliciting the conditioned response.","page":31,"ch":2},{"term":"response","def":"One single instance of a behavior; technically, an action of the body's effectors (muscles and glands) that changes the environment.","page":413,"ch":18},{"term":"response blocking","def":"The moment a problem behavior starts, the therapist physically gets in its way so it can't be finished, e.g., putting a hand between a child's hand and mouth.","page":327,"ch":14},{"term":"response class","def":"Different-looking responses grouped together because they have the same effect, e.g., saying \"juice,\" pointing to the cup, or signing JUICE all get juice.","page":76,"ch":4},{"term":"response cost","def":"A negative punishment procedure: each instance of the behavior costs the person a set amount of reinforcers they already have, such as tokens, points, or money, and the behavior decreases.","page":353,"ch":15},{"term":"response differentiation","def":"The result of reinforcing some forms of a response but not others: reinforced forms grow, the rest extinguish, and a new response class takes shape, e.g., clear requests replacing mumbles.","page":543,"ch":22},{"term":"response generalization","def":"Untaught variations appear: after learning one response, the learner also emits others that serve the same function, e.g., taught \"hi,\" she also says \"hey\" and waves.","page":715,"ch":30},{"term":"response interruption and redirection (RIRD)","def":"A response-blocking variation for stereotypy: the moment it begins, stop it and have the person do a few easy, high-probability tasks instead, like answering simple questions.","page":338,"ch":14},{"term":"response latency","def":"How long it takes a response to begin after a cue or instruction is given; a temporal locus measure. Example: 12 seconds from \"line up\" to standing.","page":76,"ch":4},{"term":"response maintenance","def":"How well a learned behavior lasts once part or all of the intervention is removed, e.g., still brushing teeth weeks after the sticker chart ends. Also called maintenance or durability.","page":715,"ch":30},{"term":"response prompts","def":"Help aimed at the behavior itself to get a correct response: telling (verbal instructions), showing (modeling), or physically guiding (physical guidance). Contrast stimulus prompts, which change the cue or materials.","page":403,"ch":17},{"term":"response-deprivation hypothesis","def":"Predicts that access to an activity will reinforce another behavior when the contingency restricts that activity below its baseline level, e.g., limited drawing time reinforcing math.","page":265,"ch":11},{"term":"restitutional overcorrection","def":"Fix it, then go beyond: the learner restores what the misbehavior damaged, then leaves the area far better than before, e.g., scrubbing the whole wall, not just the scribble.","page":341,"ch":14},{"term":"restraint","def":"Physically limiting problem behavior. Three kinds: personal (someone holds or blocks the body part), protective equipment (helmets, arm splints, mitts), and self-restraint (the person pins their own limbs).","page":327,"ch":14},{"term":"resurgence","def":"When reinforcement for an alternative behavior ends or thins, an older, once-reinforced behavior comes back. Also the 3-phase test: reinforce target; extinguish it while reinforcing an alternative; extinguish both.","page":587,"ch":24},{"term":"reversal design","def":"Shows a treatment's effect by switching back to an earlier condition and seeing behavior return to that level. Either withdraw treatment (A-B-A-B) or switch which behavior it reinforces (e.g., DRI/DRA).","page":172,"ch":8},{"term":"risk-benefit analysis","def":"Checking, before any assessment or treatment begins, whether its expected gains outweigh the harm it could cause the client or others.","page":771,"ch":31},{"term":"rule-governed behavior","def":"Behavior controlled by a stated rule rather than by direct experience with consequences. A rule describes a contingency in words, so distant or unlikely payoffs can matter. Contrast: contingency-shaped behavior.","page":255,"ch":11},{"term":"satiation","def":"Repeatedly getting or consuming a reinforcer lowers its value, so behavior that produces it drops. Also a procedure: giving plenty of an item before a session to lower its value.","page":259,"ch":11},{"term":"scatterplot","def":"A graph of unconnected dots, one per measure, each placed by its x and y values, showing how the data spread or cluster (e.g., hours slept vs. tantrums).","page":127,"ch":6},{"term":"scatterplot recording","def":"Splitting the day into time blocks and marking with symbols how much the target behavior happened in each, to reveal the times it is most likely.","page":639,"ch":27},{"term":"schedule of reinforcement","def":"Spells out when reinforcement is earned: which responses count, how many or after how much time, and under what conditions (e.g., FR 5: every fifth correct answer earns a token).","page":303,"ch":13},{"term":"schedule thinning","def":"Making reinforcement gradually leaner, so each reinforcer takes more responses or more time (e.g., FR 1 → FR 3 → FR 6, or VI 30-s → VI 2-min).","page":309,"ch":13},{"term":"science","def":"An organized method for understanding the natural world, shown at three levels: description, prediction, and control. Rests on six attitudes: determinism, empiricism, experimentation, replication, parsimony, philosophic doubt.","page":3,"ch":1},{"term":"scored-interval IOA","def":"Interobserver agreement (IOA) counting only intervals where at least one observer scored the behavior: agreed-occurrence intervals ÷ those intervals × 100. Recommended for low-rate behavior (skips likely chance agreements).","page":115,"ch":5},{"term":"selection by consequences","def":"The central operant principle: what follows a behavior determines whether it survives and grows in a person's repertoire during their lifetime, paralleling Darwin's natural selection of species.","page":33,"ch":2},{"term":"selection-based verbal behavior","def":"Verbal behavior where the speaker picks or points to a stimulus (e.g., tapping a picture on a communication board); the listener gets the message from what was chosen.","page":414,"ch":18},{"term":"selectionism","def":"The view that living things continually evolve because forms that work (have survival value) get selected. Behavior analysis builds on its operant version: selection by consequences.","page":33,"ch":2},{"term":"self-contract","def":"A contingency contract where you are both parties: you pick the task and the payoff, track whether you did it, and deliver the payoff to yourself.","page":676,"ch":28},{"term":"self-control [impulse analysis]","def":"Delaying gratification: choosing a larger or better payoff later over a smaller one now (e.g., saving allowance for a bike instead of buying candy). Also called impulse control.","page":null,"ch":null},{"term":"self-control [Skinner's analysis]","def":"Skinner split self-control into two behaviors: a controlling response that changes the conditions, and the controlled response it makes more or less likely (hiding the chips → less snacking).","page":682,"ch":29},{"term":"self-evaluation","def":"Checking your own performance against a preset goal or standard (e.g., 'Goal: 20 flashcards. Done: 15.'). Often part of self-management. Also called self-assessment.","page":694,"ch":29},{"term":"self-instruction","def":"Talking yourself through a task, out loud or in your head ('First rinse, then soap, then rinse again'); the self-talk works as a rule or prompt, guiding each step.","page":690,"ch":29},{"term":"self-management","def":"Being your own behavior analyst: applying behavior-change tactics to yourself in a way that produces a change you want (e.g., tracking and rewarding your own workouts).","page":682,"ch":29},{"term":"self-monitoring","def":"Keeping a systematic record of your own target behavior, noting whether it happens (e.g., a phone tally of each cigarette smoked). Also called self-recording or self-observation.","page":687,"ch":29},{"term":"semilogarithmic chart","def":"A chart with a logarithmic y-axis: going from 5 to 10 rises the same distance as 50 to 100, since both are doublings. It shows proportional change, not raw amounts.","page":138,"ch":6},{"term":"sensory extinction","def":"Extinction for automatically reinforced behavior: masking or removing the sensory consequence the behavior produces (e.g., padding a table so banging on it makes no sound).","page":584,"ch":24},{"term":"sequence effects","def":"Leftover effects of an earlier condition: what a participant experienced before changes how they behave now (e.g., after a token phase, work stays high in the next baseline).","page":174,"ch":8},{"term":"setting/situation generalization","def":"The degree to which a skill taught in one place or situation also shows up in new ones (e.g., greetings learned at the clinic appear at the grocery store).","page":715,"ch":30},{"term":"shaping","def":"Builds new behavior by differentially reinforcing successive approximations: reinforce responses closer to the goal (terminal) behavior and stop reinforcing earlier ones (e.g., 'buh' → 'bah' → 'ball').","page":541,"ch":22},{"term":"simple discrimination","def":"A single antecedent stimulus, on its own, controls the response: a plain three-term contingency (SD → R → SR+), e.g., the doorbell rings, so the child opens the door.","page":468,"ch":19},{"term":"simple verbal discrimination","def":"An intraverbal under control of just one verbal cue: a single word or phrase sets off a reply that doesn't match it in form (e.g., 'peanut butter and…' → 'jelly').","page":426,"ch":18},{"term":"simple-to-complex testing protocol","def":"A way of ordering equivalence tests: probe symmetry first, then transitivity (if relevant), and finally combined equivalence tests.","page":476,"ch":19},{"term":"single-case designs","def":"Experiments that compare each individual's behavior across conditions (they serve as their own control), using baseline logic to show the intervention caused the change. Also called single-subject or within-subject designs.","page":159,"ch":7},{"term":"social validity","def":"Whether a program matters to the people it serves: are the goals worthwhile, the methods acceptable, and the results meaningful, including changes in related (collateral) behaviors?","page":70,"ch":3},{"term":"socially mediated contingency (reinforcement)","def":"Another person supplies the antecedent, the consequence, or both, as when a parent hands over a snack after the child asks. Contrast: automatic reinforcement, which the behavior produces by itself.","page":28,"ch":2},{"term":"solistic (tact) extension","def":"A tact extension (usually spelled solecistic) where a word is evoked by a property only loosely tied to its proper use, as in malapropisms like 'for all intensive purposes.'","page":null,"ch":null},{"term":"spaced-responding DRL","def":"A DRL method that reinforces each response only if enough time (a minimum interresponse time, IRT) has passed since the previous response.","page":607,"ch":25},{"term":"spatial relation","def":"Responding to how two stimuli are arranged in space relative to each other, e.g., picking the block that is under the cup, not beside it.","page":500,"ch":20},{"term":"speaker","def":"Anyone who emits verbal behavior (mands, tacts, intraverbals, etc.). You don't need a voice: signing, gesturing, writ
