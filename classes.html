ce for each part is spread across separate studies.","code":["4.02","4.06","4.09"],"extra":"Parsons, Rollyson & Reid (2012), 'Evidence-based staff training: A guide for practitioners,' Behavior Analysis in Practice.","domain":"I"},{"id":"I.7","label":"Managing staff performance: feedback, modeling, reinforcement","refs":[{"ch":10,"from":229,"to":229,"section":"Training, Practice, and Feedback","what":"Feedback, self-monitoring, and timed prompts raise staff accuracy"},{"ch":28,"from":662,"to":662,"section":"Training Staff","what":"Skills slip after training; monitoring and self-monitoring restore them"},{"ch":30,"from":752,"to":752,"section":"Probe After Instruction","what":"Regular supervisor feedback kept staff performance high for years"},{"ch":21,"from":533,"to":535,"section":"Modeling","what":"Live and video models, plus rehearsal and feedback"},{"ch":31,"from":768,"to":768,"section":"Figure 31.5 Identifying and Managing Performance Issues in a Supervisory Context","what":"Name the problem plainly, then reinforce each step of the supervisee's improvement plan"}],"coverage":"thin","gap":"Task clarification, changing response effort, goal setting for staff, and culturally responsive performance management are not covered.","code":["4.06","4.07","4.08"],"extra":"Daniels & Bailey's Performance Management; search the Journal of Organizational Behavior Management for task clarification studies.","domain":"I"},{"id":"I.8","label":"Finding why a supervisee struggles before fixing it","refs":[{"ch":31,"from":768,"to":768,"section":"Figure 31.5 Identifying and Managing Performance Issues in a Supervisory Context","what":"Sort the cause: unclear expectations, trainable skill gap, or broader deficit"},{"ch":27,"from":628,"to":629,"section":"Functions of Behavior","what":"Function logic (what behavior gets or escapes) to carry over to staff"}],"coverage":"thin","gap":"Performance diagnostics (checking instructions, resources, skills, and consequences behind a staff problem) appear only as a task-list item; never taught.","code":["4.06","4.08"],"extra":"Carr et al. (2013), Performance Diagnostic Checklist-Human Services (PDC-HS), Behavior Analysis in Practice.","domain":"I"},{"id":"I.9","label":"Measuring whether your supervision is actually working","refs":[{"ch":10,"from":229,"to":230,"section":"Assessing and Reporting Treatment Integrity","what":"Score implementer accuracy as percent of steps done right; retrain when low"},{"ch":28,"from":662,"to":662,"section":"Training Staff","what":"Performance can drop once training ends, so keep measuring"},{"ch":30,"from":752,"to":752,"section":"Probe After Instruction","what":"Long-term follow-up checks show whether staff gains last"}],"coverage":"partial","gap":"Linking supervision to client outcome data and evaluating your own supervision practices (Code 4.10) aren't discussed; integrity measurement is framed for research.","code":["4.08","4.10"],"extra":"Sellers, Valentino & LeBlanc (2016) on evaluating supervision; BACB Supervisor Training Curriculum Outline 2.0.","domain":"I"}],"questions":[{"id":"B.1-1","task":"B.1","stem":"A behavior analyst is drafting target behaviors for a seventh grader. Which item on the draft list actually qualifies as behavior?","options":["Being frustrated during math","Receiving a detention slip","Crumpling the detention slip","Getting knocked over in the hallway"],"answer":2,"why":["Wrong. Frustration names a state, not a movement acting on the environment, so it fails the dead man test.","Wrong. Receiving is something done to the student; the environment changes, but no movement by the student is required.","Correct. Crumpling requires the student's own movement acting on an object, so it is behavior.","Wrong. Motion caused by an outside force is not behavior; a lifeless object would fall the same way."],"cite":{"ch":2,"from":26,"to":26},"level":"apply","set":"B"},{"id":"B.1-2","task":"B.1","stem":"During a 10-minute observation, a technician records that Priya asked, \"Can I have a turn?\" four separate times. In technical terms, each of those four occurrences is a:","options":["response class","response","repertoire","topography"],"answer":1,"why":["Wrong. The response class is the whole group of turn-requesting responses, not each single occurrence.","Correct. Each occurrence is one instance of the behavior, which is what a response is.","Wrong. A repertoire is everything a person can do, or their skill set for a setting; it is far broader than one occurrence.","Wrong. Topography is the physical form of a response (her words, tone, gestures), not the occurrence itself."],"cite":{"ch":2,"from":27,"to":27},"level":"apply","set":"B"},{"id":"B.1-3","task":"B.1","stem":"Staff teach a preschooler to say \"swing\" to get a turn on the swing and give him the swing each time he says it. Later, without being taught, he also hands adults a picture of a swing and sometimes pulls an adult's hand toward the swing set. Both get him a turn. What best explains the new forms?","options":["Reinforcement strengthened a response class whose members produce the same effect","Respondent conditioning paired the swing with the adult","The new forms are unrelated response classes that appeared on their own","Stimulus generalization spread the spoken word to new swings"],"answer":0,"why":["Correct. Consequences strengthen the whole class, so untrained forms that get the same result (a turn on the swing) can increase too.","Wrong. Nothing here is elicited by a stimulus pairing; handing the picture and pulling a hand are operant responses that produce the swing.","Wrong. The new forms produce the same effect as saying \"swing,\" so by definition they belong to the same response class.","Wrong. Stimulus generalization means new antecedent stimuli evoke the trained response; here new response forms appeared instead."],"cite":{"ch":2,"from":34,"to":35},"level":"apply","set":"B"},{"id":"B.1-4","task":"B.1","stem":"Two learners each say \"ball.\" Ruby says it while reading the word BALL on a flashcard. Theo says it while reaching toward a ball on a high shelf, and his dad hands it to him. Which statement is most accurate?","options":["They are the same behavior because the topography is identical","They belong to the same response class because each is one instance of saying \"ball\"","Ruby's is respondent behavior because the flashcard comes before it","They can be different behaviors because different variables control them"],"answer":3,"why":["Wrong. Matching form does not make matching behavior; behavior analysts classify by function and controlling variables.","Wrong. Each is a response, but response classes are grouped by shared effect, and reading aloud and getting a ball have different effects.","Wrong. An antecedent coming first does not make behavior respondent; reading aloud is operant behavior evoked by the printed word.","Correct. The printed word controls Ruby's response, while getting the ball controls Theo's. Same form, different function."],"cite":{"ch":2,"from":27,"to":27},"level":"apply","set":"B"},{"id":"B.2-1","task":"B.2","stem":"A teacher teaches Malik to say \"exit\" when he sees the green EXIT sign by his classroom. Without further training, he also says \"exit\" to red EXIT signs and lighted EXIT signs elsewhere in the school, but not to ENTER signs. The EXIT signs that evoke his response are best described as a(n):","options":["arbitrary stimulus class","response class","equivalence class formed through matching-to-sample","feature stimulus class"],"answer":3,"why":["Wrong. Arbitrary class members share no physical features, but these signs all share the same letters and layout.","Wrong. A response class groups the learner's actions (saying \"exit\"), not the signs he sees.","Wrong. No matching-to-sample training was done, and the spread happened through physical similarity, which arbitrary and equivalence classes do not rely on.","Correct. The signs share physical features, and responding spread to new, similar-looking signs, the hallmark of a feature stimulus class."],"cite":{"ch":17,"from":402,"to":403},"level":"apply","set":"B"},{"id":"B.2-2","task":"B.2","stem":"A youth soccer coach teaches players to freeze in place whenever she blows a whistle, raises a red card, or crosses her arms in an X. Players now freeze to each signal. These three signals are best described as:","options":["an arbitrary stimulus class","a feature stimulus class","a single stimulus delivered three ways","a response class"],"answer":0,"why":["Correct. A sound, a colored card, and an arm position share no physical features, yet all evoke the same response.","Wrong. Feature classes share physical form or a relation; a whistle and a red card have nothing physical in common.","Wrong. Each signal is its own energy change, detected by different senses, so these are three stimuli grouped into one class.","Wrong. Freezing is the response; the class described here is made of antecedent stimuli, not responses."],"cite":{"ch":17,"from":402,"to":403},"level":"apply","set":"B"},{"id":"B.2-3","task":"B.2","stem":"While reviewing a classroom plan, a behavior analyst lists \"praise, a high-five, and a token\" as one group because each is delivered right after a student finishes a task. Which dimension is she using to group these stimuli?","options":["Formal","Temporal","Functional","Topographical"],"answer":1,"why":["Wrong. A formal grouping uses shared physical features, and praise, a high-five, and a token differ physically.","Correct. She grouped them by when they occur relative to the behavior: all three come after it, as consequences.","Wrong. A functional grouping needs evidence that they have the same effect on behavior (for example, all increase task completion); she grouped by timing only.","Wrong. Topography refers to physical shape, which is a formal description, and these three items do not share a shape."],"cite":{"ch":2,"from":28,"to":28},"level":"apply","set":"B"},{"id":"B.2-4","task":"B.2","stem":"A man in a group home tells staff he has a sudden stomachache, then refuses to leave for his job site. A new technician says the stomachache cannot be a stimulus because no one else can see it. Which reply is most accurate?","options":["The technician is right, because stimuli must come from outside the body","The stomachache is behavior, because it happens inside the skin","The stomachache can be a stimulus: an energy change detected by receptors inside the body","It counts as a stimulus only if staff can measure it"],"answer":2,"why":["Wrong. Receptors also detect changes inside the body; behavior analysts study outside events more often only because they are easier to observe and change.","Wrong. The pain is something acting on the man that he detects, not a movement he makes, so it functions as a stimulus.","Correct. Internal sense organs detect changes in the body's organs, so a stomachache fits the definition of a stimulus.","Wrong. Being observable to others is not part of the definition; what matters is whether the change affects the person's receptors."],"cite":{"ch":2,"from":27,"to":27},"level":"apply","set":"B"},{"id":"B.3-1","task":"B.3","stem":"In a factory, a loud alarm that makes workers startle is always preceded by a flashing yellow light. After a few weeks, workers flinch when the yellow light flashes, even on days the alarm fails to sound. The yellow light is now functioning as a(n):","options":["unconditioned stimulus","conditioned stimulus","discriminative stimulus","conditioned reinforcer"],"answer":1,"why":["Wrong. An unconditioned stimulus elicits its response with no learning history; the light works only because it was paired with the alarm.","Correct. The once-neutral light was paired with the alarm (a US for startle) and now elicits flinching by itself.","Wrong. An SD evokes operant behavior because responding in its presence was followed by a consequence; no consequence maintains this flinch.","Wrong. A conditioned reinforcer follows a behavior and increases it; the light comes before the flinch and elicits it."],"cite":{"ch":2,"from":30,"to":31},"level":"apply","set":"B"},{"id":"B.3-2","task":"B.3","stem":"After several painful medical procedures, a child cries and breathes rapidly whenever she sees someone in scrubs. Her team arranges many short visits in which staff wearing scrubs come into the room and no procedures take place. Over time, the reaction fades. This procedure is best described as:","options":["operant extinction","negative punishment","higher-order conditioning","respondent extinction"],"answer":3,"why":["Wrong. Operant extinction stops the reinforcer that used to follow a behavior; here the CS (scrubs) is presented without the US (the painful procedure).","Wrong. Negative punishment removes a stimulus after a behavior to reduce it; nothing is taken away after the child cries.","Wrong. Higher-order conditioning pairs a new neutral stimulus with an existing CS to create another CS; this procedure weakens a CS instead.","Correct. Presenting the CS again and again without the US until it stops eliciting the response is respondent extinction."],"cite":{"ch":2,"from":31,"to":31},"level":"apply","set":"B"},{"id":"B.3-3","task":"B.3","stem":"A 4-year-old cried when she scraped her knee. Months later, she cries whenever she cannot find a toy, and a parent reliably comes over and finds it for her. This crying now happens several times a day. Which best describes the crying about missing toys?","options":["Operant behavior maintained by its consequence, a parent's help","Respondent behavior, because crying is a reflex","Respondent behavior conditioned by pairing missing toys with pain","Not behavior, because crying is an emotional state"],"answer":0,"why":["Correct. The crying is increasing because of what follows it (a parent arrives and finds the toy), which marks operant behavior.","Wrong. Crying can be elicited (the scraped knee), but form does not decide the type; no eliciting stimulus precedes this crying, and it grows because of what follows.","Wrong. Missing toys were never paired with a painful US; the history here is a consequence that follows the crying.","Wrong. Crying involves movement of muscles and glands, so it is behavior; calling it an emotional state names nothing to observe or change."],"cite":{"ch":2,"from":32,"to":32},"level":"apply","set":"B"},{"id":"B.3-4","task":"B.3","stem":"Which statement correctly contrasts a conditioned stimulus (CS) with a discriminative stimulus (SD)?","options":["A CS evokes operant behavior, while an SD elicits respondent behavior","A CS gains control through consequences that followed responding, while an SD gains control through pairing with a US","A CS gains control by being paired with an eliciting stimulus, while an SD gains control because responses in its presence were reinforced","Both gain control the same way, through pairing with an unconditioned stimulus"],"answer":2,"why":["Wrong. This is reversed: a CS elicits respondent behavior, and an SD evokes operant behavior.","Wrong. This is also reversed: consequences build an SD's control, while a CS is paired with a US or another CS.","Correct. A CS borrows its power from an eliciting stimulus it was paired with; an SD gets its power from differential reinforcement of responding in its presence.","Wrong. Only the CS's history is pairing with an eliciting stimulus; the SD's control comes from differing consequences in its presence and absence."],"cite":{"ch":17,"from":398,"to":399},"level":"recall","set":"B"},{"id":"B.4-1","task":"B.4","stem":"During math, Leo tears up his worksheet. Each time, his teacher quietly removes the torn pages and does not give him another worksheet for the rest of the period. Over two weeks, worksheet tearing during math increases. Which contingency best explains the increase?","options":["Positive punishment","Negative reinforcement","Positive reinforcement","Negative punishment"],"answer":1,"why":["Wrong. Punishment of any kind means the behavior decreases. Tearing went up, so this cannot be punishment.","Correct. The math work was already in front of him, tearing got it removed, and tearing increased. A present stimulus removed plus an increase is negative reinforcement (escape from the task).","Wrong. No new stimulus was delivered after tearing. The key change was that the work disappeared, which is a removal, not an addition.","Wrong. Negative punishment also removes something, but the behavior would decrease. Here tearing increased."],"cite":{"ch":12,"from":288,"to":289},"level":"apply","set":"B"},{"id":"B.4-2","task":"B.4","stem":"A loud leaf blower starts outside Ana's office every afternoon at 3:00. After a week, Ana begins closing her window at 2:55, before the noise starts, and she now does this every day. Which contingency is most likely maintaining her early window closing?","options":["Negative reinforcement in the form of avoidance","Negative reinforcement in the form of escape","Positive reinforcement","Positive punishment"],"answer":0,"why":["Correct. Closing the window before 3:00 keeps the noise from ever reaching her, and the behavior has increased. Preventing or postponing an unpleasant event is avoidance.","Wrong. Escape means the response ends a stimulus that is already present. The noise has not started yet when she closes the window.","Wrong. Nothing new is added after she closes the window. The consequence is that an unpleasant noise never arrives.","Wrong. Positive punishment would make window closing happen less often. It is happening more often."],"cite":{"ch":12,"from":289,"to":290},"level":"apply","set":"B"},{"id":"B.4-3","task":"B.4","stem":"Whenever Jordan calls out in class, his teacher turns to him and says firmly, \"Jordan, raise your hand.\" A month of data shows that call-outs have increased since the teacher began doing this. What is the reprimand functioning as for calling out?","options":["A positive punisher, because reprimands are unpleasant","A negative reinforcer, because the firm tone is aversive","A positive reinforcer, because it is added after calling out and calling out increased","A negative punisher, because Jordan loses the teacher's approval"],"answer":2,"why":["Wrong. A consequence counts as punishment only if the behavior decreases. Calling out increased, whatever the teacher intended.","Wrong. A negative reinforcer has to be removed after the behavior. The reprimand is delivered, not taken away.","Correct. Reinforcement is defined by the increase, and the reprimand is a stimulus presented after the behavior. Teacher attention, even a scolding, can work as positive reinforcement.","Wrong. Nothing Jordan had was taken away, and the behavior went up, not down."],"cite":{"ch":2,"from":36,"to":37},"level":"apply","set":"B"},{"id":"B.4-4","task":"B.4","stem":"Which statement best captures the difference between positive and negative reinforcement?","options":["Positive reinforcement increases behavior, and negative reinforcement decreases it.","Positive reinforcement uses pleasant consequences, and negative reinforcement uses unpleasant ones.","Positive reinforcement is delivered by another person, and negative reinforcement happens on its own.","Both increase behavior; they differ in whether a stimulus is presented or an already-present stimulus is removed."],"answer":3,"why":["Wrong. Every form of reinforcement increases behavior. A consequence that decreases behavior is punishment.","Wrong. Positive and negative are not about good and bad. Ending a severe pain is negative reinforcement and can be far more welcome than a small treat.","Wrong. That mixes in a different distinction, socially mediated versus automatic. Either kind of reinforcement can come from another person or from the behavior itself.","Correct. The effect is the same (behavior goes up). The difference is the type of stimulus change: something added versus something already there taken away."],"cite":{"ch":12,"from":288,"to":288},"level":"recall","set":"B"},{"id":"B.5-1","task":"B.5","stem":"Each time 8-year-old Priya hits her brother during a board game, her mother takes Priya's game piece off the board for two turns. Over the next few weeks, hitting during games drops sharply. Which principle best describes this contingency?","options":["Positive punishment","Negative reinforcement","Negative punishment","Extinction"],"answer":2,"why":["Wrong. Nothing was added after hitting. Priya lost something she already had, which makes it negative, not positive.","Wrong. Hitting decreased. Any kind of reinforcement would make it increase.","Correct. Hitting was followed by losing her place in the game, a reinforcer already available, and hitting decreased. Removal plus a decrease is negative punishment, here a form of time-out.","Wrong. Extinction means withholding the reinforcer that has been maintaining hitting. Here a different reinforcer, playing the game, is taken away as a consequence."],"cite":{"ch":15,"from":352,"to":353},"level":"apply","set":"B"},{"id":"B.5-2","task":"B.5","stem":"A client climbs onto the kitchen counter several times a day. Each time he climbs, his caregiver immediately says a loud, sharp \"Down!\" Over two weeks, counter climbing becomes much less frequent. Which contingency is operating on counter climbing?","options":["Positive punishment","Negative punishment, because he loses time on the counter","Negative reinforcement, because he climbs down to stop the shouting","Positive reinforcement, because the caregiver gives him attention"],"answer":0,"why":["Correct. A stimulus, the sharp \"Down!\", is presented right after climbing, and climbing decreases. Added plus a decrease is positive punishment.","Wrong. What followed climbing was something added, the reprimand. Nothing he already had was taken away as the consequence.","Wrong. That describes a different behavior, climbing down, which would increase. For climbing up, the reprimand was added and the behavior went down. One stimulus change cannot be both for the same behavior.","Wrong. Attention can be a reinforcer, but reinforcement would make climbing increase. Climbing decreased."],"cite":{"ch":14,"from":328,"to":329},"level":"apply","set":"B"},{"id":"B.5-3","task":"B.5","stem":"An assistant principal gives Sam a lunch detention every time he swears in class. After six weeks of detentions, Sam swears about as often as he did before they started. What is the most accurate conclusion?","options":["Detention is positive punishment that is working slowly.","Detention is negative punishment, because Sam loses lunch with his friends.","Detention is negative reinforcement, because it is unpleasant.","Detention has not functioned as punishment for Sam's swearing."],"answer":3,"why":["Wrong. Punishment is identified by a decrease in behavior. Six weeks with no change means it is not punishment, and when punishment works it usually lowers behavior quickly.","Wrong. Losing a reinforcer counts as negative punishment only if the behavior then decreases. Swearing did not.","Wrong. Negative reinforcement requires a stimulus to be removed and the behavior to increase. Neither happened, and unpleasantness alone does not define any contingency.","Correct. A consequence is punishment only if the behavior it follows becomes less frequent. Whatever the school intended, detention did not reduce swearing, so it did not function as punishment."],"cite":{"ch":14,"from":327,"to":328},"level":"apply","set":"B"},{"id":"B.5-4","task":"B.5","stem":"In a classroom token economy, Marcus loses 2 of the tokens he has already earned each time he leaves his seat without permission. His out-of-seat behavior decreases over the following week. How is this best classified?","options":["Positive punishment, because Marcus receives a penalty","Negative punishment, in the form of response cost","Negative punishment, in the form of time-out","Negative reinforcement, because tokens are removed"],"answer":1,"why":["Wrong. Calling it a penalty does not make it positive. Nothing was added; tokens he had already earned were taken away.","Correct. Already-earned reinforcers are removed after the behavior, and the behavior decreases. Losing a set number of earned reinforcers is response cost, a form of negative punishment.","Wrong. Time-out is also negative punishment, but it removes access to reinforcers, or the chance to earn them, for a period of time. Marcus kept access; he lost tokens he already held.","Wrong. Removal alone does not make it reinforcement. Reinforcement requires the behavior to increase, and out-of-seat behavior decreased."],"cite":{"ch":15,"from":361,"to":361},"level":"apply","set":"B"},{"id":"B.6-1","task":"B.6","stem":"A behavior analyst observes 7-year-old Theo flapping his hands. It happens at about the same rate when he is alone in his room, when adults react to it, and when no work is being asked of him. Which source of reinforcement is most likely maintaining the hand flapping?","options":["Socially mediated positive reinforcement in the form of attention","Socially mediated negative reinforcement in the form of escape from demands","Tangible reinforcement delivered by caregivers","Automatic reinforcement produced by the behavior itself"],"answer":3,"why":["Wrong. If attention were the reinforcer, flapping should be higher when adults react and lower when he is alone. The rates were about the same.","Wrong. Escape would predict more flapping when work is presented. It occurs even when nothing is being asked of him.","Wrong. Nothing shows flapping producing items from other people, and it continues when no one is present to hand anything over.","Correct. The behavior persists when no one is around to deliver a consequence, which rules out the social sources. The likely reinforcer is the sensory stimulation the flapping itself produces."],"cite":{"ch":27,"from":629,"to":629},"level":"apply","set":"B"},{"id":"B.6-2","task":"B.6","stem":"At a group home, Dana screams whenever the TV gets loud. Each time, a staff member walks over and turns the volume down. Dana rarely screams when the TV is at a normal volume, even with staff nearby, but her screaming during loud TV has been increasing. Which contingency is most likely maintaining it?","options":["Automatic negative reinforcement, because the loud sound goes away","Socially mediated negative reinforcement","Socially mediated positive reinforcement in the form of attention","Automatic positive reinforcement from the sensation of screaming"],"answer":1,"why":["Wrong. The loud sound does go away, but another person removes it. Automatic negative reinforcement would mean Dana's own action ends the noise directly, such as covering her ears.","Correct. A stimulus already present, the loud TV, is removed and screaming increases, so it is negative reinforcement. Because a staff member does the removing, it is socially mediated.","Wrong. She rarely screams when staff are nearby and the TV is quiet, so attention alone does not explain it. The pattern points to removal of the loud sound.","Wrong. If screaming were maintained by its own sensory feedback, it would not be tied to loud TV or depend on staff turning the volume down."],"cite":{"ch":12,"from":291,"to":292},"level":"apply","set":"B"},{"id":"B.6-3","task":"B.6","stem":"At a garden center, a toddler grabs a cactus and is pricked by its spines. No adult sees it or says anything. For the rest of the visit, and on later visits, the toddler does not touch cacti. Which term best describes what happened to grabbing cacti?","options":["Socially mediated positive punishment","Negative punishment, because the toddler lost access to the plant","Automatic punishment","Automatic negative reinforcement"],"answer":2,"why":["Wrong. Pain was added and grabbing decreased, but no person delivered the pain, so it was not socially mediated.","Wrong. The toddler did let go, but what followed grabbing was pain being added. The punishing change was a presentation, not the removal of a reinforcer.","Correct. The punishing consequence came straight from the behavior, with no one else involved, and grabbing decreased. That is automatic punishment.","Wrong. Reinforcement would make grabbing cacti increase. It decreased."],"cite":{"ch":14,"from":328,"to":328},"level":"apply","set":"B"},{"id":"B.6-4","task":"B.6","stem":"Which statement correctly describes automatic reinforcement?","options":["Reinforcement produced directly by the behavior, without another person delivering the consequence","Reinforcement that strengthens behavior even when the person is unaware of the connection","Reinforcement that follows every single occurrence of a behavior","Reinforcement that comes only from unlearned sensory stimuli, never from learned ones"],"answer":0,"why":["Correct. Automatic reinforcement means no social mediation: the response itself produces the reinforcing consequence, like the satisfying feel of popping bubble wrap.","Wrong. That describes the automaticity of reinforcement, a separate idea: reinforcement works whether or not the person notices. It applies to social and automatic contingencies alike.","Wrong. Reinforcing every response describes a continuous schedule. That is about how often reinforcement occurs, not who or what delivers it.","Wrong. Automatic reinforcement can be conditioned. A tune heard during happy times can later reinforce the person's own humming of it."],"cite":{"ch":11,"from":261,"to":262},"level":"recall","set":"B"},{"id":"B.7-1","task":"B.7","stem":"At a group home, residents earn points for finishing chores. Points can be traded for snacks, outings, phone time, or choosing the movie. Staff notice that points keep chores going even right after a resident has eaten or come back from an outing. How are the points best classified?","options":["Unconditioned reinforcers, because residents work for them without being taught to","Conditioned reinforcers whose power depends on one specific motivating operation","Automatic reinforcers, because they come from finishing the chore itself","Generalized conditioned reinforcers, because many different reinforcers back them up"],"answer":3,"why":["Wrong. Points have no biological value; they matter only because they were paired with backup reinforcers. Unconditioned reinforcers, such as food or warmth, need no learning history.","Wrong. A conditioned reinforcer tied to one backup (say, only snacks) would fade right after a meal. These points keep working across many states because they buy many things.","Wrong. Staff hand out the points, so another person delivers them. Automatic reinforcement comes straight from the behavior itself, with no one else involved.","Correct. Points that trade for many backups keep working across many motivating conditions. That is what makes a conditioned reinforcer generalized, like money or tokens."],"cite":{"ch":11,"from":264,"to":264},"level":"apply","set":"B"},{"id":"B.7-2","task":"B.7","stem":"Twice, a toddler touched a hot oven door, felt a painful burn, and heard his father shout \"Hot!\" Now he stops reaching toward the oven, and he also stops reaching for a curling iron when his father says \"Hot!\" Which stimulus change functioned as an unconditioned punisher for reaching?","options":["The word \"Hot!\", because it now stops reaching all by itself","The painful heat of the oven door, because it works as a punisher without any pairing history","The father's disapproval, because disapproval has been paired with many different punishers","Pulling his hand back, because escaping the heat ended the pain"],"answer":1,"why":["Wrong. \"Hot!\" gained its suppressing power by being paired with the burn. That makes it a conditioned punisher, not an unconditioned one.","Correct. Painful stimulation can punish behavior without ever being paired with another punisher, because our species evolved to be affected by it. That is the mark of an unconditioned punisher.","Wrong. Disapproval that works because of pairing with many punishers is a generalized conditioned punisher: learned, not unconditioned. Nothing here shows disapproval alone reduced reaching.","Wrong. Pulling away is a different response, strengthened by negative reinforcement (the pain stops). It is not a consequence that reduced reaching."],"cite":{"ch":14,"from":329,"to":330},"level":"apply","set":"B"},{"id":"B.7-3","task":"B.7","stem":"A therapist says \"Nice!\" only right before giving a client a bite of a favorite snack. After many pairings, saying \"Nice!\" right after the client raises his hand increases hand raising in the hour before lunch, but it has little effect right after lunch. What best explains this?","options":["\"Nice!\" is a generalized conditioned reinforcer, so the pairing must have failed","More pairings are needed, because a conditioned reinforcer gets stronger with every pairing","\"Nice!\" is a conditioned reinforcer backed only by food, so it depends on the motivating operation for food","\"Nice!\" is an unconditioned reinforcer, and those always depend on deprivation"],"answer":2,"why":["Wrong. \"Nice!\" has been paired with only one kind of reinforcer, so it is not generalized. A generalized reinforcer would hold up after lunch; this one is not expected to.","Wrong. Pairings help a stimulus become a conditioned reinforcer, but its strength at a given moment depends on motivation for its backup reinforcer, not on the pairing count.","Correct. \"Nice!\" borrowed its power from food, so it works while food is currently valuable (before lunch) and weakens when the client has just eaten.","Wrong. A word has no biological value; it reinforces only because of its pairing history, which makes it conditioned. The snack, not \"Nice!\", is the unconditioned reinforcer here."],"cite":{"ch":11,"from":263,"to":264},"level":"apply","set":"B"},{"id":"B.7-4","task":"B.7","stem":"Why is money called a generalized conditioned reinforcer?","options":["It has been paired with many other reinforcers, so it works across many motivating conditions","It can strengthen many different kinds of behavior, not just one","It works for nearly everyone without any learning history","It keeps working even if it can no longer be exchanged for anything"],"answer":0,"why":["Correct. Because money can be traded for almost anything, its effect does not hinge on wanting any one particular thing right now.","Wrong. This is the classic mix-up. Any reinforcer can strengthen whatever behavior it immediately follows; \"generalized\" refers to working across motivating conditions.","Wrong. Working with no learning history describes unconditioned reinforcers, like food and water. Money's value is learned.","Wrong. A generalized reinforcer's strength comes from what backs it up. The more reinforcers it has been paired with, the more likely it is to work; money that buys nothing would lose that backing."],"cite":{"ch":11,"from":264,"to":264},"level":"recall","set":"B"},{"id":"B.8-1","task":"B.8","stem":"A teacher sets a vibrating timer for 4 minutes. After it vibrates, the first time Maya raises her hand appropriately she earns a point, and the teacher restarts the timer. Hand raises before the timer vibrates earn nothing. Which schedule is in effect?","options":["Fixed ratio 4 (FR 4)","Fixed time 4 minutes (FT 4-min)","Fixed interval 4 minutes (FI 4-min)","Variable interval 4 minutes (VI 4-min)"],"answer":2,"why":["Wrong. A ratio schedule counts responses. Here the number of hand raises does not matter; only time passing and then one response do.","Wrong. A fixed-time schedule delivers the reinforcer on the clock whether or not the person responds. Maya must still raise her hand after the timer vibrates.","Correct. The interval stays the same (4 minutes), and the first response after it ends is reinforced. That is a fixed interval schedule.","Wrong. On a VI schedule the interval length changes from one reinforcer to the next around an average. This timer is always set to 4 minutes."],"cite":{"ch":13,"from":307,"to":307},"level":"apply","set":"B"},{"id":"B.8-2","task":"B.8","stem":"At a vocational program, a client earns a token after an unpredictable number of completed packets: sometimes 2, sometimes 12, averaging 6. Once this schedule is well established, which response pattern should staff expect?","options":["A high, steady rate of packet completion with little pausing after tokens","A pause after each token, followed by a fast run of work until the next token","A pause after each token, then work that gradually speeds up over time","A low-to-moderate steady rate, since faster work does not earn tokens sooner"],"answer":0,"why":["Correct. This is a variable ratio (VR 6) schedule. Because any packet might be the one that pays off, VR schedules produce high, steady responding without the usual pause after reinforcement.","Wrong. A pause and then a fast run (break-and-run) is the fixed ratio pattern, where the same count is required every time.","Wrong. A pause followed by gradually speeding up (the scallop) is the fixed interval pattern, where time, not packet count, controls availability.","Wrong. A steady low-to-moderate rate fits a variable interval schedule. Here the count decides, so faster work does earn tokens sooner."],"cite":{"ch":13,"from":304,"to":305},"level":"apply","set":"B"},{"id":"B.8-3","task":"B.8","stem":"A clinic manager wants staff to enter session notes faster. Plan 1: a staff member gets a short break after every 20 notes entered. Plan 2: a staff member gets a short break for the first note entered after each 20-minute period. Which statement is most accurate?","options":["Plan 2 is a fixed-time schedule, because time decides when breaks happen","Both plans should produce the same rate, because the reinforcer is the same","Plan 2 should produce faster work, because more notes during the period earn more breaks","Plan 1 is a fixed ratio; working faster brings breaks sooner, so it should support a higher rate"],"answer":3,"why":["Wrong. Under Plan 2 a note must still be entered after the 20 minutes pass. A fixed-time schedule would give the break on the clock with no response required.","Wrong. The schedule matters, not just the reinforcer. Ratio and interval rules reward speed very differently, so they tend to produce different rates.","Wrong. On an interval schedule, notes entered during the 20 minutes earn nothing extra; only one response after the interval is needed. Faster work adds no breaks.","Correct. Under a ratio schedule the person's own pace sets how often reinforcement comes, which is why ratio schedules tend to produce high rates."],"cite":{"ch":13,"from":302,"to":304},"level":"apply","set":"B"},{"id":"B.8-4","task":"B.8","stem":"To reduce attention-maintained calling out, a teacher gives Leo a few seconds of friendly attention every 3 minutes, whatever he happens to be doing at that moment. Which schedule describes how the attention is delivered?","options":["Fixed interval 3 minutes, because attention is tied to a 3-minute timer","Fixed time 3 minutes, because attention arrives on the clock regardless of behavior","Variable time 3 minutes, because Leo's behavior varies from one interval to the next","Extinction, because calling out no longer produces attention"],"answer":1,"why":["Wrong. An FI schedule reinforces the first response after the interval. Here no response is required at all, so it is not an interval schedule.","Correct. Delivering a reinforcer at a set time, independent of responding, is a fixed-time schedule, the most common way to deliver noncontingent reinforcement (NCR).","Wrong. \"Variable\" refers to the time between deliveries changing around an average, not to the learner's behavior. The teacher uses the same 3 minutes every time.","Wrong. Attention is still being given, just not tied to calling out. Extinction withholds the reinforcer; NCR hands it out freely on a time schedule."],"cite":{"ch":26,"from":617,"to":617},"level":"apply","set":"B"},{"id":"B.9-1","task":"B.9","stem":"A functional analysis shows that Jaden tears up his worksheets because doing so gets him out of writing tasks. Which procedure applies extinction to worksheet tearing?","options":["Ignore the tearing and let Jaden sit quietly for the rest of the writing period","Give Jaden a fresh worksheet and keep the writing task in place, so tearing never ends the task","Give Jaden a short break from writing every 5 minutes, whatever he is doing","Take away one of Jaden's earned tokens each time he tears a worksheet"],"answer":1,"why":["Wrong. Ignoring withholds attention, but attention is not the maintaining reinforcer. Jaden still escapes writing, so tearing keeps paying off.","Correct. For escape-maintained behavior, extinction means the behavior no longer removes the task. This is escape extinction.","Wrong. Breaks on a time schedule regardless of behavior are noncontingent reinforcement. NCR can lower the motivation to escape, but it does not withhold the maintaining reinforcer after tearing.","Wrong. Removing earned tokens after the behavior is response cost, a negative punishment procedure, not extinction."],"cite":{"ch":24,"from":583,"to":585},"level":"apply","set":"B"},{"id":"B.9-2","task":"B.9","stem":"A behavior analyst reviews four case notes. Which one describes operant extinction?","options":["A teen's French fades over two summers when she has no chance to speak it","A therapist holds a client's hands down each time he starts to scratch his arm","A teacher praises Ana every 2 minutes no matter what she is doing, and her call-outs drop","A client still scratches, but thin gloves keep scratching from producing the skin sensation that maintained it"],"answer":3,"why":["Wrong. Weakening from lack of opportunity to respond is forgetting. In extinction the behavior occurs but no longer produces reinforcement.","Wrong. Holding the hands down is response blocking: it prevents the behavior. Extinction lets the behavior occur but cuts it off from its reinforcer.","Wrong. Time-based praise regardless of behavior is noncontingent reinforcement. It lowers motivation (an abolishing operation) rather than withholding the reinforcer after call-outs.","Correct. The behavior can still occur, but its maintaining sensory consequence is masked. That is sensory extinction, the form used for automatically reinforced behavior."],"cite":{"ch":24,"from":583,"to":584},"level":"apply","set":"B"},{"id":"B.9-3","task":"B.9","stem":"An assessment shows a boy's bedtime crying is maintained by his parents coming back into his room. The parents stop returning when he cries. That first night, he starts crying again and again, with far more crying episodes than on any night before. What is the best interpretation?","options":["An extinction burst, a common early effect that often means the maintaining reinforcer is being withheld","Spontaneous recovery, showing that crying has returned after extinction","Resurgence, because a previously reinforced behavior has come back","Evidence the procedure is failing, so the parents should go back to their old routine"],"answer":0,"why":["Correct. A sudden jump in how often a behavior occurs, right after its reinforcement stops, is an extinction burst. It usually signals that the right reinforcer was identified, so the parents should stay consistent. (Louder or more forceful crying would be a related early effect that Cooper lists separately: an initial increase in response magnitude.)","Wrong. Spontaneous recovery is the brief return of a behavior after it has already decreased under extinction. Crying has not decreased yet; this is the very first night.","Wrong. Resurgence happens when reinforcement stops for an alternative behavior that had replaced the target. No alternative behavior was reinforced and then put on extinction here.","Wrong. Getting worse before getting better is expected early in extinction. Going back into the room now would reinforce the burst and teach him that crying more pays off."],"cite":{"ch":24,"from":587,"to":588},"level":"apply","set":"B"},{"id":"B.9-4","task":"B.9","stem":"A team placed a child's toy grabbing on extinction and reinforced asking, \"Can I have a turn?\" Grabbing dropped to zero and asking rose. Months later, staff stopped responding to the child's requests, and grabbing came back even though it still earned nothing. What is this effect called?","options":["Spontaneous recovery","An extinction burst","Resurgence","Extinction-induced response variation"],"answer":2,"why":["Wrong. Spontaneous recovery is a brief reappearance of the extinguished behavior while extinction continues. Here the return was set off by ending reinforcement for the replacement behavior, which points to resurgence.","Wrong. An extinction burst is an increase right when extinction begins. Grabbing had been at zero for months.","Correct. An old behavior returning when reinforcement for the alternative that replaced it stops is resurgence: reinforce the target, extinguish it while reinforcing an alternative, then extinguish both.","Wrong. Response variation means new or different forms of behavior appear during extinction. Grabbing is the original behavior coming back, not a new form."],"cite":{"ch":24,"from":588,"to":589},"level":"apply","set":"B"},{"id":"B.10-1","task":"B.10","stem":"On the school bus, Tyler curses often when a substitute driver is on duty but almost never when Ms. Lee drives. Ms. Lee has written him up every time she heard him curse; substitutes have never reacted. In this contingency, Ms. Lee's presence is best described as:","options":["A stimulus delta (S-delta), because cursing happens much less often whenever she is the driver","A discriminative stimulus for punishment (SDp), since cursing has been punished around her","A conditioned punisher, because her write-ups have reduced Tyler's cursing","An abolishing operation, because her presence makes the consequences of cursing less valuable"],"answer":1,"why":["Wrong. An S-delta is correlated with no reinforcement, or weaker reinforcement, for the response. Here cursing has been followed by write-ups in her presence, which is a punishment history, not a reinforcement history.","Correct. Cursing in Ms. Lee's presence has been punished, and cursing around substitutes has not, so her presence now lowers the likelihood of cursing. Cooper calls such an antecedent an SDp.","Wrong. A conditioned punisher is a consequence that follows behavior. Ms. Lee's presence comes before the cursing and signals the punishment contingency; the write-up is the consequence.","Wrong. An abolishing operation lowers how effective a reinforcer is. Whatever reinforces cursing (peer laughter, for instance) would still be worth something when she drives; cursing drops because it has been punished there."],"cite":{"ch":14,"from":330,"to":331},"level":"apply","set":"B"},{"id":"B.10-2","task":"B.10","stem":"A new barista learns that when the manager calls out \"decaf,\" she should grab the pot with the orange handle, and when he calls \"regular,\" she should grab the pot with the black handle. Only grabbing the matching pot earns the manager's \"Perfect.\" Which analysis is correct?","options":["This is a simple discrimination, because only one pot is correct on each order","The handle colors are the conditional stimuli, and the manager's words are the discriminative stimuli","The manager's words are motivating operations that make coffee more valuable to the barista","This is a conditional discrimination: the manager's word determines which handle functions as the SD"],"answer":3,"why":["Wrong. In a simple discrimination, one antecedent controls the response by itself. Here the orange handle is correct after \"decaf\" and incorrect after \"regular,\" so its function depends on another stimulus.","Wrong. This reverses the roles. The spoken order is the conditional stimulus; the handle that matches it is the SD on that trial.","Wrong. The spoken order does not change how much the manager's praise is worth to the barista; it signals which pot-grab will be reinforced, which is a discriminative role.","Correct. Which choice gets reinforced depends on a second stimulus, the order. The order is the conditional stimulus, and it decides which handle color serves as the SD."],"cite":{"ch":17,"from":397,"to":398},"level":"apply","set":"B"},{"id":"B.10-3","task":"B.10","stem":"A teacher's vocabulary worksheet prints each science term and its correct definition in the same ink color. Students score 100% on the worksheet but fail a quiz on which everything is printed in black. The worksheet most likely produced:","options":["Faulty stimulus control, because ink color rather than word meaning controlled the answers","Overselective stimulus control, because students attended to one tiny detail of each definition","Stimulus generalization, because students responded the same way to stimuli that looked alike","A conditional discrimination, because the correct definition depended on the term's color"],"answer":0,"why":["Correct. The answers came under the control of an irrelevant feature (color) instead of the critical one (meaning). Cooper uses poorly designed materials like this as the classic case of faulty stimulus control; when the cue vanished, accuracy collapsed.","Wrong. Overselectivity is control by an extremely limited range of features of the stimulus itself, such as one part of an object. Here an extra cue built into the worksheet, not a detail of the words, ran the behavior.","Wrong. Stimulus generalization is a trained response occurring with new stimuli that resemble the trained one. The problem here is control by the wrong feature from the start, not spread to similar stimuli.","Wrong. In a conditional discrimination, a second relevant stimulus is meant to decide which choice is correct. Here color was an accidental shortcut that let students skip the skill the worksheet was meant to teach."],"cite":{"ch":17,"from":397,"to":397},"level":"apply","set":"B"},{"id":"B.10-4","task":"B.10","stem":"Each day during math, a teacher hands Liam a worksheet, Liam rips it up, and the teacher takes the task away. A staff member writes, \"The worksheet is the SD for ripping.\" Following Cooper, the worksheet's presentation is better described as:","options":["An SD, because ripping has produced task removal only when a worksheet was present","A conditioned reinforcer, because its removal follows the ripping","An establishing operation, because it makes escape valuable and evokes ripping","A conditioned stimulus, because the worksheet elicits ripping after being paired with frustration"],"answer":2,"why":["Wrong. For an SD, the reinforcer must be valuable but unavailable when the stimulus is absent. With no worksheet there is nothing to escape, so escape is not a reinforcer at all then; that is a motivating relation, not a discriminative one.","Wrong. The reinforcer is the worksheet's removal (negative reinforcement), not the worksheet itself. The question also asks about the worksheet as an antecedent, not as a consequence.","Correct. The worksheet does not signal that a valuable reinforcer is available; it creates the very condition that makes escape worth anything. Cooper classifies a task request like this as an EO that evokes escape-maintained behavior.","Wrong. A conditioned stimulus elicits respondent behavior after pairing with another eliciting stimulus. Ripping is operant behavior maintained by its consequence (task removal), so respondent terms do not fit."],"cite":{"ch":17,"from":399,"to":399},"level":"apply","set":"B"},{"id":"B.11-1","task":"B.11","stem":"Rosie's parents reinforced her for saying \"doggy\" to the family's golden retriever. On a walk, she says \"doggy\" to a neighbor's beagle, which she was never taught to name, but she does not say it to a cat. Saying \"doggy\" to the beagle is an example of:","options":["Stimulus generalization, because the trained word spread to a similar, untrained stimulus","Response generalization, because a new and untrained form of the naming response appeared","Stimulus discrimination, because she responds differently to different stimuli","Faulty stimulus control, because an irrelevant feature now controls the word"],"answer":0,"why":["Correct. The same response (\"doggy\") spread from the trained stimulus to an untrained one with similar physical features. That is stimulus generalization.","Wrong. Response generalization means untrained but functionally equivalent responses appear (for example, saying \"puppy\"). Rosie used the same trained word; what changed was the stimulus.","Wrong. Discrimination describes the part where she does not say \"doggy\" to the cat. Saying it to the beagle shows the response spreading, which is generalization.","Wrong. Faulty control means an irrelevant cue runs the behavior. A beagle shares the features that make something a dog, so responding to it is not control by an irrelevant cue."],"cite":{"ch":17,"from":396,"to":396},"level":"apply","set":"B"},{"id":"B.11-2","task":"B.11","stem":"A therapist taught Kai to wave \"hi\" when she enters the room. In probes with no reinforcement, five other adults enter one at a time, each progressively less like the therapist in age, voice, and appearance. Kai waves just as often to the least similar adult as to the most similar one. If these probe data were plotted as a generalization gradient, the gradient would be:","options":["Steep, showing tight stimulus control by the therapist","Steep, showing broad stimulus generalization","Flat, showing broad generalization and weak stimulus control","Flat, showing that waving failed to maintain once training ended"],"answer":2,"why":["Wrong. A steep slope would mean waving dropped off as the adults became less like the therapist. Kai waved equally to all of them, so there is no drop-off.","Wrong. Steepness signals more stimulus control (discrimination), not more generalization.","Correct. About the same responding across very different stimuli gives a flat slope. Cooper notes that a flat gradient shows little stimulus control, which means generalization is broad.","Wrong. A gradient shows how responding spreads across stimuli, not whether it lasts over time. Kai is still waving, so maintenance is not the issue."],"cite":{"ch":17,"from":396,"to":397},"level":"apply","set":"B"},{"id":"B.11-3","task":"B.11","stem":"After learning to say \"cow\" to pictures of cows, a learner now also says \"cow\" to pictures of horses, deer, and goats. What should the behavior analyst do to sharpen stimulus control?","options":["Present many more cow pictures and reinforce every \"cow\"","Reinforce \"cow\" only for cows, not for horses, deer, or goats","Place \"cow\" on extinction across all pictures until the errors stop","Teach other words for cows, such as \"cattle\" and \"calf,\" to build response generalization"],"answer":1,"why":["Wrong. Varied cow examples help generalization within the class, but without nonexamples nothing teaches the learner where the class ends, so \"cow\" for horses would continue.","Correct. Differential reinforcement with examples (SD) and nonexamples (S-delta) narrows control to the right stimulus class. A concept needs both generalization within the class and discrimination from other classes.","Wrong. Extinguishing \"cow\" everywhere would weaken the correct response to real cows too. The goal is to keep \"cow\" with cows and drop it elsewhere.","Wrong. Adding new response forms does nothing about the actual problem, which is that too broad a set of stimuli controls the word \"cow.\""],"cite":{"ch":17,"from":401,"to":402},"level":"apply","set":"B"},{"id":"B.11-4","task":"B.11","stem":"Which statement about stimulus discrimination and stimulus generalization matches Cooper?","options":["Generalization is most likely with new stimuli that differ physically from the original SD","Discrimination can develop only if responses in the S-delta condition receive zero reinforcement","A flat generalization gradient indicates strong stimulus control","They are relative: generalization means loose control, discrimination tight control"],"answer":3,"why":["Wrong. Generalization is most likely with stimuli that share physical properties with the SD, such as a slightly different shade of the trained color.","Wrong. Discrimination can also develop when the S-delta condition simply provides less or lower-quality reinforcement than the SD condition, not only zero.","Wrong. A flat gradient means responding is about the same across stimuli, which shows little stimulus control. A steeper slope shows more control.","Correct. Cooper treats the two as ends of one dimension: loose control looks like generalization, and tight control looks like discrimination."],"cite":{"ch":17,"from":396,"to":396},"level":"recall","set":"B"},{"id":"B.12-1","task":"B.12","stem":"Owen, a 6-year-old who uses picture exchange to communicate, missed his afternoon snack because of a fire drill. For the next hour he hands over his \"crackers\" card far more often than usual. After he finally eats, he barely uses the card. The missed snack (food deprivation) is best described as:","options":["A conditioned motivating operation, because handing over a picture card is learned behavior","A discriminative stimulus, because it signals that crackers are available","An unconditioned establishing operation that raises food's value and evokes card exchanges","An abolishing operation that lowers the value of other activities"],"answer":2,"why":["Wrong. An MO is unconditioned when its value-altering effect needs no learning. The card exchange is learned, but the boost in food's value from deprivation is not, so this is a UMO.","Wrong. Deprivation does not tell Owen that crackers can be had; it changes how much crackers are worth. An SD is about availability, and an MO is about value.","Correct. Food deprivation is a UMO with a reinforcer-establishing effect (food matters more) and an evocative effect (more card exchanges). Eating then acts as an abolishing operation and abates the card use.","Wrong. The effect here is on food and on behavior that has produced food. Deprivation raised, not lowered, the value of the relevant reinforcer."],"cite":{"ch":16,"from":379,"to":380},"level":"apply","set":"B"},{"id":"B.12-2","task":"B.12","stem":"An RBT uses fruit snacks to reinforce correct responses. Today the client ate a large birthday-party lunch right before the session, and he works slowly and ignores the fruit snacks he usually races to earn. Which description fits the large lunch?","options":["An abolishing operation that lowers food's value and abates food-reinforced behavior","An establishing operation, with a reinforcer-establishing effect and an evocative effect","Extinction, because the fruit snacks are no longer available for correct responses","An S-delta, because the full stomach signals that fruit snacks will not be delivered"],"answer":0,"why":["Correct. Food ingestion is a UMO that works as an abolishing operation: for the moment it lowers food's effectiveness as a reinforcer and abates behavior that food has reinforced.","Wrong. An establishing operation would make food more valuable and increase food-reinforced responding. The client's behavior went the other way.","Wrong. The snacks are still being offered. Responding dropped because the snacks lost value, not because reinforcement stopped; that difference is what separates an MO effect from extinction.","Wrong. An S-delta signals that a reinforcer that would still be valuable is unavailable. Here the snacks are available but no longer valuable, which is an MO effect."],"cite":{"ch":16,"from":378,"to":380},"level":"apply","set":"B"},{"id":"B.12-3","task":"B.12","stem":"Whenever Mr. Hall's lower back flares up, he lies on a heating pad; on pain-free days he never uses it. A trainee writes that the back pain is the SD for using the heating pad. What is the best correction?","options":["The back pain is an unconditioned stimulus that elicits heating-pad use as a reflex","The back pain is a conditioned MO, because using a heating pad is learned behavior","The pain-free days are an S-delta, because heating-pad use does not produce relief on those days","The back pain is a UMO: it makes relief valuable and evokes pain-reducing behavior"],"answer":3,"why":["Wrong. Lying on a heating pad is operant behavior maintained by its consequence (pain relief). An unconditioned stimulus elicits respondent behavior regardless of consequences.","Wrong. The heating-pad routine is learned, but pain makes relief valuable with no learning history. UMO status depends on the value-altering effect, not on whether the evoked behavior was learned.","Wrong. An S-delta marks a condition in which a still-valuable reinforcer is unavailable. On pain-free days relief is not just unavailable, it is worthless, so the drop in heating-pad use is an MO effect, not discrimination.","Correct. For an SD, the reinforcer must stay valuable when the stimulus is absent. Relief is worth nothing without pain, so an increase in painful stimulation functions as a UMO, not an SD."],"cite":{"ch":16,"from":378,"to":379},"level":"apply","set":"B"},{"id":"B.12-4","task":"B.12","stem":"Which of these events does Cooper classify as an unconditioned motivating operation?","options":["An adult employee going a week without any praise from a supervisor","Becoming uncomfortably cold while waiting outside for a bus","Seeing the sign of a restaurant where one often eats when hungry","Hearing a parent announce, \"It's snack time!\""],"answer":1,"why":["Wrong. For most adults, praise and attention are conditioned reinforcers, so going without them acts as a conditioned MO, not a UMO.","Correct. Becoming too cold is on Cooper's list of UMOs: with no learning required, it turns warmth into an effective reinforcer and makes warming-up behavior, such as zipping up a coat, more likely right now.","Wrong. A restaurant sign could gain a motivating effect only through a history of pairing with food deprivation, which would make it a conditioned MO, not an unconditioned one.","Wrong. The announcement signals that snacks are available, a discriminative function learned through experience. It does not change food's value without learning."],"cite":{"ch":16,"from":380,"to":381},"level":"recall","set":"B"},{"id":"B.13-1","task":"B.13","stem":"A graduate student studies for 2 hours every night for 3 months because her advisor told her, \"Students who review daily pass the comprehensive exam.\" Her score will not arrive until a month after the exam. Which best describes her nightly studying?","options":["Contingency-shaped behavior, directly reinforced by the passing score","Rule-governed behavior, controlled by the advisor's statement of the contingency","Respondent behavior elicited by the advisor's statement","Contingency-shaped behavior maintained by an intermittent schedule of reinforcement"],"answer":1,"why":["Wrong. The score comes months after most study sessions. Consequences that far away cannot reinforce behavior directly, because many other behaviors occur in between.","Correct. Her studying is controlled by a verbal statement of a behavior-consequence relation. A rule like this lets a remote outcome influence what she does each night.","Wrong. Studying is operant behavior, not a reflex. The advisor's statement works as a rule describing a contingency, not as a stimulus that elicits a response.","Wrong. An intermittent schedule still delivers reinforcers soon after some responses. Here no consequence follows any study session; the only payoff is months away."],"cite":{"ch":11,"from":254,"to":255},"level":"apply","set":"B"},{"id":"B.13-2","task":"B.13","stem":"A behavior analyst is giving parents examples of different kinds of learning. Which is the best example of contingency-shaped behavior?","options":["A tourist works an unfamiliar ticket machine by following the steps printed on its screen","A new employee clocks in on time because the handbook says late arrivals lose pay","A teen wears sunscreen because her dermatologist warned about skin damage years from now","A toddler's balance on a scooter improves over many wobbles, falls, and smooth rides, with no instruction"],"answer":3,"why":["Wrong. The printed steps are a rule. She performs correctly with no history on that machine, which is the hallmark of rule-governed behavior.","Wrong. The handbook describes the contingency in words. Clocking in on time is controlled by that description, so it is rule-governed.","Wrong. Skin damage years away cannot affect behavior directly. The warning works as a rule linking sunscreen use to a remote outcome.","Correct. No one described anything. The immediate natural consequences of each movement (staying up, tipping over) selected the toddler's balance, which is direct contact with the contingencies."],"cite":{"ch":2,"from":42,"to":42},"level":"apply","set":"B"},{"id":"B.13-3","task":"B.13","stem":"In a human operant study, a college student earns points for clicking a button while the screen border is blue; while it is gray, clicks earn nothing. She clicks at the same steady rate in both conditions. Afterward she says, \"I could tell gray never paid, but I figured you were testing whether people quit when it gets hard, and I don't quit.\" What best explains her clicking during the gray periods?","options":["A self-generated rule is controlling her clicking, overriding the extinction contingency","The gray periods produced an extinction burst","Clicking was automatically reinforced, so the point contingency did not matter","Stimulus generalization from the blue border to the gray border"],"answer":0,"why":["Correct. She knew the gray periods paid nothing and kept clicking anyway because of her own rule about not quitting. Rules, including self-made ones, can make responding insensitive to the schedule that is actually in effect.","Wrong. An extinction burst is a temporary rise in responding when extinction begins. Her rate stayed steady, and she gave a rule-based reason for it.","Wrong. Nothing suggests clicking was reinforcing in itself. She tied her clicking to what she believed the researcher was looking for.","Wrong. Generalization means responding spreads to a stimulus the learner does not tell apart from the trained one. She says she could tell gray never paid, so she did discriminate the borders; her rule about persistence explains the clicking."],"cite":{"ch":13,"from":302,"to":303},"level":"apply","set":"B"},{"id":"B.13-4","task":"B.13","stem":"Which observation most strongly suggests that a behavior change is rule-governed rather than a direct effect of reinforcement?","options":["The reinforcer was delivered within 1 second of each response","Responding increased gradually over many reinforced trials","Responding jumped sharply after a single delivery of the reinforcer","Responding decreased when the reinforcer was withheld"],"answer":2,"why":["Wrong. An immediate consequence is exactly the condition under which reinforcement works directly. It does not point to a rule.","Wrong. Gradual strengthening across many reinforced responses is the usual pattern of direct reinforcement.","Correct. Cooper lists a large increase after one instance of reinforcement as a sign of rule control. The learner likely stated or was given a rule.","Wrong. A drop when reinforcement stops is ordinary extinction, which fits direct control by the consequence."],"cite":{"ch":11,"from":255,"to":255},"level":"recall","set":"B"},{"id":"B.14-1","task":"B.14","stem":"Andre, who communicates with sign language, has had nothing to drink all morning. He sees a water pitcher on the counter, walks to a staff member, and signs WATER. She pours him a cup and he drinks it. Andre's sign is best classified as a:","options":["Tact, because the pitcher was in view","Motor imitation, because the response was a sign","Mand, because deprivation evoked it and it produced water","Intraverbal, because it was directed to a staff member"],"answer":2,"why":["Wrong. The pitcher may play a part, but the deprivation-based MO controls the response and the consequence is the specific item (water), not praise. That defines a mand.","Wrong. Motor imitation needs a signed model to copy, and no one signed WATER first. The form of a response (spoken or signed) never decides the operant.","Correct. A motivating operation (water deprivation) evoked the sign, and the consequence was the specific reinforcer that MO made valuable.","Wrong. An intraverbal is evoked by someone else's verbal stimulus. No one said or signed anything to Andre before he signed."],"cite":{"ch":18,"from":416,"to":418},"level":"apply","set":"B"},{"id":"B.14-2","task":"B.14","stem":"A teacher holds up an index card printed with the word SHIP. The student looks at it and says \"ship,\" and the teacher says, \"Nice reading!\" The student's response is:","options":["Textual, because a printed stimulus evoked a spoken response with point-to-point correspondence","Echoic, because the response matched the stimulus","Tact, because the student was looking at an object","Taking dictation, because the student converted the word into another mode"],"answer":0,"why":["Correct. Printed letters evoked matching speech sounds. The parts correspond across modes (visual to vocal) without physical resemblance, which defines textual behavior.","Wrong. An echoic needs formal similarity: a heard stimulus and a spoken response in the same sense mode. Here the stimulus was printed, so the modes differ.","Wrong. A printed word is a verbal stimulus, the product of someone's verbal behavior, not a nonverbal object. Tacts are evoked by nonverbal stimuli.","Wrong. Taking dictation runs the other way: hearing spoken words and writing or spelling them."],"cite":{"ch":18,"from":416,"to":416},"level":"apply","set":"B"},{"id":"B.14-3","task":"B.14","stem":"During circle time, with no pictures or objects present, a teacher asks, \"What do you use to brush your teeth?\" Leo answers, \"A toothbrush!\" and the teacher says, \"You got it!\" Leo's answer is best classified as:","options":["Tact, because a toothbrush is a concrete object","Echoic, because he responded to the teacher's spoken words","Mand, because he wanted the teacher's praise","Intraverbal, because a verbal stimulus evoked a response that does not match it point to point"],"answer":3,"why":["Wrong. A tact is evoked by a nonverbal stimulus the speaker contacts. No toothbrush or picture was there; only the question evoked the answer.","Wrong. An echoic repeats what was heard, with formal similarity. Leo said something different from what he heard.","Wrong. Praise is generalized conditioned reinforcement, not specific reinforcement tied to an MO. The form of his answer was controlled by the question, not by a want.","Correct. The question was a verbal stimulus, and his answer has no point-to-point correspondence with it. Answering questions is classic intraverbal behavior."],"cite":{"ch":18,"from":416,"to":416},"level":"apply","set":"B"},{"id":"B.14-4","task":"B.14","stem":"A response corresponds part by part to its verbal stimulus but is in a different sense mode and does not physically resemble it, as when a learner hears a word and types it. Which category does it belong to?","options":["Duplic","Codic","Intraverbal","Listener discrimination"],"answer":1,"why":["Wrong. Duplic relations (echoic, motor imitation, copying text) need formal similarity: same sense mode and physical resemblance. Hearing and typing are different modes.","Correct. Codic relations (textual and taking dictation) have point-to-point correspondence without formal similarity. Hearing a word and typing it is taking dictation.","Wrong. An intraverbal has no point-to-point correspondence with its verbal stimulus, but typing the exact word heard matches it part by part.","Wrong. A listener discrimination is a nonverbal response to a verbal stimulus, like handing over a pen when asked. Typing the heard word is itself verbal behavior."],"cite":{"ch":18,"from":416,"to":417},"level":"recall","set":"B"},{"id":"B.15-1","task":"B.15","stem":"A therapist teaches Nora to select a picture of a cat when she hears \"cat\" (A to B), and to select the printed word CAT when shown the cat picture (B to C). Without further teaching or reinforcement, Nora selects the cat picture when shown the printed word CAT. This untrained performance demonstrates:","options":["Transitivity","Reflexivity","Stimulus generalization","Symmetry"],"answer":3,"why":["Wrong. Transitivity relates two stimuli never trained together through a shared one (here, hearing \"cat\" and selecting CAT). The picture and the printed word were trained together.","Wrong. Reflexivity is matching a stimulus to itself, such as picking the identical picture.","Wrong. Generalization depends on physical similarity to a trained stimulus. A printed word and a picture look nothing alike; this relation came from the training arrangement.","Correct. She reversed a trained relation: taught picture to printed word, she now shows printed word to picture, with no reinforcement. That is symmetry."],"cite":{"ch":19,"from":455,"to":455},"level":"apply","set":"B"},{"id":"B.15-2","task":"B.15","stem":"Using a matrix, an instructor teaches a learner to tact \"blue truck\" and \"yellow plane.\" Later, shown a yellow truck and a blue plane for the first time, the learner says \"yellow truck\" and \"blue plane\" without any teaching. This is an example of:","options":["Generic tact extension","Recombinative generalization","Transfer of function","Symmetry"],"answer":1,"why":["Wrong. In a generic tact extension the same tact is emitted to a new example that shares all the defining features (calling an unfamiliar truck \"truck\"). Here the learner produced new combinations of words.","Correct. The learner responded correctly to new combinations of components that had appeared in other trained combinations. Matrix training is a common way to produce this.","Wrong. Transfer of function is a new function taught for one member of an equivalence class showing up in the other members. No class or new function was involved.","Wrong. Symmetry is reversing a trained relation (A to B, then B to A). The learner did not reverse anything; he recombined known parts."],"cite":{"ch":18,"from":424,"to":424},"level":"apply","set":"B"},{"id":"B.15-3","task":"B.15","stem":"A learner has formed equivalence classes in which the spoken word \"hot,\" the printed word HOT, and a red flame symbol are interchangeable. Staff then teach her to pull her hand back when she sees the flame symbol on a stove. Without further training, she pulls her hand back from an oven door labeled HOT. This illustrates:","options":["Class expansion","Stimulus generalization","Transfer of function","Symmetry"],"answer":2,"why":["Wrong. Class expansion adds a new member to a class by teaching a new conditional discrimination. No member was added; a new function was taught for an existing member.","Wrong. Generalization rests on physical similarity. A printed word and a flame symbol look nothing alike; the response spread because they belong to the same equivalence class.","Correct. A new function (pulling the hand back) taught for one class member showed up for another member with no direct training.","Wrong. Symmetry is reversing a trained sample-comparison relation on a matching probe. Here a new behavioral function spread across the class."],"cite":{"ch":19,"from":462,"to":463},"level":"apply","set":"B"},{"id":"B.15-4","task":"B.15","stem":"A child learns that Tom is older than Lily and that Lily is older than Ben. Without being told, she says, \"Ben is younger than Tom.\" In relational frame theory terms, this derived relation is best called:","options":["Combinatorial entailment","Mutual entailment","Transitivity","Transfer of function"],"answer":0,"why":["Correct. Ben and Tom were never related directly; she derived their relation through a shared stimulus (Lily). A relation derived through a common link is combinatorial entailment.","Wrong. Mutual entailment is the reverse of one directly learned relation (Tom is older than Lily, so Lily is younger than Tom). Ben and Tom were never related in either direction.","Wrong. Transitivity is the special case limited to \"same as\" relations. These are comparison (older and younger) relations, so the broader term applies.","Wrong. Transfer of function is a behavioral function spreading across equivalent stimuli. Here the child derived a new relation, not a new function."],"cite":{"ch":20,"from":500,"to":501},"level":"apply","set":"B"},{"id":"ch2-1","stem":"A teacher drafts four goals for a second grader. Which one describes behavior as the chapter defines it?","options":["Raises his hand and waits to be called on during reading group","Stays quiet during independent seatwork","Receives a sticker after finishing a worksheet","Is less anxious during transitions"],"answer":0,"why":["Correct. Raising a hand is movement by the student that interacts with the classroom: the setting prompts it and it changes what happens next.","Staying quiet is a state that a dead man could also 'do', so it fails the dead man test. Name what he does instead, such as writing answers.","Receiving a sticker is a change in the environment that happens to him, not a movement he makes.","Being anxious names a state of the student with no movement or interaction specified. The chapter warns that such states get confused with behavior."],"cite":{"ch":2,"from":26,"to":26},"level":"apply","set":"ch2"},{"id":"ch2-2","stem":"When 4-year-old Mia wants her dad's attention, she sometimes tugs his sleeve, sometimes says 'Daddy, look!', and sometimes taps his knee. Each one reliably gets him to look at her. A behavior analyst who groups these three actions together because they have the same effect is identifying a","options":["repertoire","response topography","response class","stimulus class"],"answer":2,"why":["A repertoire is everything a person can do, or the skills for a setting or task. It is broader than a set of actions that share one effect.","Topography is the physical form of a response. These three actions look different; what unites them is their effect.","Correct. A response class is a set of responses, often different in form, that all get the same result (here, Dad's attention).","A stimulus class groups stimuli, which are environmental events, not the child's responses."],"cite":{"ch":2,"from":27,"to":27},"level":"apply","set":"ch2"},{"id":"ch2-3","stem":"At a toddler's checkups, a nurse always wipes his arm with a cold alcohol swab right before giving a shot. The shot makes his heart race and his muscles tense. After a few visits, his heart races and he tenses as soon as the cold swab touches his arm, before any shot. The cold swab is now functioning as a(n)","options":["unconditioned stimulus","neutral stimulus","discriminative stimulus","conditioned stimulus"],"answer":3,"why":["The shot is the unconditioned stimulus: it produced the reaction with no learning. The swab gained its effect only through pairing.","The swab was neutral before the pairings. Now that it elicits the reaction by itself, it is no longer neutral.","A discriminative stimulus signals that an operant response is likely to be reinforced. It does not elicit a reflexive reaction like a racing heart.","Correct. Through repeated stimulus-stimulus pairing with the shot, a once-neutral stimulus now elicits the response on its own, which makes it a conditioned stimulus."],"cite":{"ch":2,"from":30,"to":31},"level":"apply","set":"ch2"},{"id":"ch2-4","stem":"A behavior analyst sees a 3-year-old cry right after he scrapes his knee on the sidewalk. Later she sees him cry when his sister grabs his truck, after whi
