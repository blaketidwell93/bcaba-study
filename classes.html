<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow study column (phone first), sticky header with tab strip; data-sheet details (graph grid, mono codes, highlighter page chips). */
:root {
  --paper: #f5f7f6;
  --sheet: #ffffff;
  --ink: #15232d;
  --muted: #5a6a72;
  --rule: #d9e1df;
  --grid: #e8eeec;
  --accent: #0b6e69;
  --accent-soft: #e2f1ef;
  --on-accent: #ffffff;
  --hi: #ffe45c;
  --hi-ink: #15232d;
  --good: #1d7a3a;
  --good-soft: #e3f3e7;
  --warn: #a56300;
  --warn-soft: #fbf0dc;
  --bad: #b3261e;
  --bad-soft: #fbe6e4;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1518; --sheet: #142026; --ink: #e5ecea; --muted: #94a5aa; --rule: #26343b; --grid: #1b282e;
    --accent: #52c3ba; --accent-soft: #163331; --on-accent: #0b1a1a; --hi: #e9d54f; --hi-ink: #15232d;
    --good: #63c983; --good-soft: #17301f; --warn: #e5a948; --warn-soft: #33270f; --bad: #f2776d; --bad-soft: #3a1a18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1518; --sheet: #142026; --ink: #e5ecea; --muted: #94a5aa; --rule: #26343b; --grid: #1b282e;
  --accent: #52c3ba; --accent-soft: #163331; --on-accent: #0b1a1a; --hi: #e9d54f; --hi-ink: #15232d;
  --good: #63c983; --good-soft: #17301f; --warn: #e5a948; --warn-soft: #33270f; --bad: #f2776d; --bad-soft: #3a1a18;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--font-body); font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; font-weight: 650; }
h1 { font-size: 1.6rem; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.eyebrow { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.top-inner { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 0; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 1.2rem; }
.brand h1 span { color: var(--accent); }
.savebadge { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 6px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px 9px; color: var(--muted); font-weight: 700; font-size: 0.95rem; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
@media (max-width: 560px) {
  .tabs { justify-content: space-between; gap: 0; }
  .tab { padding: 8px 6px 9px; font-size: 0.86rem; }
}

main { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 64px; display: grid; gap: 20px; }
main > * { min-width: 0; }

/* blocks */
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.stack { display: grid; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.lede { font-size: 1.05rem; max-width: 62ch; }
.prose { display: grid; gap: 10px; max-width: 65ch; }
.callout { border-left: 4px solid var(--warn); background: var(--warn-soft); padding: 10px 12px; border-radius: 0 var(--r) var(--r) 0; }
.callout.good { border-color: var(--good); background: var(--good-soft); }
.callout.info { border-color: var(--accent); background: var(--accent-soft); }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 9px 16px; font-weight: 700; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.quiet { border-color: var(--rule); background: var(--sheet); color: var(--ink); }
.btn:disabled { opacity: 0.5; cursor: default; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; text-align: left; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 1px 7px; font-family: var(--font-mono); font-size: 0.78rem; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); white-space: nowrap; }
.chip.page { background: var(--hi); color: var(--hi-ink); border-color: transparent; }
.chip.code { color: var(--accent); border-color: var(--accent); }
.chip.ethics { border-style: dashed; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cov { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); }
.cov::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.cov.strong::before { background: var(--good); }
.cov.partial::before { background: var(--warn); }
.cov.thin::before, .cov.none::before { background: var(--bad); }
.badge { font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }

/* domain table */
.domains { display: grid; gap: 0; }
.dom { display: grid; grid-template-columns: 2.2rem 1fr; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--rule); align-items: start; }
.dom:first-child { border-top: 0; }
.dom .letter { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; color: var(--accent); line-height: 1; padding-top: 2px; }
.dom .body { display: grid; gap: 6px; min-width: 0; }
.bars { display: grid; grid-template-columns: 4.6rem 1fr 3.2rem; gap: 4px 8px; align-items: center; font-size: 0.78rem; }
.bar { height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar.weight > i { background: var(--muted); }
.bars .num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* outline */
.task { display: grid; grid-template-columns: 3.4rem 1fr; gap: 2px 10px; padding: 10px 0; border-top: 1px solid var(--rule); text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.task .code { font-family: var(--font-mono); color: var(--accent); font-weight: 600; padding-top: 1px; }
.task .lbl { font-weight: 700; }
.task .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
details.domain > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 2.2rem 1fr auto; gap: 12px; align-items: center; }
details.domain > summary::-webkit-details-marker { display: none; }
details.domain > summary .letter { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; color: var(--accent); }
details.domain > summary::after { content: "+"; font-family: var(--font-mono); color: var(--muted); font-size: 1.2rem; }
details.domain[open] > summary::after { content: "–"; }
.covstrip { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; margin-top: 4px; }
.covstrip i { display: block; height: 100%; }
.covstrip .strong { background: var(--good); } .covstrip .partial { background: var(--warn); } .covstrip .thin, .covstrip .none { background: var(--bad); }

/* refs */
.refs { display: grid; gap: 8px; }
.ref { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: baseline; }
.ref .where { grid-column: 2; }
@media (max-width: 560px) {
  .ref { grid-template-columns: 1fr; }
  .ref > .chip { justify-self: start; }
  .ref .where { grid-column: 1; }
}
.traps { display: grid; gap: 8px; }
.trap { display: grid; grid-template-columns: 1fr; gap: 4px; border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 12px; }
.trap b { color: var(--bad); font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; }
.trap b.fix { color: var(--good); }
ul.tight { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }

/* quiz */
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.progress { height: 4px; background: var(--grid); border-radius: 2px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); }
.stem { font-size: 1.08rem; max-width: 65ch; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 1.8rem 1fr; gap: 10px; text-align: left; border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r); padding: 11px 12px; align-items: start; }
.opt .k { font-family: var(--font-mono); font-weight: 700; width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 1px solid var(--rule); display: grid; place-items: center; font-size: 0.85rem; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .k { background: var(--good); color: var(--sheet); border-color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: var(--sheet); border-color: var(--bad); }
.opt .why { grid-column: 2; font-size: 0.9rem; color: var(--muted); }
.verdict { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; }
.verdict.ok { color: var(--good); } .verdict.no { color: var(--bad); }
.score { font-family: var(--font-display); font-size: 2.6rem; font-weight: 700; line-height: 1; }

/* flashcards */
.flash { min-height: 13rem; border: 1px solid var(--rule); border-radius: 14px; background: var(--sheet); display: grid; place-items: center; text-align: center; padding: 24px 18px; cursor: pointer; background-image: linear-gradient(var(--grid) 1px, transparent 1px); background-size: 100% 1.9rem; background-position: 0 3.2rem; }
.flash .front { font-family: var(--font-display); font-size: 1.4rem; font-weight: 650; }
.flash .back { font-size: 1.05rem; max-width: 44ch; }
.boxes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.boxes div { text-align: center; border: 1px solid var(--rule); border-radius: 8px; padding: 6px 2px; font-size: 0.75rem; }
.boxes b { display: block; font-family: var(--font-mono); font-size: 1.05rem; }

/* graph */
.graph { width: 100%; height: auto; display: block; }
.graph text { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
.graph .axis { stroke: var(--ink); stroke-width: 1; fill: none; }
.graph .gridl { stroke: var(--grid); stroke-width: 1; }
.graph .path { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.graph .dot { fill: var(--ink); }
.graph .crit { stroke: var(--accent); stroke-dasharray: 4 3; stroke-width: 1.2; }
.graph .critlbl { fill: var(--accent); }
.graph.ghost .path, .graph.ghost .dot { opacity: 0.28; }

/* find */
.search { width: 100%; border: 2px solid var(--ink); border-radius: var(--r); padding: 12px 14px; background: var(--sheet); font-size: 1.05rem; }
.hit { display: grid; gap: 3px; padding: 10px 0; border-top: 1px solid var(--rule); }
.hit:first-child { border-top: 0; }
.hit .t { font-weight: 700; }
mark { background: var(--hi); color: var(--hi-ink); border-radius: 2px; padding: 0 1px; }

/* ask */
.drop { border: 2px dashed var(--rule); border-radius: var(--r); padding: 18px; display: grid; gap: 10px; justify-items: start; }
.drop img { max-height: 220px; border-radius: 8px; border: 1px solid var(--rule); }
textarea { width: 100%; min-height: 7rem; border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 12px; background: var(--sheet); resize: vertical; }
.answer-letter { font-family: var(--font-display); font-size: 3rem; font-weight: 700; line-height: 1; color: var(--accent); }
.pill { font-family: var(--font-mono); font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.pill.high { color: var(--good); } .pill.medium { color: var(--warn); } .pill.low { color: var(--bad); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 3px; gap: 3px; background: var(--sheet); }
.seg button { border: 0; background: none; border-radius: 999px; padding: 6px 12px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

input[type="date"], select { border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; background: var(--sheet); }
.kpi { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; line-height: 1; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.two > * { min-width: 0; }
.crumbs { font-size: 0.85rem; }
.hr { border: 0; border-top: 1px solid var(--rule); margin: 0; }
.tablewrap { overflow-x: auto; }
table.blue { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
table.blue th, table.blue td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.blue td.num, table.blue th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) {
  .flash { transition: transform 0.18s ease; }
  .flash:active { transform: scale(0.99); }
}
