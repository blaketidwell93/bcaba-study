ing, or pointing to pictures or codes also counts.","page":413,"ch":18},{"term":"split-middle line of progress","def":"A trend line drawn through the middle session and median value of each half of the data, then shifted up or down until points split evenly above and below.","page":149,"ch":6},{"term":"spontaneous recovery","def":"The 'it's back!' moment in extinction: a behavior that had dropped to its pre-reinforcement level or stopped suddenly returns, briefly, though still unreinforced. Don't read it as extinction failing.","page":587,"ch":24},{"term":"stable baseline","def":"Baseline data that are flat and tight: no rising or falling trend, and the points sit close together. A solid benchmark for judging treatment effects.","page":163,"ch":7},{"term":"Standard Celeration Chart","def":"A semilogarithmic (multiply/divide) chart with six ×10 cycles, covering rates from 1 per day to 1000 per minute; it charts celeration, the factor by which rate changes over time.","page":138,"ch":6},{"term":"steady state responding","def":"Responding that holds roughly the same level session after session, with only small ups and downs in what's measured (rate, duration, etc.).","page":162,"ch":7},{"term":"steady state strategy","def":"Don't switch phases early: run the current condition repeatedly, keep outside influences in check, and wait for responding to level off before introducing the next condition.","page":162,"ch":7},{"term":"stimulus","def":"Anything the senses can register: a change in energy (light, sound, touch, smell, heat) that acts on the body's receptor cells, e.g., a phone buzzing.","page":453,"ch":19},{"term":"stimulus blocking","def":"A competing stimulus keeps an established SD from evoking behavior (also called masking). Reduce it by rearranging the setting, making cues stand out, and reinforcing responses to the right SD.","page":405,"ch":17},{"term":"stimulus class","def":"Stimuli grouped by a shared feature: form (all round objects), timing (all things that come before a behavior), or function (everything that signals 'quiet time').","page":498,"ch":20},{"term":"stimulus control","def":"An antecedent stimulus has stimulus control when behavior differs with it versus without it, in frequency, latency, duration, or amplitude (e.g., chatter stops when the teacher walks in).","page":413,"ch":18},{"term":"stimulus delta (SΔ)","def":"A cue meaning 'little or no payoff here': in its presence the behavior went unreinforced, or got weaker reinforcement, in the past (e.g., Dad, who never buys candy when asked).","page":396,"ch":17},{"term":"stimulus discrimination","def":"Responding differently to different stimuli: a behavior occurs more often when the SD (which signals reinforcement) is present than when it's absent (the SΔ condition).","page":396,"ch":17},{"term":"stimulus discrimination training","def":"One behavior, two conditions: reinforce it when the SD is present, not when the SΔ is present (e.g., saying 'red' earns praise when shown red, nothing when shown blue).","page":399,"ch":17},{"term":"stimulus equivalence","def":"Train A→B and B→C, and the learner responds correctly to untaught relations (B→A, A→C, C→A). Shown by passing reflexivity, symmetry, and transitivity probes without reinforcement. Also called equivalence-class formation.","page":453,"ch":19},{"term":"stimulus fading","def":"Transfer stimulus control by exaggerating a feature of the correct stimulus (e.g., a bigger, bolder letter), then shrinking the exaggeration bit by bit until the plain stimulus alone controls responding.","page":407,"ch":17},{"term":"stimulus generalization","def":"When a behavior that was reinforced with one stimulus present also occurs with other stimuli that look, sound, or feel similar.","page":396,"ch":17},{"term":"stimulus generalization gradient","def":"A graph showing how often a trained behavior occurs with stimuli that differ from the training stimulus. Flat = broad generalization; steep drop = strong discrimination.","page":396,"ch":17},{"term":"stimulus preference assessment","def":"Methods (e.g., offering pairs of items) for finding what a person likes, ranking items high to low, noting when those likes hold, and predicting which items might work as reinforcers.","page":268,"ch":11},{"term":"stimulus prompts","def":"Prompts that alter the task stimuli themselves (e.g., outlining the correct card in green, or placing it closest) to cue the right answer alongside the SD. Contrast: response prompts.","page":403,"ch":17},{"term":"stimulus-control topographies","def":"Two ways a learner can solve a match-to-sample trial with two comparisons: picking the correct comparison (select, Type S) or rejecting the incorrect one (reject, Type R).","page":468,"ch":19},{"term":"stimulus-stimulus pairing","def":"Presenting two stimuli together over and over; often one ends up acquiring the other's function (e.g., say 'nice!' each time you hand over a cracker, and 'nice!' becomes a reinforcer).","page":31,"ch":2},{"term":"successive approximations","def":"The in-between response classes that differential reinforcement produces during shaping, each nearer the goal (terminal) behavior than the last (e.g., a mumble, then 'wa,' then 'water').","page":541,"ch":22},{"term":"surrogate conditioned motivating operation (CMO-S)","def":"A conditioned MO created by pairing: a stimulus that has occurred along with an existing MO takes on that MO's value-altering and behavior-altering effects (an MO 'stand-in').","page":384,"ch":16},{"term":"symmetry","def":"The learner reverses a trained match with no extra teaching: after learning 'given A, pick B,' they can also do 'given B, pick A.'","page":455,"ch":19},{"term":"systematic desensitization","def":"A behavior therapy for fears and phobias: the client learns to stay relaxed while picturing feared situations, moving from least to most frightening, so relaxation replaces anxiety.","page":704,"ch":29},{"term":"systematic replication","def":"Re-running a study on purpose with something different (new participants, setting, or behavior). If the effect shows up again, that supports both its reliability and its generality (external validity).","page":239,"ch":10},{"term":"tact","def":"Naming or describing what you sense: a verbal operant evoked by a nonverbal stimulus and maintained by generalized conditioned reinforcement (e.g., seeing a plane and saying 'airplane!').","page":415,"ch":18},{"term":"tact extension","def":"A learned tact spreading to new stimuli via stimulus generalization (e.g., 'cup' said to an unfamiliar mug). Skinner's four types, ranked by shared defining features: generic, metaphorical, metonymical, solecistic.","page":422,"ch":18},{"term":"taking dictation","def":"Writing what you hear, as on a spelling test: a spoken word evokes a written, typed, or fingerspelled version. Point-to-point correspondence, no formal similarity; maintained by generalized reinforcement.","page":415,"ch":18},{"term":"tandem schedule (tand)","def":"Like a chained schedule (complete component schedules in order to earn reinforcement), but, as in a mixed schedule, no distinct stimulus signals which component is in effect.","page":303,"ch":13},{"term":"target behavior","def":"The specific behavior (response class) a program sets out to change, e.g., hitting peers; you can define it by what it does (function) or by what it looks like (topography).","page":49,"ch":3},{"term":"task analysis","def":"Splitting a complicated skill into small steps you can teach (e.g., handwashing: turn on water, wet hands, add soap…). The term also means the finished step list.","page":559,"ch":23},{"term":"teach loosely","def":"Randomly vary irrelevant details (room, materials, wording, teacher) within and between sessions, so no stray cue takes over and the skill holds up in new settings.","page":724,"ch":30},{"term":"teach enough examples","def":"Teach a sample of the possible stimulus and response variations, then probe untaught ones; keep adding examples until the learner handles new ones correctly.","page":724,"ch":30},{"term":"temporal extent","def":"Each response lasts some length of time, start to finish, so we can measure its duration. One of three dimensional quantities that every behavioral measure is built from.","page":76,"ch":4},{"term":"temporal locus","def":"Each response happens at a specific moment relative to other events, so 'when' can be measured: latency (cue to response) and interresponse time (between responses). One of three dimensional quantities.","page":76,"ch":4},{"term":"temporal relation","def":"Responding to how two stimuli are arranged in time relative to each other, e.g., choosing which of two sounds came first.","page":36,"ch":2},{"term":"terminal behavior","def":"The final goal behavior that a shaping program is designed to produce.","page":541,"ch":22},{"term":"terminate specific reinforcer contact","def":"A form of nonexclusion time-out in which the problem behavior instantly cuts off one ongoing activity or sensory reinforcer (e.g., a video pauses whenever a child kicks the seat).","page":354,"ch":15},{"term":"textual","def":"Reading aloud: printed words evoke saying them. Point-to-point correspondence, no formal similarity (print vs. sound); maintained by generalized reinforcement. Doesn't by itself show the reader understands.","page":415,"ch":18},{"term":"three-term contingency","def":"The core ABC unit behavior analysts use for operant behavior: antecedent, behavior, consequence, linked by timing and possibly dependency (e.g., 'Line up' → child lines up → sticker).","page":26,"ch":2},{"term":"time delay","def":"Fading a prompt by first presenting it together with the natural stimulus, then adding a wait before the prompt so the learner can respond first. An errorless-learning method.","page":564,"ch":23},{"term":"time sampling","def":"A family of methods that record whether a behavior is happening during set time intervals rather than counting every instance; best for frequent or ongoing behaviors.","page":83,"ch":4},{"term":"time-out from positive reinforcement","def":"Negative punishment: right after the behavior, the person is cut off from positive reinforcement, or from the chance to earn it, for a set time (e.g., two minutes benched).","page":353,"ch":15},{"term":"token","def":"A point, sticker, or chip earned for target behavior and later cashed in for backup reinforcers. Since it buys many things, it acts as a generalized conditioned reinforcer.","page":657,"ch":28},{"term":"token economy","def":"A system with three parts: a list of target behaviors, tokens earned for doing them, and a menu of backup reinforcers (items, activities, privileges) tokens can buy.","page":657,"ch":28},{"term":"topography","def":"What a behavior looks like: its physical form or shape (e.g., which hand is used, how high the arm is raised).","page":82,"ch":4},{"term":"topography-based definition","def":"Defining a target response class by what the behavior looks like (its form), rather than by what it accomplishes (its function).","page":67,"ch":3},{"term":"topography-based verbal behavior","def":"Verbal behavior where the shape of the response itself carries the message, since each word looks or sounds different: speaking, signing, writing, fingerspelling. Contrast: selection-based (pointing to pictures).","page":414,"ch":18},{"term":"total count IOA","def":"Simplest IOA for event recording: smaller observer total ÷ larger observer total × 100, comparing each observer's count for the whole session (e.g., 9 and 10 → 90%).","page":112,"ch":5},{"term":"total duration IOA","def":"IOA for total duration data: the shorter of the two observers' recorded durations ÷ the longer × 100 (e.g., 45 min vs. 50 min = 90%).","page":114,"ch":5},{"term":"total-task chaining","def":"Teaching all steps of a behavior chain every session, rather than one step at a time; Cooper treats it as a variation of forward chaining.","page":563,"ch":23},{"term":"training structure","def":"How trained relations are linked when teaching several conditional discriminations (sample → comparison): one-to-many or sample-as-node (A→B, A→C), many-to-one or comparison-as-node (B→A, C→A), or linear series (A→B, B→C).","page":467,"ch":19},{"term":"transcription","def":"Writing down speech: hearing words evokes writing, typing, or fingerspelling them (e.g., jotting a phone number someone reads out). Point-to-point correspondence, no formal similarity. Essentially the same as taking dictation.","page":null,"ch":null},{"term":"transfer of function","def":"Teach one member of an existing equivalence class a new function and the others acquire it untaught (e.g., make one picture a reinforcer; its matched word then reinforces too).","page":458,"ch":19},{"term":"transformation of function","def":"When a stimulus's behavioral function changes in a predictable way based on the functions of other stimuli in its class, rather than just copying them as in transfer of function.","page":501,"ch":20},{"term":"transitive conditioned motivating operation (CMO-T)","def":"A learned motivating operation: one stimulus raises (or lowers) another stimulus's value as a reinforcer and evokes (or abates) behavior that gets it (e.g., locked door → key valuable).","page":390,"ch":16},{"term":"transitivity","def":"Combining two trained relations into a new, untaught one: after learning A = B and B = C, the learner matches A to C without ever being taught to.","page":456,"ch":19},{"term":"treatment drift","def":"As a study goes on, the intervention gets delivered differently than it was at the start (e.g., staff gradually drop the praise step). An unwanted threat to treatment integrity.","page":227,"ch":10},{"term":"treatment integrity","def":"Did the treatment (independent variable) happen as designed? High integrity means every planned step was done as written and nothing unplanned, like bonus praise, crept in alongside it.","page":226,"ch":10},{"term":"treatment package","def":"An intervention made of several components used together (e.g., a visual schedule, prompting, and a token board).","page":221,"ch":10},{"term":"trend","def":"Which way the data path heads: direction (rising, falling, or zero), degree (gradual or steep), and how tightly points hug it. Helps predict future data if conditions hold.","page":125,"ch":6},{"term":"trial-based functional analysis","def":"A functional analysis woven into the school day: brief trials mixed into class activities, each with a 1-minute test (EO plus contingency) and a 1-minute control (continuous reinforcer access).","page":634,"ch":27},{"term":"trial-by-trial IOA","def":"IOA for discrete-trial data: agreed trials ÷ total trials × 100, comparing each observer's 0-or-1 score trial by trial. Stricter and more meaningful than total count IOA.","page":113,"ch":5},{"term":"true value","def":"The 'answer key': a value accepted as the real amount of a behavior because extraordinary care ruled out all possible error. Observed values are checked against it for accuracy.","page":102,"ch":5},{"term":"trials-to-criterion","def":"Counting the tries a learner needs to reach a preset accuracy or proficiency goal (e.g., 12 trials to spell the list perfectly). A special kind of event recording.","page":78,"ch":4},{"term":"Type I error","def":"A false positive: concluding the independent variable (treatment) changed behavior when it really didn't (e.g., crediting a token system for gains actually caused by a new medication).","page":243,"ch":10},{"term":"Type II error","def":"A false negative: concluding the independent variable (treatment) made no difference when it actually did (e.g., dropping an effective intervention because highly variable data hid its effect).","page":243,"ch":10},{"term":"unchaining","def":"In a two-step chain, the second response earns reinforcement whether or not the SD produced by the first step is present, so the chain can weaken.","page":570,"ch":23},{"term":"unconditioned motivating operation (UMO)","def":"A motivating operation (MO) that changes a reinforcer's value without any learning history; it comes built in (e.g., being without water makes water more reinforcing for anyone).","page":379,"ch":16},{"term":"unconditioned negative reinforcer","def":"A stimulus whose removal reinforces behavior because of the species' evolutionary history, with no learning required (e.g., a blaring alarm, scorching pavement, a pinching shoe).","page":291,"ch":12},{"term":"unconditioned punisher","def":"A stimulus change that makes any behavior it immediately follows occur less often, no learning needed; evolution built it in (e.g., a burn). Also called primary or unlearned punisher.","page":327,"ch":14},{"term":"unconditioned reflex","def":"An inborn stimulus-response relation: an antecedent stimulus elicits a response with no learning (e.g., dust in the eye → blinking); all healthy members of a species share these.","page":28,"ch":2},{"term":"unconditioned reinforcer","def":"A stimulus change that makes any behavior it immediately follows occur more often, no learning needed; evolution built it in (e.g., food, warmth). Also called primary or unlearned reinforcer.","page":263,"ch":11},{"term":"unconditioned stimulus (US)","def":"The stimulus half of an unconditioned reflex: an environmental change that triggers a respondent behavior with no learning needed (e.g., a sudden loud bang makes you startle).","page":30,"ch":2},{"term":"unpairing","def":"Undoing a pairing's effect in one of two ways: presenting the conditioned stimulus by itself, or delivering the original effective stimulus whether or not the conditioned stimulus is present.","page":385,"ch":16},{"term":"unscored-interval IOA","def":"Interobserver agreement (IOA) counting only intervals where at least one observer marked the behavior absent: agreed-nonoccurrence intervals ÷ those intervals × 100. Recommended for high-rate behavior (skips likely chance agreements).","page":115,"ch":5},{"term":"validity (of measurement)","def":"Are you measuring the right thing? Valid data directly reflect the behavior that matters, for the reason you're measuring it (e.g., words read correctly per minute to judge reading fluency).","page":102,"ch":5},{"term":"value-altering effect (of a motivating operation)","def":"An MO's effect on how reinforcing something is: an increase makes it an establishing operation (EO); a decrease makes it an abolishing operation (AO) (e.g., thirst vs. just having drunk).","page":373,"ch":16},{"term":"variability","def":"How much the data bounce around: how often, and by how much, repeated measures come out different (e.g., 2, 15, 4, 12 problems solved = high variability).","page":125,"ch":6},{"term":"variable baseline","def":"Baseline data that zigzag widely with no clear upward or downward direction, making it hard to predict the next point (e.g., 3, 11, 5, 14, 2 tantrums).","page":164,"ch":7},{"term":"variable interval (VI)","def":"A schedule reinforcing the first response after a varying, unpredictable amount of time; named by the average interval (on VI 5-min, the wait averages 5 minutes but changes each time).","page":601,"ch":25},{"term":"variable ratio (VR)","def":"A schedule reinforcing after a varying number of responses; named by the average (on VR 8, reinforcement comes after 8 responses on average, sometimes fewer, sometimes more).","page":303,"ch":13},{"term":"variable-interval DRO (VI-DRO)","def":"DRO with unpredictable interval lengths: when each interval ends, reinforcement comes only if the problem behavior never happened during it (e.g., intervals of 3, 7, then 5 min).","page":601,"ch":25},{"term":"variable-momentary DRO (VM-DRO)","def":"DRO that checks only at unpredictable moments: if the problem behavior isn't happening right at that instant, reinforcement is delivered, even if it happened earlier. Contrast VI-DRO (whole interval).","page":601,"ch":25},{"term":"variable-time schedule (VT)","def":"Noncontingent delivery of a stimulus (e.g., attention) at times that vary randomly around an average, no matter what the person is doing (VT 2-min: about every 2 minutes on average).","page":177,"ch":8},{"term":"verbal behavior","def":"Behavior reinforced by way of a listener, not by acting directly on the world. Vocal ('juice, please') or not (handing over a juice picture). Covers language, thinking, grammar, and understanding.","page":413,"ch":18},{"term":"verbal conditional discrimination (VCD)","def":"A form of convergent multiple control: one word in a verbal antecedent changes what another word in it evokes (e.g., 'name an animal that flies' vs. 'that swims').","page":426,"ch":18},{"term":"verbal episode","def":"A back-and-forth where a speaker emits verbal behavior in any form (speech, sign, pictures) and a listener attends, reinforces, and responds; roles usually switch during the exchange.","page":414,"ch":18},{"term":"verbal function-altering effect","def":"Words changing how SDs or MOs affect a listener now or later (e.g., hearing 'exit right after the gas station' makes the gas station evoke turning).","page":427,"ch":18},{"term":"verification","def":"One of baseline logic's three parts: showing that, without treatment, behavior would have stayed at baseline (e.g., withdraw treatment and behavior returns). Makes a confound a less likely explanation.","page":162,"ch":7},{"term":"video modeling","def":"Teaching by video: the learner watches someone else do the target skill, then copies it (e.g., a clip of a peer ordering at a café before a real outing).","page":533,"ch":21},{"term":"video self-modeling","def":"Video modeling where the star is the learner: they watch footage of themselves doing the skill well, then copy their own example (e.g., a clip of themselves calmly joining recess).","page":533,"ch":21},{"term":"visual analysis","def":"A systematic way to judge results by inspecting the graph rather than running statistics: compare level, trend, and variability within each phase and across phase changes.","page":125,"ch":6},{"term":"whole-interval recording","def":"Score an interval only if the behavior lasted the whole interval, start to end (intervals usually 5–15 s). A time-sampling method that tends to underestimate how much behavior occurred.","page":88,"ch":4},{"term":"withdrawal design","def":"Two meanings: (1) some authors' label for the A-B-A-B design; (2) a study that phases out a working treatment gradually or one part at a time so gains last.","page":172,"ch":8}],"ethics":{"1.01":"Being Truthful","1.02":"Conforming with Legal and Professional Requirements","1.03":"Accountability","1.04":"Practicing within a Defined Role","1.05":"Practicing within Scope of Competence","1.06":"Maintaining Competence","1.07":"Cultural Responsiveness and Diversity","1.08":"Nondiscrimination","1.09":"Nonharassment","1.10":"Awareness of Personal Biases and Challenges","1.11":"Multiple Relationships","1.12":"Giving and Receiving Gifts","1.13":"Coercive and Exploitative Relationships","1.14":"Romantic and Sexual Relationships","1.15":"Responding to Requests","1.16":"Self-Reporting Critical Information","2.01":"Providing Effective Treatment","2.02":"Timeliness","2.03":"Protecting Confidential Information","2.04":"Disclosing Confidential Information","2.05":"Documentation Protection and Retention","2.06":"Accuracy in Service Billing and Reporting","2.07":"Fees","2.08":"Communicating About Services","2.09":"Involving Clients and Stakeholders","2.10":"Collaborating with Colleagues","2.11":"Obtaining Informed Consent","2.12":"Considering Medical Needs","2.13":"Selecting, Designing, and Implementing Assessments","2.15":"Minimizing Risk of Behavior-Change Interventions","2.16":"Describing Behavior-Change Interventions Before Implementation","2.17":"Collecting and Using Data","2.18":"Continual Evaluation of the Behavior-Change Intervention","2.19":"Addressing Conditions Interfering with Service Delivery","3.01":"Responsibility to Clients (see 1.03, 2.01)","3.02":"Identifying Stakeholders","3.03":"Accepting Clients (see 1.05, 1.06)","3.04":"Service Agreement (see 1.04)","3.05":"Financial Agreements (see 1.04, 2.07)","3.06":"Consulting with Other Providers (see 1.05, 2.04, 2.10, 2.11, 2.12)","3.07":"Third-Party Contracts for Services (see 1.04, 1.11, 2.04, 2.07)","3.08":"Responsibility to the Client with Third-Party Contracts","3.09":"Communicating with Stakeholders About Third-Party","3.10":"Limitations of Confidentiality (see 1.02, 2.03, 2.04)","3.11":"Documenting Professional Activity (see 1.04, 2.03, 2.05, 2.06, 2.10)","3.12":"Advocating for Appropriate Services (1.04, 1.05, 2.01, 2.08)","3.13":"Referrals (see 1.05, 1.11, 2.01, 2.04, 2.10)","3.14":"Facilitating Continuity of Services (see 1.03, 2.02, 2.05, 2,08, 2.10)","3.15":"Appropriately Discontinuing Services (see 1.03, 2.02, 2.05. 2.10, 2.19)","3.16":"Appropriately Transitioning Services (see 1.03, 2.02, 2.05. 2.10)","4.01":"Compliance with Supervision Requirements (see 1.02)","4.02":"Supervisory Competence (see 1.05, 1.06)","4.03":"Supervisory Volume (see 1.02, 1.05, 2.01)","4.04":"Accountability in Supervision (see 1.03)","4.05":"Maintaining Supervision Documentation (1.01, 1.02, 1.04, 2.03, 2.05, 3.11)","4.06":"Providing Supervision and Training (see 1.02, 1.13 2.01)","4.07":"Incorporating and Addressing Diversity (see 1.05, 1.06, 1.07, 1.10)","4.08":"Performance Monitoring and Feedback (see 2.02, 2.05, 2.17, 2.18)","4.09":"Delegation of Tasks (see 1.03)","4.10":"Evaluating Effects of Supervision and Training (see 1.03, 2.17, 2.18)","4.11":"Facilitating Continuity of Supervision (see 1.03, 2.02, 3.14)","4.12":"Appropriately Terminating Supervision (see 1.03, 2.02, 3.15)","5.01":"Protecting the Rights of Clients, Stakeholders,","5.02":"Confidentiality in Public Statements (see 2.03, 2.04, 3.10)","5.03":"Public Statements by Behavior Analysts (see 1.01, 1.02)","5.04":"Public Statements by Others (see 1.03)","5.05":"Use of Intellectual Property (see 1.01, 1.02, 1.03)","5.06":"Advertising Nonbehavioral Services (see 1.01, 1.02, 2.01)","5.07":"Soliciting Testimonials from Current Clients","5.08":"Using Testimonials from Former Clients for Advertising (see 2.03, 2.04, 2.11, 3.01, 3.10)","5.09":"Using Testimonials for Nonadvertising Purposes (see 1.02, 2.03. 2.04, 2.11, 3.01, 3.10)","5.10":"Social Media Channels and Websites (see 1.02, 2.03, 2.04, 2.11, 3.01, 3.10)","5.11":"Using Digital Content in Public Statements (see 1.02, 1.03, 2.03, 2.04, 2.11, 3.01, 3.10)","6.01":"Conforming with Laws and Regulations in Research (see 1.02)","6.02":"Research Review (see 1.02, 1.04, 3.01)","6.03":"Research in Service Delivery (see 1.02, 1.04, 2.01, 3.01)","6.04":"Informed Consent in Research (see 1.04, 2.08, 2.11)","6.05":"Confidentiality in Research (see 2.03, 2.04, 2.05)","6.06":"Competence in Conducting Research (see 1.04, 1.05, 1.06, 3.01)","6.07":"Conflict of Interest in Research and Publication (see 1.01, 1.11, 1.13)","6.08":"Appropriate Credit (see 1.01, 1.11, 1.13)","6.09":"Plagiarism (see 1.01)","6.10":"Documentation and Data Retention in Research (see 2.03, 2.05, 3.11, 4.05)","6.11":"Accuracy and Use of Data (see 1.01, 2.17, 5.03)","2.14":"Selecting, Designing, and Implementing Behavior-Change Interventions"}};</script>
<script>
(function () {
  'use strict';
  var D = window.__DATA;
  var MODE = D.mode; // 'exam' | 'classes'
  var L = ['A', 'B', 'C', 'D'];
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var norm = function (s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); };
  var today = function () { var d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); };
  var shuffle = function (a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  var pct = function (n, d) { return d ? Math.round((100 * n) / d) : 0; };

  // ---------- indexes ----------
  var taskById = {}; D.tasks.forEach(function (t) { taskById[t.id] = t; });
  var domainById = {}; D.domains.forEach(function (d) { domainById[d.id] = d; });
  var chById = {}; D.chapters.forEach(function (c) { chById[c.ch] = c; });
  var qById = {}; D.questions.forEach(function (q) { qById[q.id] = q; });
  var glossCards = D.glossary.map(function (g) { return { id: 'g:' + norm(g.term).replace(/ /g, '-'), front: g.term, back: g.def, page: g.page, ch: g.ch, deck: 'glossary' }; });
  var cards = D.cards.concat(glossCards);
  var cardById = {}; cards.forEach(function (c) { cardById[c.id] = c; });
  var qsForTask = function (id) { return D.questions.filter(function (q) { return q.task === id; }); };
  var qsForDomain = function (d) { return D.questions.filter(function (q) { return q.task && q.task.charAt(0) === d; }); };
  var glossByNorm = {}; D.glossary.forEach(function (g) { glossByNorm[norm(g.term.replace(/\s*\(.*?\)\s*/g, ' '))] = g; glossByNorm[norm(g.term)] = g; });

  // ---------- page chips ----------
  function pages(from, to) { return from === to || !to ? 'p. ' + from : 'pp. ' + from + '–' + to; }
  function pageChip(ch, from, to) { return '<span class="chip page" title="Cooper, chapter ' + ch + '">Ch ' + ch + ' · ' + pages(from, to) + '</span>'; }
  function covLabel(c) { return { strong: 'Book covers it', partial: 'Book covers part', thin: 'Book barely covers', none: 'Not in the book' }[c] || c; }

  // ---------- progress store ----------
  var Store = {
    data: { v: 1, q: {}, c: {}, s: [], examDate: '' },
    where: 'device', ref: null, saving: false, dirty: false, timer: null,
    key: 'bcaba-progress-' + MODE,
    loadLocal: function () { try { var raw = localStorage.getItem(this.key); if (raw) this.data = Object.assign(this.data, JSON.parse(raw)); } catch (e) { } },
    saveLocal: function () { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { } },
    merge: function (remote) {
      var a = this.data, b = remote || {};
      var out = { v: 1, q: Object.assign({}, a.q, b.q), c: Object.assign({}, a.c), s: [], examDate: b.examDate || a.examDate || '' };
      Object.keys(b.c || {}).forEach(function (k) { var x = out.c[k], y = b.c[k]; if (!x || (y && (y[2] || 0) >= (x[2] || 0))) out.c[k] = y; });
      Object.keys(a.q || {}).forEach(function (k) { var x = a.q[k], y = (b.q || {})[k]; if (y && (x[3] || 0) > (y[3] || 0)) out.q[k] = x; });
      var seen = {}; (a.s || []).concat(b.s || []).forEach(function (s) { if (!seen[s.t]) { seen[s.t] = 1; out.s.push(s); } });
      out.s.sort(function (x, y) { return x.t - y.t; }); out.s = out.s.slice(-300);
      this.data = out;
    },
    init: async function () {
      this.loadLocal();
      try {
        if (!window.claude || !window.claude.use) return;
        var db = await window.claude.use('db'); if (!db) return;
        var user = await window.claude.use('user');
        var id = user ? await user.id() : null;
        this.ref = db.doc(id ? 'data/users/' + id + '/progress-' + MODE : 'progress/shared-' + MODE);
        var snap = await this.ref.get();
        var hadLocal = Object.keys(this.data.q).length || Object.keys(this.data.c).length;
        if (snap.exists) this.merge(snap.data());
        this.where = id ? 'account' : 'shared';
        if (!snap.exists && hadLocal) { this.dirty = true; await this.flush(); }
        this.saveLocal(); render(); saveBadge();
      } catch (e) { this.ref = null; this.where = 'device'; saveBadge(); }
    },
    save: function () {
      this.saveLocal(); if (!this.ref) return;
      this.dirty = true; clearTimeout(this.timer);
      var self = this; this.timer = setTimeout(function () { self.flush(); }, 1500);
    },
    flush: async function () {
      var self = this;
      if (!this.ref || !this.dirty) return;
      if (this.saving) { clearTimeout(this.timer); this.timer = setTimeout(function () { self.flush(); }, 800); return; }
      this.dirty = false; this.saving = true;
      try { await this.ref.set(JSON.parse(JSON.stringify(this.data))); }
      catch (e) { if (e && e.code === 'unavailable') { this.dirty = true; } else { this.ref = null; this.where = 'device'; saveBadge(); } }
      finally { this.saving = false; }
    },
  };
  function saveBadge() {
    var el = $('#savebadge'); if (!el) return;
    el.textContent = Store.where === 'account' ? 'Progress saves to your account' : Store.where === 'shared' ? 'Progress saves to this guide' : 'Progress saves on this device';
  }

  // ---------- stats ----------
  function qStat(id) { return Store.data.q[id] || null; } // [attempts, correct, lastCorrect, lastTs]
  function statFor(qs) {
    var seen = 0, right = 0;
    qs.forEach(function (q) { var s = qStat(q.id); if (s) { seen++; if (s[2]) right++; } });
    return { n: qs.length, seen: seen, right: right };
  }
  function recordAnswer(q, choice) {
    var ok = choice === q.answer ? 1 : 0;
    var s = Store.data.q[q.id] || [0, 0, 0, 0];
    Store.data.q[q.id] = [s[0] + 1, s[1] + ok, ok, Date.now()];
    Store.save();
    return ok;
  }

  // ---------- AI ----------
  // Inside a Claude viewer the page asks Claude through the `sample` capability (the viewer's own account).
  // On the open web (self-hosted copy) it calls the Claude API with a key saved on this device only.
  var SDK_URL = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.133.0/+esm';
  var MODEL = 'claude-opus-5-5';
  var KEY_STORE = 'bcaba-anthropic-key';
  var AI = { mode: null, fn: null, images: null, checked: false, key: '', sdk: null, client: null };
  function readKey() { try { return localStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; } }
  function aiReady() { return AI.mode === 'viewer' || (AI.mode === 'key' && !!AI.key); }
  async function initAI() {
    if (!window.claude || !window.claude.use) {
      AI.mode = 'key'; AI.key = readKey(); AI.images = { maxCount: 1, mediaTypes: ['image/*'] }; AI.checked = true; render(); return;
    }
    try {
      AI.fn = await window.claude.use('sample');
      if (AI.fn) { AI.mode = 'viewer'; try { var lim = await AI.fn.limits(); AI.images = lim && lim.images ? lim.images : null; } catch (e) { AI.images = null; } }
    } catch (e) { AI.fn = null; }
    AI.checked = true; render();
  }
  async function apiClient() {
    if (AI.client) return AI.client;
    if (!AI.sdk) AI.sdk = (await import(SDK_URL)).default;
    AI.client = new AI.sdk({ apiKey: AI.key, dangerouslyAllowBrowser: true });
    return AI.client;
  }
  async function shrinkImage(file) {
    var bmp = await createImageBitmap(file);
    var scale = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
    var c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.88).split(',')[1];
  }
  async function apiCall(prompt, opts) {
    var client = await apiClient();
    var content = [];
    if (opts.file) content.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: await shrinkImage(opts.file) } });
    content.push({ type: 'text', text: prompt });
    var output = { effort: opts.effort || 'high' };
    if (opts.schema) output.format = { type: 'json_schema', schema: opts.schema };
    var resp = await client.beta.messages.create({
      model: MODEL,
      max_tokens: 16000,
      betas: ['server-side-fallback-2026-07-01'],
      fallbacks: 'default',
      output_config: output,
      messages: [{ role: 'user', content: content }],
    }, { signal: opts.signal });
    if (resp.stop_reason === 'refusal') throw { code: 'refused' };
    var text = resp.content.filter(function (b) { return b.type === 'text'; }).map(function (b) { return b.text; }).join('');
    if (!text) throw { code: 'empty_completion' };
    return text;
  }
  async function askJSON(prompt, schema, file, signal) {
    if (AI.mode === 'viewer') return AI.fn.json(prompt, Object.assign({ modelTier: 'complex', signal: signal }, file ? { images: [file] } : {}));
    var text = await apiCall(prompt, { schema: schema, file: file, signal: signal });
    try { return JSON.parse(text); } catch (e) { throw { code: 'invalid_json' }; }
  }
  async function askText(prompt, onText) {
    if (AI.mode === 'viewer') return AI.fn(prompt, { modelTier: 'default', onText: function (u) { onText(u.text); } });
    var text = await apiCall(prompt, { effort: 'medium' });
    onText(text);
  }
  function aiError(e) {
    var S = AI.sdk;
    if (e && e.name === 'AbortError') return '';
    if (S && e instanceof S.AuthenticationError) return 'The API key was rejected. Check it under Ask settings and save it again.';
    if (S && e instanceof S.PermissionDeniedError) return 'This API key isn’t allowed to use Claude. Check it in the Anthropic Console.';
    if (S && e instanceof S.RateLimitError) return 'Claude is busy or the monthly spending limit was reached. Try again in a minute.';
    if (S && e instanceof S.BadRequestError) return /credit/i.test(e.message || '') ? 'The Anthropic account is out of credit. Add credit in the Anthropic Console.' : 'Claude couldn’t take that request. Try a smaller photo or shorter text.';
    if (S && e instanceof S.APIConnectionError) return 'Couldn’t reach Claude. Check the internet connection and try again.';
    if (S && e instanceof S.APIError) return 'Claude had a problem answering. Try again in a moment.';
    if (e instanceof TypeError && /import|module|fetch/i.test(e.message || '')) return 'Couldn’t load the Claude connection. Check the internet connection and try again.';
    var c = e && e.code;
    if (c === 'refused') return 'Claude declined to answer that one. Try typing just the question and its choices.';
    if (c === 'not_granted' || c === 'sampling_disabled' || c === 'capability_disabled' || c === 'not_declared') return 'Claude isn’t allowed for this page right now. You can allow it from the page’s Permissions menu.';
    if (c === 'rate_limited') return 'Too many requests at once, or your Claude usage limit was reached. Wait a bit and try again.';
    if (c === 'image_rejected') return 'That image couldn’t be read. Try a JPEG or PNG photo, or crop it smaller.';
    if (c === 'images_unavailable') return 'Photos can’t be sent from this view. Type or paste the question instead.';
    if (c === 'invalid_json') return 'The answer came back in a broken format. Tap the button again.';
    if (c === 'session_expired') return 'Your Claude session expired. Sign in again, then retry.';
    if (c === 'cancelled') return '';
    return 'Something went wrong reaching Claude. Try again in a moment.';
  }
  function mapText() {
    return D.tasks.map(function (t) {
      var r = (t.refs || []).map(function (x) { return 'ch' + x.ch + ' pp.' + x.from + '-' + x.to; }).join('; ');
      return t.id + ' | ' + t.label + ' | ' + (r || 'no book pages') + ((t.code || []).length ? ' | Ethics Code ' + t.code.join(', ') : '');
    }).join('\n');
  }
  function chapterText() {
    return D.chapters.map(function (c) { return 'ch' + c.ch + ' ' + c.title + ' (pp.' + c.bookStart + '-' + c.bookEnd + '): ' + c.sections.map(function (s) { return s.title + ' p.' + s.page; }).join('; '); }).join('\n');
  }
  function allowedRef(r) {
    if (!r || !chById[r.ch]) return false;
    var c = chById[r.ch];
    return r.from >= c.bookStart && r.to <= c.bookEnd && r.from <= r.to;
  }

  // ---------- state + routing ----------
  var TABS = MODE === 'exam'
    ? [['today', 'Today'], ['outline', 'Outline'], ['practice', 'Practice'], ['cards', 'Cards'], ['ask', 'Ask'], ['find', 'Find']]
    : [['chapters', 'Chapters'], ['quiz', 'Quizzes'], ['cards', 'Cards'], ['ask', 'Ask'], ['find', 'Find']];
  var state = { tab: TABS[0][0], task: null, ch: null, quiz: null, deck: null, find: '', ask: { mode: 'question', file: null, url: '', text: '', busy: false, result: null, err: '', ctl: null }, explain: {} };
  function fromHash() {
    var h = (location.hash || '').replace('#', '');
    if (!h) return;
    if (/^t-[A-I]\.\d+$/.test(h)) { state.tab = MODE === 'exam' ? 'outline' : 'find'; state.task = h.slice(2); return; }
    if (/^ch-\d+$/.test(h)) { state.tab = MODE === 'exam' ? 'find' : 'chapters'; state.ch = +h.slice(3); return; }
    TABS.forEach(function (t) { if (t[0] === h) state.tab = h; });
  }
  function go(tab, extra) {
    state.tab = tab; state.task = null; state.ch = null;
    Object.assign(state, extra || {});
    var token = state.task ? 't-' + state.task : state.ch ? 'ch-' + state.ch : tab;
    try { history.replaceState(null, '', '#' + token); } catch (e) { }
    render(); window.scrollTo(0, 0);
  }

  // ---------- shell ----------
  function shell() {
    var name = MODE === 'exam' ? 'BCaBA <span>Exam Prep</span>' : 'Cooper <span>Class Companion</span>';
    var other = D.other ? '<a class="small linkish" href="' + D.other[0] + '">' + D.other[1] + ' →</a>' : '';
    return '<header class="top"><div class="top-inner"><div class="brand"><h1>' + name + '</h1><span class="row" style="gap:12px">' + other + '<span id="savebadge" class="savebadge"></span></span></div>' +
      '<nav id="tabs" class="tabs" aria-label="Sections"></nav></div></header><main id="main"></main>';
  }
  function render() {
    if (!$('#main')) { document.getElementById('app').innerHTML = shell(); saveBadge(); }
    if (state.tab === 'ask' && AI.checked && !AI.mode) state.tab = TABS[0][0];
    $('#tabs').innerHTML = TABS.filter(function (t) { return t[0] !== 'ask' || AI.mode; }).map(function (t) { return '<button class="tab" data-act="tab" data-v="' + t[0] + '"' + (state.tab === t[0] ? ' aria-current="page"' : '') + '>' + t[1] + '</button>'; }).join('');
    var v = VIEWS[state.tab] || VIEWS[TABS[0][0]];
    $('#main').innerHTML = v();
    if (state.tab === 'find' && state.focusFind) { var s = $('#q'); state.focusFind = false; if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }
  }

  // ---------- graph (data-sheet line graph) ----------
  function graph(sessions) {
    var pts = sessions.filter(function (s) { return s.kind === 'quiz' && s.n; }).slice(-24);
    var ghost = !pts.length;
    if (ghost) pts = [55, 50, 62, 58, 70, 74, 71, 82, 85].map(function (v, i) { return { t: i, n: 10, correct: v / 10 }; });
    var W = 600, H = 190, l = 34, r = 12, t = 12, b = 28, iw = W - l - r, ih = H - t - b;
    var x = function (i) { return l + (pts.length === 1 ? iw / 2 : (i * iw) / (pts.length - 1)); };
    var y = function (v) { return t + ih - (v / 100) * ih; };
    var g = '<svg class="graph' + (ghost ? ' ghost' : '') + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Practice scores by session">';
    [0, 25, 50, 75, 100].forEach(function (v) { g += '<line class="gridl" x1="' + l + '" x2="' + (W - r) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (l - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + v + '</text>'; });
    g += '<line class="crit" x1="' + l + '" x2="' + (W - r) + '" y1="' + y(80) + '" y2="' + y(80) + '"/><text class="critlbl" x="' + (W - r) + '" y="' + (y(80) - 5) + '" text-anchor="end">80% mastery criterion</text>';
    g += '<path class="axis" d="M' + l + ' ' + t + 'V' + (t + ih) + 'H' + (W - r) + '"/>';
    var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(pct(p.correct, p.n)).toFixed(1); }).join('');
    g += '<path class="path" d="' + d + '"/>';
    pts.forEach(function (p, i) { g += '<circle class="dot" cx="' + x(i).toFixed(1) + '" cy="' + y(pct(p.correct, p.n)).toFixed(1) + '" r="3.5"/>'; });
    g += '<text x="' + (l + iw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">Practice sessions</text>';
    if (ghost) g += '<text x="' + (l + iw / 2) + '" y="' + (t + ih / 2) + '" text-anchor="middle" style="font-size:13px">Example: your sessions will plot here</text>';
    return g + '</svg>';
  }

      (Store.where === 'device' ? 'Saved in this browser on this device. To carry it to another phone or computer, copy the backup code here and restore it there.' : 'Saved to your Claude account.') + '</p>' +
      '<div class="row"><button class="btn quiet" data-act="backup">Copy backup code</button><button class="btn quiet" data-act="restore-open">Restore from a code</button></div>' +
      (state.backupShown ? '<label class="small" for="backupbox">Backup code (copied if your browser allowed it; otherwise select it all and copy)</label><textarea id="backupbox" readonly>' + esc(backupCode()) + '</textarea>' : '') +
      (state.restoreOpen ? '<label class="small" for="restorebox">Paste a backup code</label><textarea id="restorebox"></textarea><div class="row"><button class="btn" data-act="restore">Restore</button></div>' : '') +
      (state.backupMsg ? '<div class="callout ' + (state.backupOk ? 'good' : '') + '">' + esc(state.backupMsg) + '</div>' : '') + '</section>';
  }

  var VIEWS = MODE === 'exam'
    ? { today: viewToday, outline: viewOutline, practice: viewPractice, cards: viewCards, ask: viewAsk, find: viewFind }
    : { chapters: viewChapters, quiz: viewQuizzes, cards: viewCards, ask: viewAsk, find: viewFind };

  // ---------- events ----------
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act, v = b.dataset.v;
    var bank = D.questions.filter(function (q) { return q.task; });
    switch (act) {
      case 'tab': state.quiz = null; state.deck = null; go(v); break;
      case 'task': go(MODE === 'exam' ? 'outline' : (state.tab === 'find' ? 'find' : 'chapters'), { task: v, quiz: null }); break;
      case 'chapter': go(MODE === 'exam' ? 'find' : 'chapters', { ch: +v }); break;
      case 'back-outline': go(MODE === 'exam' ? 'outline' : 'chapters'); break;
      case 'back-chapters': go(MODE === 'exam' ? 'find' : 'chapters'); break;
      case 'quiz-task': startQuiz(shuffle(qsForTask(v).map(function (q) { return q.id; })), v + ' · ' + taskById[v].label, v); break;
      case 'quiz-domain': startQuiz(shuffle(qsForDomain(v).map(function (q) { return q.id; })), 'All of Domain ' + v, v); break;
      case 'quiz-quick': {
        var pri = shuffle(bank).sort(function (x, y) { var a = qStat(x.id), b2 = qStat(y.id); return (a ? (a[2] ? 2 : 1) : 0) - (b2 ? (b2[2] ? 2 : 1) : 0); });
        startQuiz(pri.slice(0, 10).map(function (q) { return q.id; }), 'Quick 10', 'quick'); break;
      }
      case 'quiz-missed': startQuiz(shuffle(bank.filter(function (q) { var s = qStat(q.id); return s && !s[2]; })).map(function (q) { return q.id; }), 'Missed last time', 'missed'); break;
      case 'quiz-unseen': startQuiz(shuffle(bank.filter(function (q) { return !qStat(q.id); })).slice(0, 20).map(function (q) { return q.id; }), 'Unseen questions', 'unseen'); break;
      case 'quiz-ids': startQuiz(v.split(','), 'Retry misses', 'retry'); break;
      case 'quiz-ch': startQuiz(D.questions.filter(function (q) { return q.set === 'ch' + v; }).map(function (q) { return q.id; }), 'Chapter ' + v + ' check', 'ch' + v); break;
      case 'pick': { var z = state.quiz, q = qById[z.ids[z.i]]; if (z.picks[q.id] == null) { z.picks[q.id] = +v; recordAnswer(q, +v); render(); } break; }
      case 'next': { var z2 = state.quiz; if (z2.i + 1 < z2.ids.length) z2.i++; else { z2.done = true; finishQuiz(); } render(); window.scrollTo(0, 0); break; }
      case 'quit': finishQuiz(); state.quiz = null; render(); break;
      case 'flip': state.deck.flip = !state.deck.flip; render(); break;
      case 'card-got': gradeCard(true); break;
      case 'card-miss': gradeCard(false); break;
      case 'deck-quit': state.deck = null; render(); break;
      case 'deck-due': { var t0 = today(); startDeck(function (c) { var s = Store.data.c[c.id]; return s && s[1] <= t0; }, 'Due today'); break; }
      case 'deck-B': startDeck(function (c) { return c.deck === 'B'; }, 'Domain B concepts'); break;
      case 'deck-task': startDeck(function (c) { return c.task === v; }, v + ' cards'); break;
      case 'deck-gloss': { var chv = ($('#deckCh') || {}).value; startDeck(function (c) { return c.deck === 'glossary' && (!chv || String(c.ch) === chv); }, chv ? 'Chapter ' + chv + ' glossary' : 'Cooper glossary'); break; }
      case 'deck-ch': startDeck(function (c) { return c.deck === 'glossary' && c.ch === +v; }, 'Chapter ' + v + ' terms'); break;
      case 'findset': state.find = v; state.focusFind = true; render(); break;
      case 'askmode': state.ask.mode = v; state.ask.result = null; state.ask.err = ''; render(); break;
      case 'askgo': askGo(); break;
      case 'askstop': if (state.ask.ctl) state.ask.ctl.abort(); break;
      case 'askclear': if (state.ask.url) URL.revokeObjectURL(state.ask.url); state.ask.file = null; state.ask.url = ''; render(); break;
      case 'explain': explainAgain(v); break;
      case 'savekey': {
        var k = (($('#apikey') || {}).value || '').trim();
        if (!/^sk-ant-/.test(k)) { state.ask.err = 'That doesn’t look like an Anthropic API key. Keys start with sk-ant-.'; render(); break; }
        try { localStorage.setItem(KEY_STORE, k); } catch (e) { }
        AI.key = k; AI.client = null; state.ask.editKey = false; state.ask.err = ''; render(); break;
      }
      case 'editkey': state.ask.editKey = true; state.ask.err = ''; render(); break;
      case 'cancelkey': state.ask.editKey = false; state.ask.err = ''; render(); break;
      case 'removekey': try { localStorage.removeItem(KEY_STORE); } catch (e) { } AI.key = ''; AI.client = null; state.ask.editKey = false; render(); break;
      case 'backup': {
        state.backupShown = true; state.backupMsg = '';
        try { navigator.clipboard.writeText(backupCode()).then(function () { state.backupMsg = 'Backup code copied. On the other device, open this guide and paste it under “Restore from a code”.'; state.backupOk = true; render(); }, function () { }); } catch (e) { }
        render(); break;
      }
      case 'restore-open': state.restoreOpen = !state.restoreOpen; state.backupMsg = ''; render(); break;
      case 'restore': {
        var raw = (($('#restorebox') || {}).value || '').replace(/\s+/g, '');
        try {
          if (raw.indexOf('BCABA1.') !== 0) throw 0;
          var got = JSON.parse(decodeURIComponent(escape(atob(raw.slice(7)))));
          if (!got || typeof got.q !== 'object' || typeof got.c !== 'object') throw 0;
          Store.merge(got); Store.save();
          state.restoreOpen = false; state.backupMsg = 'Progress restored and combined with what was already here.'; state.backupOk = true;
        } catch (e) { state.backupMsg = 'That code didn’t work. Copy the whole code again on the other device.'; state.backupOk = false; }
        render(); break;
      }
    }
  });
  function takeFile(f) {
    if (!f) return;
    if (state.ask.url) URL.revokeObjectURL(state.ask.url);
    state.ask.file = f; state.ask.url = URL.createObjectURL(f); state.ask.text = ($('#asktext') || {}).value || state.ask.text; render();
  }
  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.id === 'examDate') { Store.data.examDate = el.value; Store.save(); render(); }
    if (el.id === 'askfile' || el.id === 'askcam') takeFile(el.files && el.files[0]);
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'q') { state.find = ev.target.value; var r = $('#findres'); if (r) r.innerHTML = findResults(); }
    if (ev.target.id === 'asktext') state.ask.text = ev.target.value;
  });
  document.addEventListener('paste', function (ev) {
    if (state.tab !== 'ask' || !AI.images) return;
    var files = ev.clipboardData && ev.clipboardData.files;
    if (files && files.length && /^image\//.test(files[0].type)) { ev.preventDefault(); takeFile(files[0]); }
  });

  window.addEventListener('hashchange', function () { state.quiz = null; state.deck = null; state.task = null; state.ch = null; fromHash(); render(); });
  fromHash(); render(); Store.init(); initAI();
})();

</script>
</body></html>
