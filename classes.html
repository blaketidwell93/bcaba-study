ch his mom makes the sister give it back; this kind of crying has been happening more often at home. Which statement is most accurate?","options":["Both episodes are respondent behavior because the crying looks the same","The first is likely respondent and the second likely operant; the form of the crying cannot tell them apart","Both episodes are operant behavior because crying is learned","Neither episode is behavior because crying expresses an internal emotion"],"answer":1,"why":["Same form does not mean same type. The chapter stresses that topography is of little use for telling respondent from operant behavior.","Correct. Crying elicited by a painful scrape is respondent; crying that has grown because of what follows it (getting the truck back) is operant. Look at the controlling variables, not the tears.","Crying right after a painful scrape is elicited by that antecedent, which makes it respondent. Not every cry is learned.","Crying involves glands and muscles acting in interaction with the environment, so it is behavior."],"cite":{"ch":2,"from":32,"to":32},"level":"apply","set":"ch2"},{"id":"ch2-5","stem":"In Skinner's selection-by-consequences view, operant selection happens over the course of one person's life. Which term names that time scale, and what process is it compared to?","options":["Phylogeny; it parallels respondent conditioning","Phylogeny; it parallels natural selection across generations","Ontogeny; it parallels natural selection across a species' evolutionary history","Ontogeny; it parallels the elicitation of reflexes"],"answer":2,"why":["Phylogeny is a species' evolutionary history, not one lifetime, and the comparison is to natural selection, not respondent conditioning.","The comparison is right, but phylogeny is the species' history. Selection within one lifetime is ontogeny.","Correct. Operant selection works within the individual's life (ontogeny), just as natural selection shapes a species over many generations (phylogeny).","Ontogeny is right, but reflexes are elicited by antecedents. The parallel the chapter draws is to natural selection, where outcomes do the selecting."],"cite":{"ch":2,"from":33,"to":34},"level":"recall","set":"ch2"},{"id":"ch2-6","stem":"A classmate reads 'negative punishment' in a behavior plan and says, 'So the therapist used something harsh.' What does the word 'negative' actually tell you?","options":["The consequence was unpleasant for the client","A stimulus was removed or reduced right after the behavior","The behavior became less frequent in the future","The therapist did not intend to change the behavior"],"answer":1,"why":["'Negative' does not mean bad or unpleasant. Positive and negative only describe the kind of stimulus change.","Correct. 'Negative' means a stimulus was withdrawn or reduced after the response, such as losing points or access to a toy.","That is what the word 'punishment' tells you: future occurrences went down. 'Negative' describes the operation, not the effect.","The chapter notes these modifiers say nothing about anyone's intention or whether the change is desirable."],"cite":{"ch":2,"from":37,"to":37},"level":"recall","set":"ch2"},{"id":"ch2-7","stem":"Marcus dislikes his team's weekly status meeting. One week he tells his manager his migraine is flaring, and she excuses him from the meeting. Over the next two months, Marcus reports a migraine before almost every status meeting. Which principle best accounts for the increase in migraine reports?","options":["Positive punishment","Negative punishment","Positive reinforcement","Negative reinforcement"],"answer":3,"why":["Punishment would make migraine reports less frequent. Here they increased.","Negative punishment removes something and the behavior decreases. The reports went up, not down.","Positive reinforcement would mean something was added after each report. The clear change here is that the meeting he dislikes is taken away.","Correct. Each report is followed by removal of an aversive event (the meeting), and reports become more frequent. That is escape, a form of negative reinforcement."],"cite":{"ch":2,"from":36,"to":37},"level":"apply","set":"ch2"},{"id":"ch2-8","stem":"In early sessions, an RBT says 'Awesome!' each time she hands a client a bite of his favorite cracker. Weeks later she says 'Awesome!' after correct responses without giving crackers, and correct responses keep increasing. 'Awesome!' is now functioning as a(n)","options":["conditioned reinforcer","unconditioned reinforcer","discriminative stimulus","conditioned stimulus that elicits correct responding"],"answer":0,"why":["Correct. The praise gained its power by being paired with an existing reinforcer (the crackers). It now strengthens behavior on its own, which makes it a conditioned reinforcer.","Unconditioned reinforcers, like food for a hungry person, work with no learning history. 'Awesome!' works only because of its pairing history.","A discriminative stimulus comes before the response and signals that reinforcement is available. 'Awesome!' follows the response, so it is a consequence.","The pairing procedure looks like respondent conditioning, but the result is a stimulus that reinforces operant behavior, not one that elicits a reflex. Correct responding is operant."],"cite":{"ch":2,"from":38,"to":39},"level":"apply","set":"ch2"},{"id":"ch2-9","stem":"At a clinic, a client asks for a break only when Ms. Reyes is running his session. She has honored his break requests in the past; the other therapists have not. In three-term contingency terms, Ms. Reyes's presence is best described as a(n)","options":["reinforcer for asking","discriminative stimulus (SD) for asking","eliciting stimulus for asking","motivating operation that makes breaks more valuable"],"answer":1,"why":["The reinforcer is the break itself, which follows the request. Ms. Reyes is present before the request.","Correct. Her presence comes before the response, and asking has been reinforced when she is there, so asking happens more often with her. That is a discriminated operant under stimulus control.","An eliciting stimulus produces a reflexive (respondent) response. Asking for a break is operant; an SD makes it more likely but does not force it.","A motivating operation changes how valuable the break is, as a long, hard task might. Ms. Reyes does not make breaks more valuable; she signals that breaks are available."],"cite":{"ch":2,"from":40,"to":41},"level":"apply","set":"ch2"},{"id":"ch2-10","stem":"Skinner contrasted rule-governed behavior with contingency-shaped behavior. Which statement matches the chapter's account?","options":["Rule-governed behavior is controlled by verbal descriptions of contingencies and is often acquired faster than behavior shaped by direct experience","Rule-governed behavior is acquired only through repeated direct contact with reinforcement","Contingency-shaped behavior requires that the person be able to state the rule","Rules are most useful when contingencies are simple and obvious"],"answer":0,"why":["Correct. A rule lets a person act effectively without first contacting the consequences, and picking up a rule is usually faster than waiting for consequences to shape the behavior.","This describes contingency-shaped behavior, which is learned through direct contact with consequences.","Contingency-shaped behavior does not need a stated rule. Operant conditioning works even when a person is unaware of the contingency.","This reverses the point. Rules help most when contingencies are complex, unclear, or otherwise weak."],"cite":{"ch":2,"from":42,"to":42},"level":"recall","set":"ch2"}],"cards":[{"id":"b:B.1-0","front":"Behavior","back":"Any movement of a living organism's body (or a part of it) as it interacts with its surroundings, including movement inside the skin.","task":"B.1","page":26,"ch":2,"deck":"B"},{"id":"b:B.1-1","front":"Dead man test","back":"If a dead person could \"do\" it (stay quiet, get wet, fall over), it is not behavior.","task":"B.1","page":26,"ch":2,"deck":"B"},{"id":"b:B.1-2","front":"Response","back":"One single occurrence of a behavior. Technically, an action by an effector: a skeletal muscle, smooth muscle, or gland.","task":"B.1","page":27,"ch":2,"deck":"B"},{"id":"b:B.1-3","front":"Response topography","back":"The physical shape or form of a response; it differs slightly every time.","task":"B.1","page":27,"ch":2,"deck":"B"},{"id":"b:B.1-4","front":"Response class","back":"Responses that may look different but all accomplish the same result in the environment.","task":"B.1","page":27,"ch":2,"deck":"B"},{"id":"b:B.1-5","front":"Repertoire","back":"Everything a person can do, or the set of skills a person has for a particular setting or task.","task":"B.1","page":27,"ch":2,"deck":"B"},{"id":"b:B.1-6","front":"What does reinforcement actually strengthen?","back":"A whole response class. Untrained responses with the same function can increase, not just the exact response that was reinforced.","task":"B.1","page":34,"ch":2,"deck":"B"},{"id":"b:B.2-7","front":"Stimulus","back":"Any change in energy that a person's sense receptors detect: sights, sounds, smells, touches, or sensations inside the body.","task":"B.2","page":27,"ch":2,"deck":"B"},{"id":"b:B.2-8","front":"Interoceptors vs. proprioceptors","back":"Interoceptors sense the internal organs (a stomachache). Proprioceptors sense body movement and balance.","task":"B.2","page":27,"ch":2,"deck":"B"},{"id":"b:B.2-9","front":"Three ways to describe a stimulus","back":"Formal (physical features), temporal (before or after the behavior), and functional (its effect on behavior).","task":"B.2","page":28,"ch":2,"deck":"B"},{"id":"b:B.2-10","front":"Stimulus class","back":"A set of stimuli with chosen features in common: their form, their timing, and/or their function.","task":"B.2","page":28,"ch":2,"deck":"B"},{"id":"b:B.2-11","front":"Antecedent stimulus class","back":"Antecedents grouped because each one evokes the same operant response class (or elicits the same respondent).","task":"B.2","page":402,"ch":17,"deck":"B"},{"id":"b:B.2-12","front":"Feature stimulus class","back":"Members share physical features (all mugs) or a relation (any \"longer than\" pair). Responding generalizes easily to new members.","task":"B.2","page":402,"ch":17,"deck":"B"},{"id":"b:B.2-13","front":"Arbitrary stimulus class","back":"Members share no physical features but evoke the same response (whistle, raised palm, STOP card all mean freeze). Usually built with matching-to-sample.","task":"B.2","page":402,"ch":17,"deck":"B"},{"id":"b:B.3-14","front":"Respondent behavior","back":"Behavior elicited by a stimulus that comes before it, like a sneeze to pepper; the response half of a reflex.","task":"B.3","page":30,"ch":2,"deck":"B"},{"id":"b:B.3-15","front":"Respondent conditioning","back":"Stimulus-stimulus pairing: an NS presented just before or with a US until the NS alone elicits the response (NS becomes a CS).","task":"B.3","page":31,"ch":2,"deck":"B"},{"id":"b:B.3-16","front":"Respondent extinction","back":"Presenting the CS again and again without the US until it stops eliciting the conditioned response.","task":"B.3","page":31,"ch":2,"deck":"B"},{"id":"b:B.3-17","front":"Higher-order conditioning","back":"Pairing a new neutral stimulus with an already-established CS so the new stimulus becomes a CS too.","task":"B.3","page":32,"ch":2,"deck":"B"},{"id":"b:B.3-18","front":"Habituation","back":"A reflexive response weakens when its eliciting stimulus is repeated many times in a short span.","task":"B.3","page":30,"ch":2,"deck":"B"},{"id":"b:B.3-19","front":"Operant conditioning","back":"Consequences that closely follow a response change how often similar responses occur later: up is reinforcement, down is punishment.","task":"B.3","page":34,"ch":2,"deck":"B"},{"id":"b:B.3-20","front":"Elicit vs. evoke","back":"A US or CS elicits respondent behavior. An SD evokes operant behavior because responding in its presence was reinforced.","task":"B.3","page":398,"ch":17,"deck":"B"},{"id":"b:B.3-21","front":"Can form tell you respondent from operant?","back":"No. Tears from smoke are respondent; tears that reliably bring comfort can be operant. Look at the controlling variables.","task":"B.3","page":32,"ch":2,"deck":"B"},{"id":"b:B.4-0","front":"Reinforcement (any kind)","back":"A consequence that makes the behavior it follows happen more often in the future. If the behavior does not increase, it was not reinforcement.","task":"B.4","page":36,"ch":2,"deck":"B"},{"id":"b:B.4-1","front":"Positive reinforcement","back":"A stimulus is added, or made stronger, right after a behavior, and that behavior happens more often later.","task":"B.4","page":253,"ch":11,"deck":"B"},{"id":"b:B.4-2","front":"Negative reinforcement","back":"A behavior ends, reduces, postpones, or prevents a stimulus, and that behavior happens more often later.","task":"B.4","page":287,"ch":12,"deck":"B"},{"id":"b:B.4-3","front":"What do \"positive\" and \"negative\" mean?","back":"Added versus removed. They describe the stimulus change, not whether it is pleasant, good, or intended.","task":"B.4","page":37,"ch":2,"deck":"B"},{"id":"b:B.4-4","front":"Escape contingency","back":"The response ends a stimulus that is already happening. Example: turning down music that is blasting.","task":"B.4","page":289,"ch":12,"deck":"B"},{"id":"b:B.4-5","front":"Discriminated avoidance","back":"A warning signal comes first; responding while the signal is on keeps the unpleasant event from starting.","task":"B.4","page":289,"ch":12,"deck":"B"},{"id":"b:B.4-6","front":"Free-operant avoidance","back":"No warning signal. Responding at any time pushes the unpleasant event further away.","task":"B.4","page":289,"ch":12,"deck":"B"},{"id":"b:B.5-7","front":"Punishment (any kind)","back":"A consequence that makes the behavior it follows happen less often in the future. Defined by that effect, not by intent or harshness.","task":"B.5","page":327,"ch":14,"deck":"B"},{"id":"b:B.5-8","front":"Positive punishment","back":"A stimulus is added, or intensified, right after a behavior, and that behavior happens less often later.","task":"B.5","page":328,"ch":14,"deck":"B"},{"id":"b:B.5-9","front":"Negative punishment","back":"A stimulus already present, usually a reinforcer, is removed or reduced right after a behavior, and that behavior happens less often later.","task":"B.5","page":328,"ch":14,"deck":"B"},{"id":"b:B.5-10","front":"Time-out from positive reinforcement","back":"Negative punishment: after the behavior, the person loses access to reinforcers, or the chance to earn them, for a set time.","task":"B.5","page":353,"ch":15,"deck":"B"},{"id":"b:B.5-11","front":"Response cost","back":"Negative punishment: after the behavior, the person loses a specific amount of reinforcers already earned, like paying a fine.","task":"B.5","page":361,"ch":15,"deck":"B"},{"id":"b:B.5-12","front":"Positive punishment vs. negative reinforcement","back":"The same unpleasant event can be involved. Punishment adds it and behavior drops; negative reinforcement removes it and behavior rises.","task":"B.5","page":329,"ch":14,"deck":"B"},{"id":"b:B.5-13","front":"Is a threat punishment?","back":"No. A threat comes before the behavior, so it is an antecedent. Punishment is a consequence that follows the behavior.","task":"B.5","page":329,"ch":14,"deck":"B"},{"id":"b:B.6-14","front":"Socially mediated contingency","back":"Another person delivers the antecedent and/or the consequence. Example: a parent hands over a snack after the child asks.","task":"B.6","page":28,"ch":2,"deck":"B"},{"id":"b:B.6-15","front":"Automatic reinforcement","back":"Reinforcement produced directly by the behavior, with no one else delivering it, such as the movement sensation from rocking.","task":"B.6","page":261,"ch":11,"deck":"B"},{"id":"b:B.6-16","front":"Automatic negative reinforcement","back":"The behavior itself ends something unpleasant, such as rubbing a sore muscle to ease the ache.","task":"B.6","page":629,"ch":27,"deck":"B"},{"id":"b:B.6-17","front":"Social negative reinforcement","back":"Another person removes the unpleasant event after the behavior, such as a teacher dropping a task after a tantrum.","task":"B.6","page":629,"ch":27,"deck":"B"},{"id":"b:B.6-18","front":"Automatic punishment","back":"A punishing consequence that comes straight from the behavior, not from a person, such as a burn from grabbing a hot pan.","task":"B.6","page":328,"ch":14,"deck":"B"},{"id":"b:B.6-19","front":"Automatic reinforcement vs. automaticity of reinforcement","back":"Automatic: no other person delivers the consequence. Automaticity: reinforcement works even without the person's awareness. Two different ideas.","task":"B.6","page":36,"ch":2,"deck":"B"},{"id":"b:B.6-20","front":"When is automatic reinforcement assumed?","back":"When the behavior persists with no social consequence, such as when the person is alone, after attention, tangibles, and escape are ruled out.","task":"B.6","page":629,"ch":27,"deck":"B"},{"id":"b:B.7-0","front":"Unconditioned reinforcer","back":"Strengthens behavior with no learning history needed; a product of the species' evolution. Examples: food, water, warmth, oxygen. Still depends on motivation.","task":"B.7","page":263,"ch":11,"deck":"B"},{"id":"b:B.7-1","front":"Conditioned reinforcer","back":"A once-neutral stimulus that gained reinforcing power by being paired with existing reinforcers in the person's own history. Also called secondary or learned.","task":"B.7","page":263,"ch":11,"deck":"B"},{"id":"b:B.7-2","front":"Generalized conditioned reinforcer","back":"A conditioned reinforcer backed by many other reinforcers, so it works across most motivating conditions. Examples: money, tokens, attention.","task":"B.7","page":264,"ch":11,"deck":"B"},{"id":"b:B.7-3","front":"Why is it called \"generalized\"?","back":"Because it works across many motivating conditions, not because it strengthens many behaviors (any reinforcer can do that).","task":"B.7","page":264,"ch":11,"deck":"B"},{"id":"b:B.7-4","front":"Unconditioned punisher","back":"Reduces behavior with no prior pairing. Examples: pain, certain tastes or odors, physical restraint, loss of bodily support, extreme muscular effort.","task":"B.7","page":329,"ch":14,"deck":"B"},{"id":"b:B.7-5","front":"Conditioned punisher","back":"A stimulus that suppresses behavior because it was paired with other punishers. It weakens if it keeps occurring without them.","task":"B.7","page":329,"ch":14,"deck":"B"},{"id":"b:B.7-6","front":"Generalized conditioned punisher","back":"Paired with many different punishers, so it works under most conditions. Examples: \"No!\", scowls, head shakes.","task":"B.7","page":330,"ch":14,"deck":"B"},{"id":"b:B.7-7","front":"Conditioned negative reinforcer (example)","back":"Nagging: escaping or avoiding it strengthens behavior because it has been reliably backed up by another consequence.","task":"B.7","page":291,"ch":12,"deck":"B"},{"id":"b:B.8-8","front":"Continuous reinforcement (CRF)","back":"Every response is reinforced. Best for building a new behavior early in learning.","task":"B.8","page":301,"ch":13,"deck":"B"},{"id":"b:B.8-9","front":"Fixed ratio (FR)","back":"Reinforcer after a set number of responses (FR 5 = every 5th). Pattern: pause after reinforcement, then a fast run (break-and-run).","task":"B.8","page":303,"ch":13,"deck":"B"},{"id":"b:B.8-10","front":"Variable ratio (VR)","back":"Reinforcer after a changing number of responses around an average. Pattern: high, steady rate with little or no pausing.","task":"B.8","page":304,"ch":13,"deck":"B"},{"id":"b:B.8-11","front":"Fixed interval (FI)","back":"First response after a set time is reinforced. Pattern: pause after reinforcement, then responding speeds up near the end (scallop).","task":"B.8","page":307,"ch":13,"deck":"B"},{"id":"b:B.8-12","front":"Variable interval (VI)","back":"First response after varying times (around an average) is reinforced. Pattern: steady, low-to-moderate rate with few pauses.","task":"B.8","page":308,"ch":13,"deck":"B"},{"id":"b:B.8-13","front":"Limited hold (LH)","back":"Added to FI or VI: the reinforcer stays available only briefly after the interval ends. Miss it and a new interval starts.","task":"B.8","page":309,"ch":13,"deck":"B"},{"id":"b:B.8-14","front":"Fixed-time (FT) / variable-time (VT)","back":"Reinforcers delivered by the clock regardless of behavior; used in noncontingent reinforcement. Not an interval schedule.","task":"B.8","page":617,"ch":26,"deck":"B"},{"id":"b:B.8-15","front":"Ratio strain","back":"Responding breaks down (avoidance, aggression, unpredictable pauses) when ratio requirements jump too fast or grow too large.","task":"B.8","page":309,"ch":13,"deck":"B"},{"id":"b:B.9-16","front":"Operant extinction","back":"A behavior that used to be reinforced no longer produces its reinforcer, so it decreases. The person can still do it; it just stops paying off.","task":"B.9","page":583,"ch":24,"deck":"B"},{"id":"b:B.9-17","front":"Extinction vs. forgetting","back":"Forgetting: weakening from no chance to respond over time. Extinction: weakening because responding no longer produces reinforcement.","task":"B.9","page":583,"ch":24,"deck":"B"},{"id":"b:B.9-18","front":"Escape extinction","back":"For negatively reinforced behavior: the behavior no longer ends or avoids the demand or other aversive situation.","task":"B.9","page":585,"ch":24,"deck":"B"},{"id":"b:B.9-19","front":"Sensory extinction","back":"For automatically reinforced behavior: mask or remove the sensory consequence the behavior produces (for example, gloves or padded surfaces).","task":"B.9","page":586,"ch":24,"deck":"B"},{"id":"b:B.9-20","front":"Extinction burst","back":"An early, temporary jump in the behavior's rate once reinforcement stops; often a sign the right reinforcer is being withheld.","task":"B.9","page":587,"ch":24,"deck":"B"},{"id":"b:B.9-21","front":"Spontaneous recovery","back":"The extinguished behavior briefly reappears later even though it still is not reinforced; short-lived if extinction continues.","task":"B.9","page":588,"ch":24,"deck":"B"},{"id":"b:B.9-22","front":"Resurgence","back":"An old behavior returns when reinforcement for the alternative behavior that replaced it is stopped or reduced.","task":"B.9","page":589,"ch":24,"deck":"B"},{"id":"b:B.9-23","front":"Resistance to extinction","back":"How long a behavior keeps going in extinction. Greater after intermittent (especially variable, thin) schedules, strong motivation, long history, and low effort.","task":"B.9","page":589,"ch":24,"deck":"B"},{"id":"b:B.10-0","front":"Stimulus control","back":"An antecedent alters how often, how fast, how long, or how forcefully a response occurs, because responding met different consequences with it than without it.","task":"B.10","page":396,"ch":17,"deck":"B"},{"id":"b:B.10-1","front":"SD (discriminative stimulus)","back":"An antecedent in whose presence a response has produced more or better reinforcement than in its absence. It signals availability.","task":"B.10","page":396,"ch":17,"deck":"B"},{"id":"b:B.10-2","front":"S-delta","back":"An antecedent in whose presence the response has produced no reinforcement, or reinforcement of lesser amount or quality.","task":"B.10","page":396,"ch":17,"deck":"B"},{"id":"b:B.10-3","front":"SDp","back":"An antecedent in whose presence a response has been punished, so that response is less likely when it is present.","task":"B.10","page":330,"ch":14,"deck":"B"},{"id":"b:B.10-4","front":"Conditional discrimination","back":"Which choice gets reinforced depends on a second stimulus, the conditional stimulus. Example: the spoken request decides which object is the SD.","task":"B.10","page":398,"ch":17,"deck":"B"},{"id":"b:B.10-5","front":"Faulty stimulus control","back":"Behavior controlled by an irrelevant cue, such as color, position, or a highlighted word, instead of the features that matter.","task":"B.10","page":397,"ch":17,"deck":"B"},{"id":"b:B.10-6","front":"Overselective stimulus control","back":"The range of stimuli or features controlling behavior is extremely narrow, like responding to one small detail of an object instead of the whole.","task":"B.10","page":404,"ch":17,"deck":"B"},{"id":"b:B.10-7","front":"SD vs. MO in one line","back":"An SD signals the payoff is available; an MO changes how much the payoff is worth right now.","task":"B.10","page":379,"ch":16,"deck":"B"},{"id":"b:B.11-8","front":"Stimulus discrimination","back":"The response occurs in the presence of the SD and rarely or not at all in its absence. Tight stimulus control.","task":"B.11","page":396,"ch":17,"deck":"B"},{"id":"b:B.11-9","front":"Stimulus generalization","back":"A response trained with one stimulus also occurs with untrained stimuli that share physical features with it. Loose stimulus control.","task":"B.11","page":396,"ch":17,"deck":"B"},{"id":"b:B.11-10","front":"Generalization gradient","back":"A graph of responding across test stimuli. A flat slope means broad generalization and little control; a steeper slope means more stimulus control.","task":"B.11","page":396,"ch":17,"deck":"B"},{"id":"b:B.11-11","front":"What a concept requires","back":"Generalization across members of a stimulus class plus discrimination from nonmembers. Teach with varied examples and nonexamples.","task":"B.11","page":402,"ch":17,"deck":"B"},{"id":"b:B.11-12","front":"Setting/situation generalization","back":"The skill shows up in a place or situation that is meaningfully different from the one where it was taught.","task":"B.11","page":716,"ch":30,"deck":"B"},{"id":"b:B.11-13","front":"Response generalization","back":"Untrained responses that do the same job as the trained behavior begin to occur.","task":"B.11","page":718,"ch":30,"deck":"B"},{"id":"b:B.11-14","front":"Overgeneralization","back":"Behavior controlled by an overly broad stimulus class, so it occurs on occasions where it does not fit.","task":"B.11","page":719,"ch":30,"deck":"B"},{"id":"b:B.12-15","front":"Motivating operation (MO)","back":"An environmental variable that changes how effective a consequence is (value-altering) and how often behavior that produced it occurs right now (behavior-altering).","task":"B.12","page":373,"ch":16,"deck":"B"},{"id":"b:B.12-16","front":"EO vs. AO","back":"An establishing operation raises a reinforcer's current effectiveness; an abolishing operation lowers it.","task":"B.12","page":373,"ch":16,"deck":"B"},{"id":"b:B.12-17","front":"Evocative vs. abative effect","back":"Evocative: current frequency of related behavior goes up. Abative: it goes down.","task":"B.12","page":373,"ch":16,"deck":"B"},{"id":"b:B.12-18","front":"Unconditioned MO (UMO)","back":"An MO whose value-altering effect needs no learning history, such as food deprivation or pain. The behaviors it evokes are usually learned.","task":"B.12","page":379,"ch":16,"deck":"B"},{"id":"b:B.12-19","front":"UMOs that raise reinforcer value","back":"Deprivation of food, water, sleep, activity, oxygen, or sex; becoming too warm; becoming too cold; an increase in painful stimulation.","task":"B.12","page":380,"ch":16,"deck":"B"},{"id":"b:B.12-20","front":"Is attention deprivation a UMO?","back":"Usually not. For most adults attention is a conditioned reinforcer, so restricting it works as a conditioned MO. Infants may be an exception.","task":"B.12","page":381,"ch":16,"deck":"B"},{"id":"b:B.12-21","front":"MOs and punishers","back":"MOs can raise or lower how well a punisher works and change the current frequency of behavior that punisher has suppressed.","task":"B.12","page":381,"ch":16,"deck":"B"},{"id":"b:B.12-22","front":"Pain onset: antecedent vs. consequence","back":"As an antecedent, it is a UMO that evokes behavior that has reduced pain. As a consequence, it punishes whatever behavior came just before it.","task":"B.12","page":382,"ch":16,"deck":"B"},{"id":"b:B.13-0","front":"Rule","back":"A verbal statement of a contingency: in this situation, this behavior will lead to this consequence.","task":"B.13","page":255,"ch":11,"deck":"B"},{"id":"b:B.13-1","front":"Rule-governed behavior","back":"Behavior controlled by a rule rather than by direct contact with consequences; also called instructional control. Lets delayed or unlikely outcomes affect behavior.","task":"B.13","page":255,"ch":11,"deck":"B"},{"id":"b:B.13-2","front":"Contingency-shaped behavior","back":"Behavior selected by consequences the person contacted directly. Cooper notes \"contingency-selected\" may be the better label.","task":"B.13","page":42,"ch":2,"deck":"B"},{"id":"b:B.13-3","front":"Why can't a year-end bonus directly reinforce daily sales calls?","back":"Direct reinforcement works over seconds; with a long delay, other behavior gets strengthened instead. Any effect of the bonus comes through language and rules.","task":"B.13","page":255,"ch":11,"deck":"B"},{"id":"b:B.13-4","front":"Five signs behavior is rule-governed","back":"No immediate consequence; delay over 30 seconds; change without reinforcement; big jump after one reinforcer; a rule exists but no consequence does, not even automatic.","task":"B.13","page":255,"ch":11,"deck":"B"},{"id":"b:B.13-5","front":"Self-rule","back":"A rule a person generates from her own experience (\"I'm hopeless at math\"). It controls behavior like a rule from others, even when it is inaccurate.","task":"B.13","page":519,"ch":20,"deck":"B"},{"id":"b:B.13-6","front":"Main weakness of rule-governed behavior","back":"It often fails to adjust when the actual contingencies change, partly because following the rule can bring its own immediate relief (negative reinforcement).","task":"B.13","page":520,"ch":20,"deck":"B"},{"id":"b:B.14-7","front":"Mand","back":"Verbal response evoked by a motivating operation and reinforced by the specific item or action that MO made valuable.","task":"B.14","page":416,"ch":18,"deck":"B"},{"id":"b:B.14-8","front":"Tact","back":"Verbal response evoked by a nonverbal stimulus (something seen, heard, smelled, felt) and reinforced by generalized conditioned reinforcement.","task":"B.14","page":416,"ch":18,"deck":"B"},{"id":"b:B.14-9","front":"Echoic","back":"Vocal response to a heard verbal stimulus with formal similarity: same sense mode and physical resemblance. Hear \"moon,\" say \"moon.\"","task":"B.14","page":416,"ch":18,"deck":"B"},{"id":"b:B.14-10","front":"Textual","back":"Saying words you see in print: point-to-point correspondence without formal similarity. It is reading aloud, with no comprehension implied.","task":"B.14","page":425,"ch":18,"deck":"B"},{"id":"b:B.14-11","front":"Taking dictation (transcription)","back":"Writing or spelling words you hear: point-to-point correspondence across modes, with no formal similarity. A codic relation.","task":"B.14","page":416,"ch":18,"deck":"B"},{"id":"b:B.14-12","front":"Intraverbal","back":"Verbal response to a verbal stimulus with no point-to-point correspondence: answering questions, finishing phrases, conversation.","task":"B.14","page":416,"ch":18,"deck":"B"},{"id":"b:B.14-13","front":"Formal similarity vs. point-to-point correspondence","back":"Formal similarity: same sense mode and physical resemblance (duplic). Point-to-point: the parts match across modes without resembling each other (codic).","task":"B.14","page":416,"ch":18,"deck":"B"},{"id":"b:B.14-14","front":"Autoclitic","back":"Secondary verbal behavior about one's own primary verbal behavior that changes its effect on the listener, such as \"I guess\" or \"most.\"","task":"B.14","page":433,"ch":18,"deck":"B"},{"id":"b:B.15-15","front":"Emergent (derived) relation","back":"A stimulus relation the learner shows that was never directly taught or reinforced, usually tested on probe trials with no consequences.","task":"B.15","page":455,"ch":19,"deck":"B"},{"id":"b:B.15-16","front":"Reflexivity","back":"Matching a stimulus to itself (A = A), shown by identity matching with no reinforcement.","task":"B.15","page":455,"ch":19,"deck":"B"},{"id":"b:B.15-17","front":"Symmetry","back":"Reversing a trained relation: taught A to B, the learner shows B to A without being taught.","task":"B.15","page":455,"ch":19,"deck":"B"},{"id":"b:B.15-18","front":"Transitivity and the combined equivalence test","back":"Relating two stimuli never trained together through a shared one (A = B, B = C, so A = C). A combined test checks symmetry and transitivity at once.","task":"B.15","page":456,"ch":19,"deck":"B"},{"id":"b:B.15-19","front":"Transfer of function","back":"A function taught for one member of an equivalence class shows up in the other members with no extra training.","task":"B.15","page":462,"ch":19,"deck":"B"},{"id":"b:B.15-20","front":"Mutual vs. combinatorial entailment","back":"Mutual: the derived reverse of one learned relation, of any type. Combinatorial: a relation derived through a shared stimulus. Symmetry and transitivity are the \"same as\" cases.","task":"B.15","page":500,"ch":20,"deck":"B"},{"id":"b:B.15-21","front":"Recombinative generalization","back":"Responding correctly to new combinations of known parts (taught \"red cup\" and \"blue hat,\" says \"blue cup\"). Matrix training promotes it.","task":"B.15","page":424,"ch":18,"deck":"B"},{"id":"b:B.15-22","front":"Contingency adduction","back":"Component skills, taught to fluency, get recruited by new contingencies and combine into a new complex skill without direct teaching.","task":"B.15","page":42,"ch":2,"deck":"B"}],"chapters":[{"ch":1,"title":"Definition and Characteristics of Applied Behavior Analysis","part":"Introduction and Basic Concepts","bookStart":2,"bookEnd":24,"sections":[{"title":"Science: Basic Characteristics and a Definition","page":3},{"title":"A Brief History of Behavior Analysis","page":7},{"title":"Characteristics of Applied Behavior Analysis","page":16},{"title":"A Definition of Applied Behavior Analysis","page":19},{"title":"Summary","page":23}],"keyTerms":["applied behavior analysis (ABA)","behaviorism","determinism","empiricism","experiment","experimental analysis of behavior (EAB)","explanatory fiction","functional analysis","functional relation","hypothetical construct","mentalism","methodological behaviorism","parsimony","philosophic doubt","pragmatism","radical behaviorism","science"],"blurb":"What makes behavior analysis a natural science, where it came from, and the seven dimensions that define applied work. Sets up the philosophy (determinism, empiricism, parsimony, radical behaviorism) the rest of the book assumes.","tasks":["A.1","A.2","A.3","A.4","A.5","D.1"]},{"ch":2,"title":"Basic Concepts and Principles","part":"Introduction and Basic Concepts","bookStart":25,"bookEnd":47,"sections":[{"title":"Behavior","page":26},{"title":"Environment","page":27},{"title":"Respondent Behavior","page":28},{"title":"Operant Behavior","page":32},{"title":"Recognizing the Complexity of Human Behavior","page":41},{"title":"Summary","page":44}],"keyTerms":["antecedent","automatic reinforcement","automaticity (of reinforcement)","aversive stimulus","behavior","behavior change tactic","conditioned punisher","conditioned reflex","conditioned reinforcer","conditioned stimulus (CS)","consequence","contingency","contingency-shaped behavior","contingent","deprivation","discriminated operant","discriminative stimulus (SD)","environment","extinction","habituation","higher-order conditioning","history of reinforcement","joint control","motivating operation (MO)","negative punishment","negative reinforcement","neutral stimulus (NS)","ontogeny","operant behavior","operant conditioning","phylogeny","positive punishment","positive reinforcement","principle of behavior"],"blurb":"The working vocabulary of the field: behavior, response, stimulus, respondent and operant conditioning, reinforcement and punishment. Nearly every later chapter builds on these definitions.","tasks":["A.2","B.1","B.2","B.3","B.4","B.5","B.6","B.7","B.13","B.15","C.2"],"guide":{"overview":"Chapter 2 is the vocabulary chapter for the whole book. It pins down what counts as behavior and environment, then splits behavior into two kinds: respondent behavior, which is pulled out by stimuli that come before it, and operant behavior, which is selected by what follows it. Along the way it introduces reinforcement, punishment, extinction, conditioned and unconditioned consequences, motivating operations, and the three-term contingency (antecedent, behavior, consequence). Nearly every idea here gets its own chapter later (reinforcement in Ch. 11-13, punishment in Ch. 14-15, motivating operations in Ch. 16, stimulus control in Ch. 17, verbal behavior in Ch. 18), so treat this chapter as the map. When a later chapter feels confusing, come back here for the basic definition.","sections":[{"title":"Behavior","from":26,"to":27,"summary":"Loosely, behavior is anything a living thing does. For science the chapter tightens that: behavior is the part of an organism's interaction with its surroundings that involves some body part moving. So it must be a living organism (an engine does not behave). There has to be an interaction, so states like 'being hungry' and things that simply happen to you, like getting splashed by a passing car or being handed a sticker, are not behavior. And movement counts at any size, even movement under the skin. A quick check is the dead man test: if a dead man could do it, it is not behavior. A response is one instance of behavior, and its topography is its physical form. Analysts care more about function than form. A response class is a set of responses that all produce the same effect, even if they look different. The same form can even be two different behaviors: saying 'duck' while reading a picture book is not the same behavior as yelling 'Duck!' when a ball flies at a friend. A repertoire is a person's full set of skills, or the skills they bring to one setting or task.","inOneLine":"Behavior is a living organism's movement as it interacts with its environment, and analysts group responses by what they do, not how they look.","terms":[{"term":"behavior","page":26,"plain":"Movement of some part of a living organism as it interacts with its environment."},{"term":"dead man test","page":26,"plain":"If a dead man could do it (stay quiet, sit still, get wet), it is not behavior. A fast check on target behaviors."},{"term":"response","page":27,"plain":"One specific instance of behavior, such as a single hand raise."},{"term":"response topography","page":27,"plain":"The physical form or shape of a response: what it looks like."},{"term":"response class","page":27,"plain":"Responses grouped by a shared effect: different-looking actions that all get the same result."},{"term":"repertoire","page":27,"plain":"Everything a person is able to do, or the set of skills they bring to one setting or task."}]},{"title":"Environment","from":27,"to":28,"summary":"Behavior never happens in a vacuum. The environment is the full set of physical circumstances a person is in, and that includes their own body: a dry throat makes a sip of water more valuable. Analysts break the environment into stimuli. A stimulus is a change in energy that the person detects through their sense receptors, whether from outside (sights, sounds, smells, touch) or inside (a stomach ache, a sense of balance). What usually matters is the change: a phone starting to buzz, not one sitting silent. Stimuli can be described three ways: formally (size, color, loudness), temporally (when they happen relative to the behavior), and functionally (what they do to behavior). A stimulus class groups stimuli that have certain features in common along one or more of those dimensions. Timing gives two key words: antecedents come before the behavior, consequences come after it. Either can be nonsocial (an elevator button lighting up) or delivered by another person. When someone else supplies the antecedent or the consequence, the contingency is socially mediated. One stimulus change can also do two jobs at once: change behavior right now, and change how often that behavior happens later.","inOneLine":"Behavior is influenced mainly by stimulus changes that come before it (antecedents) and after it (consequences).","terms":[{"term":"environment","page":27,"plain":"The full set of physical circumstances a person is in, including events inside their own body."},{"term":"stimulus","page":27,"plain":"A change in energy that a person detects through sense receptors, coming from outside or inside the body."},{"term":"stimulus class","page":28,"plain":"Stimuli treated as one set because they have chosen features in common: physical form, timing, or effect on behavior."},{"term":"antecedent","page":28,"plain":"A condition or stimulus change that is present or happens before the behavior of interest."},{"term":"consequence","page":28,"plain":"A stimulus change that follows the behavior of interest."},{"term":"socially mediated contingency","page":28,"plain":"A contingency in which another person delivers the antecedent, the consequence, or both."}]},{"title":"Respondent Behavior","from":28,"to":32,"summary":"Everyone is born with reflexes: built-in stimulus-response pairs, like flinching at a sudden bang or coughing when something irritates the throat. The response half of a reflex is respondent behavior. It is elicited, or pulled out, by a stimulus that comes before it, and nothing has to follow it for it to happen. If the same eliciting stimulus is repeated many times in a short span, the response can fade; that is habituation. Through respondent conditioning (also called classical or Pavlovian conditioning), a neutral stimulus (NS) that is paired with an unconditioned stimulus (US) comes to elicit a response by itself. The NS has become a conditioned stimulus (CS), and the new learned stimulus-response relation is a conditioned reflex. Pairing works best when the NS comes just before, or at the same time as, the US. A CS can in turn be paired with another NS, which is higher-order conditioning. To undo a conditioned reflex, present the CS over and over without the US: respondent extinction. Respondents explain many emotional reactions, like a knot in the stomach at a certain ringtone, but they are a small slice of what behavior analysts usually work on.","inOneLine":"Respondent behavior is elicited by what comes before it, and pairing stimuli can give new stimuli that eliciting power.","terms":[{"term":"reflex","page":28,"plain":"An inborn stimulus-response relation, such as flinching at a sudden loud bang."},{"term":"respondent behavior","page":30,"plain":"Behavior elicited by an antecedent stimulus; nothing has to follow it for it to occur."},{"term":"habituation","page":30,"plain":"A reflexive response weakens when its eliciting stimulus is presented over and over in a short time."},{"term":"respondent conditioning","page":30,"plain":"Pairing a neutral stimulus with an eliciting stimulus until the neutral one elicits the response alone. Also called classical or Pavlovian conditioning."},{"term":"unconditioned stimulus (US)","page":31,"plain":"A stimulus that elicits a response with no learning history, like food in the mouth."},{"term":"neutral stimulus (NS)","page":31,"plain":"A stimulus that does not yet elicit the response of interest."},{"term":"conditioned stimulus (CS)","page":31,"plain":"A once-neutral stimulus that now elicits a response because it was paired with an eliciting stimulus."},{"term":"conditioned reflex","page":31,"plain":"A learned stimulus-response relation: a CS and the response it now elicits."},{"term":"respondent extinction","page":31,"plain":"Presenting the CS again and again without the US until it no longer elicits the conditioned response."},{"term":"higher-order conditioning","page":32,"plain":"Pairing a neutral stimulus with an existing CS so the neutral one becomes a CS too. Also called secondary conditioning."}]},{"title":"Operant Behavior","from":32,"to":41,"summary":"Operant behavior is shaped and kept going by its consequences. Unlike a reflex it can take almost any form, so it is defined by its effect, not its look. Consequences select behavior within one lifetime (ontogeny) much as natural selection shapes a species over generations (phylogeny). Five rules apply: consequences change only future behavior; they act on whole response classes; immediate ones matter most; whatever happens to come right before a consequence can be selected (hence superstitions); and it works whether or not the person notices. Reinforcement means the behavior becomes more frequent; punishment means less frequent. Positive means a stimulus was added; negative means one was removed. Withholding reinforcement for a behavior that used to get it is extinction. Some consequences work with no learning (unconditioned); others work because they were paired with existing ones (conditioned). Motivating operations, like deprivation, change how strong a consequence is right now. Consequences also give antecedents power: a discriminative stimulus (SD) signals that a response will pay off. Antecedent, behavior, consequence form the three-term contingency, the core unit behavior analysts work with.","inOneLine":"Operant behavior is selected by its consequences, and antecedents gain control because of the consequences that followed behavior in their presence.","terms":[{"term":"operant behavior","page":32,"plain":"Behavior whose future strength depends on what has happened right after it before; learned through consequences."},{"term":"selectionism (selection by consequences)","page":33,"plain":"Consequences select behavior within a lifetime the way natural selection shapes a species across generations."},{"term":"ontogeny","page":33,"plain":"The history of one individual over their own lifetime; where operant learning happens."},{"term":"phylogeny","page":33,"plain":"The evolutionary history of a species; where reflexes and unconditioned reinforcers come from."},{"term":"operant conditioning","page":34,"plain":"The process by which consequences change how often similar responses occur in the future. Covers reinforcement and punishment."},{"term":"automaticity of reinforcement","page":36,"plain":"Reinforcement changes behavior whether or not the person notices or can describe the connection."},{"term":"automatic reinforcement","page":36,"plain":"Reinforcement the behavior produces on its own, with no one else delivering it, like the feel of twirling hair."},{"term":"reinforcement","page":36,"plain":"A consequence follows a response and similar responses happen more often in the future."},{"term":"positive reinforcement","page":36,"plain":"A stimulus is added (or increased) after a response, and similar responses occur more often."},{"term":"negative reinforcement","page":36,"plain":"A stimulus is removed (or reduced) after a response, and similar responses occur more often. Think escape and avoidance."},{"term":"aversive stimulus","page":36,"plain":"Often a stimulus whose removal reinforces behavior. Also used for punishers, so check which function is meant."},{"term":"extinction","page":37,"plain":"Withholding reinforcement for a previously reinforced behavior, so it falls back toward its pre-reinforcement level."},{"term":"punishment","page":37,"plain":"A consequence follows a response and similar responses happen less often in the future."},{"term":"positive punishment","page":37,"plain":"A stimulus is added after a response, and similar responses occur less often."},{"term":"negative punishment","page":37,"plain":"A stimulus is removed after a response, and similar responses occur less often. Time-out and response cost rest on it."},{"term":"unconditioned reinforcer","page":38,"plain":"A stimulus that strengthens behavior with no learning history, like water for someone who is thirsty."},{"term":"unconditioned punisher","page":38,"plain":"A stimulus that weakens behavior with no learning history, like painful stimulation."},{"term":"motivating operation","page":38,"plain":"A variable, like deprivation or satiation, that changes how effective a reinforcer or punisher is right now."},{"term":"conditioned reinforcer","page":38,"plain":"A once-neutral stimulus that strengthens behavior because it was paired with other reinforcers, like praise."},{"term":"conditioned punisher","page":38,"plain":"A once-neutral stimulus that weakens behavior because it was paired with other punishers, like a stern look."},{"term":"principle of behavior","page":39,"plain":"A well-replicated functional relation between behavior and its controlling variables, such as reinforcement or extinction."},{"term":"behavior change tactic","page":39,"plain":"A research-based method that puts one or more principles into practice, like token systems, shaping, or time-out."},{"term":"discriminated operant","page":40,"plain":"An operant that occurs more often when a certain antecedent stimulus is present than when it is absent."},{"term":"discriminative stimulus (SD)","page":40,"plain":"An antecedent in whose presence a response has been reinforced, so the response is more likely when it is there."},{"term":"stimulus control","page":40,"plain":"A behavior occurs at different rates depending on whether a particular antecedent stimulus is present or absent."},{"term":"three-term contingency","page":40,"plain":"Antecedent, behavior, consequence (the ABCs): the core building block behavior analysts use to analyze operant behavior."},{"term":"contingent / contingency","page":41,"plain":"A consequence is contingent on a behavior when the behavior must occur for the consequence to happen."}]},{"title":"Recognizing the Complexity of Human Behavior","from":41,"to":44,"summary":"The principles in this chapter are solid, but applying them to real people in real settings is hard, and a fast success should not fool a new analyst into thinking the science knows everything. The chapter names four sources of difficulty. First, human repertoires are complex. Responses link into chains, and verbal behavior adds layers. Rule-governed behavior is controlled by a verbal description of a contingency ('hold the reset button for five seconds'), while contingency-shaped behavior comes from direct contact with consequences. Some skills also appear without direct teaching, through stimulus equivalence or contingency adduction, where fluent component skills combine into something new. Second, controlling variables are complex. One behavior often has several causes at once (joint control, concurrent contingencies), and one event can have several effects, such as blocking one problem behavior and seeing another in the same response class go up. Third, people differ, mostly because each person brings a different history of reinforcement, plus differences in senses and bodies, not hidden inner traits. Fourth, practical limits: thin resources, stakeholder objections, and legal or ethical constraints.","inOneLine":"Real-world behavior is hard to analyze because repertoires, controlling variables, and personal histories are complex, and practical limits get in the way.","terms":[{"term":"response chain","page":42,"plain":"A sequence in which what one response produces sets up the next response."},{"term":"rule-governed behavior","page":42,"plain":"Behavior controlled by a verbal statement of a contingency rather than by direct experience with it."},{"term":"contingency-shaped behavior","page":42,"plain":"Behavior acquired through direct contact with consequences, not from being told the rule."},{"term":"stimulus equivalence","page":42,"plain":"Research showing learners can show new, untaught relations after being taught related ones. Covered fully in Ch. 19-20."},{"term":"contingency adduction","page":42,"plain":"A skill first learned for one purpose gets pulled into a new set of contingencies and starts serving a different purpose."},{"term":"joint control","page":42,"plain":"Two of a person's own verbal behaviors combine to control a response that neither would produce alone."},{"term":"concurrent contingencies","page":43,"plain":"Several contingencies operating at the same time, which can add together or compete for control of behavior."},{"term":"behavioral covariation","page":43,"plain":"Changing one behavior also changes others, such as other members of the same response class."},{"term":"history of reinforcement","page":43,"plain":"A person's unique past experience with consequences; the main reason people respond differently to the same situation."}]}],"bigIdeas":["Behavior is movement by a living organism interacting with its environment. States ('being quiet', 'being anxious') and things that merely happen to a person are not behavior. Run the dead man test.","Function beats form. Responses are grouped by what they do (response class), and the same-looking response can be respondent in one case and operant in another.","Respondent behavior is elicited by antecedents and changed by stimulus-stimulus pairing. Operant behavior is selected by its consequences.","Reinforcement always means the behavior goes up; punishment always means it goes down. Positive = a stimulus added, negative = a stimulus removed. A consequence earns these labels only by its effect on future behavior.","The three-term contingency (antecedent, behavior, consequence) is the core unit behavior analysts work with. Antecedents gain control over behavior because of the consequences that followed it in their presence."],"mixups":[{"trap":"Negative reinforcement is a kind of punishment.","fix":"Reinforcement always makes behavior go up. Negative reinforcement removes something (often unpleasant) and the behavior increases. Punishment makes behavior go down."},{"trap":"Positive means good and negative means bad.","fix":"They only name the operation: positive = a stimulus is added, negative = a stimulus is removed. They say nothing about pleasantness, intent, or whether the change is desirable."},{"trap":"Automatic reinforcement and automaticity of reinforcement are the same idea.","fix":"Automatic reinforcement: the behavior produces its own reinforcer, with no one else delivering it. Automaticity: reinforcement works even when the person is unaware of it."},{"trap":"A discriminative stimulus elicits the response.","fix":"Only respondents are elicited. An SD makes an operant more likely because responding in its presence has been reinforced before; it does not force the response."},{"trap":"Habituation and respondent extinction are the same thing.","fix":"Habituation: an eliciting stimulus repeated in a short span and the response fades. Respondent extinction: a CS presented without the US until it stops eliciting the response."},{"trap":"Respondent extinction and operant extinction are the same procedure.","fix":"Respondent extinction breaks a stimulus pairing (CS without US). Operant extinction withholds the reinforcer that used to follow a behavior."},{"trap":"You can tell respondent from operant behavior by how it looks.","fix":"Form does not settle it. Ask what controls it: an eliciting stimulus before it (respondent) or a history of consequences after it (operant)."},{"trap":"Time-out and response cost are their own principles of behavior.","fix":"They are behavior change tactics. Both are built on the principle of negative punishment."},{"trap":"Candy is a reinforcer and a reprimand is a punisher.","fix":"Nothing is a reinforcer or punisher by nature. Use the label only after you see the effect on future behavior, and remember motivating operations change that effect."}]}},{"ch":3,"title":"Selecting and Defining Target Behaviors","part":"Selecting, Defining, and Measuring Behavior","bookStart":48,"bookEnd":72,"sections":[{"title":"Role of Assessment in Applied Behavior Analysis","page":48},{"title":"Assessment Methods Used by Behavior Analysts","page":50},{"title":"Assessing the Social Significance of Potential Target Behaviors","page":59},{"title":"Prioritizing Target Behaviors","page":64},{"title":"Defining Target Behaviors","page":67},{"title":"Setting Criteria for Behavior Change","page":70},{"title":"Summary","page":71}],"keyTerms":["ABC recording","anecdotal observation","behavior checklist","behavioral assessment","behavioral cusp","ecological assessment","function-based definition","habilitation","normalization","pivotal behavior","reactivity","relevance of behavior rule","social validity","target behavior","topography-based definition"],"blurb":"How to choose which behaviors to change and define them so two observers agree. Covers assessment methods, social significance, prioritizing goals, and writing operational definitions.","tasks":["C.2","C.3","C.10","E.3","F.1","F.2","F.3","F.4","H.1","H.3","H.4","H.8"]},{"ch":4,"title":"Measuring Behavior","part":"Selecting, Defining, and Measuring Behavior","bookStart":73,"bookEnd":100,"sections":[{"title":"Definition and Functions of Measurement in Applied Behavior Analysis","page":74},{"title":"Measurable Dimensions of Behavior","page":76},{"title":"Methods for Measuring Behavior","page":83},{"title":"Measuring Behavior by Permanent Products","page":93},{"title":"Measurement Tools","page":96},{"title":"Selecting a Measurement Method","page":97},{"title":"Summary","page":98}],"keyTerms":["artifact","celeration","count","duration","event recording","free operant","frequency","interresponse time (IRT)","measurement by permanent product","momentary time sampling","partial-interval recording","percentage","planned activity check (PLACHECK)","rate","topography","trials-to-criterion","whole-interval recording"],"blurb":"The measurable dimensions of behavior (count, rate, duration, latency, and more) and how to record them, from event recording to interval methods and permanent products.","tasks":["C.1","C.2","C.3","C.4","C.5","C.7","C.10","F.2","G.13","H.6","H.7"]},{"ch":5,"title":"Improving and Assess cts","generalization probe","generalization setting","generalized behavior change","indiscriminable contingency","instructional setting","multiple-exemplar training","naturally existing contingency","response generalization","response maintenance","teach enough examples","teach loosely"],"blurb":"Generalization and maintenance: planning so behavior change spreads to new settings and lasts after the intervention ends.","tasks":["B.1","B.11","B.15","C.10","G.13","G.17","G.20","H.7","H.8","I.7","I.9"]},{"ch":31,"title":"Ethical and Professional Responsibilities of Applied Behavior Analysts","part":"Ethics","bookStart":758,"bookEnd":784,"sections":[{"title":"What Is Ethics and Why IS IT Important?","page":759},{"title":"Standards of Professional Practice for Applied Behavior Analysts","page":764},{"title":"Ensuring Professional Competence","page":765},{"title":"Ethical Issues in Client Services","page":769},{"title":"Coordinating with Other Professionals","page":775},{"title":"Social Media and New Technologies","page":776},{"title":"Advocating for the Client","page":778},{"title":"Conflict of Interest","page":780},{"title":"Creating a Culture of Ethical Practice","page":781},{"title":"Conclusion","page":782},{"title":"Summary","page":782}],"keyTerms":["Compliance Code","confidentiality","conflict of interest","countercontrol","disciplinary standards","ethical codes of behavior","ethics","fraudulent conduct"],"blurb":"Ethics and professional responsibility in applied behavior analysis. Written around the older 2016 BACB code; for the exam, study the 2022 Ethics Code.","tasks":["E.1","E.2","E.3","E.4","E.5","E.6","E.7","E.8","E.9","E.10","E.11","F.1","F.2","F.3","H.2","H.3","H.7","H.8","I.1","I.2","I.3","I.4","I.5","I.6","I.7","I.8"]}],"glossary":[{"term":"A-B design","def":"The simplest two-phase design: measure behavior in baseline (A), then again once treatment (B) starts. It shows change but cannot prove the treatment caused it.","page":165,"ch":7},{"term":"A-B-A design","def":"Three phases: baseline (A), treatment (B), then treatment is removed and baseline returns (A). If behavior goes back toward its first-baseline level, that supports the treatment's effect.","page":174,"ch":8},{"term":"A-B-A-B design","def":"Baseline, treatment, back to baseline, then treatment again. The return to baseline checks for a reversal, and the second treatment phase checks whether the original effect repeats.","page":172,"ch":8},{"term":"abative effect (of a motivating operation)","def":"When a motivating operation (MO) makes behavior that has earned a certain reinforcer happen less often right now. Example: after an hour of gaming, he stops asking for the tablet.","page":373,"ch":16},{"term":"ABC recording","def":"Another name for anecdotal observation: writing down, in order, each antecedent, behavior, and consequence as they happen.","page":55,"ch":3},{"term":"abolishing operation (AO)","def":"A motivating operation that temporarily lowers how effective something is as a reinforcer. Example: after two glasses of water, water stops working well as a reinforcer.","page":373,"ch":16},{"term":"acceptance and commitment therapy (ACT)","def":"A research-supported behavior therapy. Its goal, well-being, means a person keeps reaching the positive reinforcers they value most instead of being held back by thoughts and feelings.","page":517,"ch":20},{"term":"accuracy (of measurement)","def":"How closely the recorded data match what really happened (the true value). Accurate data mirror the actual event, not just each other.","page":102,"ch":5},{"term":"adapted alternating treatments design","def":"A multielement variation for comparing teaching methods: each method is rotated and applied to its own equivalent set of items (e.g., two matched word lists) to see which teaches faster.","page":184,"ch":8},{"term":"add-in component analysis","def":"Test single parts of a treatment package, or combinations, adding parts until the full package runs. This finds sufficient parts, but order or floor/ceiling effects can mask late additions.","page":224,"ch":10},{"term":"adjunctive behavior","def":"Filler behavior (fidgeting, snacking) that appears as a side effect when another behavior is on a periodic reinforcement schedule, mainly in gaps when reinforcement isn't due. Also called schedule-induced behavior.","page":320,"ch":13},{"term":"affirmation of the consequent","def":"Reasoning of the form: if A then B; B happened; so A is true. Alone it's not proof, but confirming many such predictions makes rival explanations less likely.","page":165,"ch":7},{"term":"alternating treatments design","def":"Another name for the multielement design, where two or more conditions rapidly alternate (e.g., session by session) so their effects on behavior can be compared.","page":181,"ch":8},{"term":"alternative schedule (alt)","def":"Two or more schedules are available at once, and whichever requirement is met first earns reinforcement (e.g., alt FR 20/FI 4-min: 20 responses, or the first response after 4 minutes).","page":318,"ch":13},{"term":"anecdotal observation","def":"Direct continuous observation: you write a running, time-ordered narrative of target behaviors plus what came before and after each, in the person's everyday setting. Also called ABC recording.","page":55,"ch":3},{"term":"antecedent","def":"The 'A' in ABC: anything in the surroundings already present or happening before a behavior, either a steady condition (a noisy room) or a change (someone calls your name).","page":27,"ch":2},{"term":"antecedent exercise","def":"Vigorous exercise, usually aerobic (brisk walking, biking), scheduled whether or not problem behavior occurs, to reduce behaviors like self-injury, aggression, and stereotypy. A kind of antecedent intervention.","page":615,"ch":26},{"term":"antecedent intervention","def":"Changing antecedent stimuli (what comes before behavior) to change behavior, through motivating operations, stimulus control, or contingency-free supports like a padded helmet. Examples: noncontingent reinforcement, high-p request sequences.","page":614,"ch":26},{"term":"antecedent stimulus class","def":"Stimuli grouped by shared effect: any member evokes the same operant response (or elicits the same respondent one). Example: a ring, buzz, or screen flash all evoke phone-checking.","page":402,"ch":17},{"term":"applied behavior analysis (ABA)","def":"A science with two jobs: improve socially significant behavior with methods built on behavior principles, and use experiments to pin down what actually produced the improvement.","page":3,"ch":1},{"term":"arbitrarily applicable relational responding (AARR)","def":"Responding to stimuli as related (same, opposite, bigger than) based on learned cues rather than physical features, so new stimulus classes form with little or no direct training.","page":507,"ch":20},{"term":"arbitrary relations","def":"Stimuli we treat as going together despite no physical likeness, purely because our verbal community taught the link through reinforcement. Example: the word 'cat' and a real cat.","page":498,"ch":20},{"term":"arbitrary stimulus class","def":"A group of stimuli that look nothing alike and share no relational feature, yet all evoke the same response. Example: '5,' 'five,' and five held-up fingers all evoke saying 'five.'","page":402,"ch":17},{"term":"artifact","def":"A measurement illusion: the data show a result that isn't real, produced by the measuring method itself. Example: partial-interval recording making brief outbursts look longer than they were.","page":92,"ch":4},{"term":"ascending baseline","def":"A baseline whose data path trends upward: the measure keeps rising across sessions.","page":163,"ch":7},{"term":"audience","def":"A listener whose presence cues a speaker's verbal behavior, acting as an SD. Different audiences have reinforced different talk, so a party story changes for a friend versus a boss.","page":414,"ch":18},{"term":"autoclitic","def":"Verbal behavior about your own verbal behavior: a secondary response added to a primary one that tells the listener more about it. Example: 'probably' in 'It's probably raining.'","page":421,"ch":18},{"term":"autoclitic frame","def":"A reusable sentence pattern (word order, grouping, agreement) that helps a speaker produce brand-new utterances. Example: having learned 'more juice' and 'more blocks,' a child says 'more bubbles' untaught.","page":434,"ch":18},{"term":"autoclitic mand","def":"An add-on to a main statement, partly controlled by an MO, asking the listener to act on that statement; their action reinforces it. Example: 'Remember, rent is due Friday.'","page":433,"ch":18},{"term":"autoclitic tact","def":"An add-on telling the listener something about the main statement or its source, like how sure the speaker is; maintained by generalized reinforcement. Example: 'I heard that…'","page":424,"ch":18},{"term":"automatic contingencies","def":"Skinner's label for contingencies that need no other person: the environment itself evokes, shapes, keeps up, or weakens behavior. Example: a faster route home gets taken more often.","page":423,"ch":18},{"term":"automatic punishment","def":"Punishment that happens without anyone else delivering it: the behavior's own result reduces future behavior. Example: touching a hot pan.","page":328,"ch":14},{"term":"automatic reinforcement","def":"Reinforcement that comes directly from the behavior itself, with no other person delivering it. Example: humming a tune because the sound is enjoyable.","page":36,"ch":2},{"term":"automaticity (of reinforcement)","def":"The fact that reinforcement changes behavior even if the person never notices it or could not describe the behavior-consequence link. Not the same as automatic reinforcement.","page":36,"ch":2},{"term":"aversive stimulus","def":"Everyday sense: something unpleasant. Technical sense: a stimulus that punishes when it follows behavior, reinforces behavior when removed, and/or evokes behavior that has ended it before (e.g., a blaring alarm).","page":36,"ch":2},{"term":"avoidance contingency","def":"A response prevents or delays an aversive stimulus from arriving. Example: paying a bill early to avoid a late fee.","page":289,"ch":12},{"term":"B-A-B design","def":"A three-phase design that starts with treatment (B), withdraws it (A) to see if behavior changes, then brings treatment back (B) to see if the first effect returns.","page":172,"ch":8},{"term":"backup reinforcers","def":"The things tokens can be cashed in for in a token economy, like snacks, extra recess, or screen time.","page":657,"ch":28},{"term":"backward chaining","def":"Teaching a chain from the end: the trainer does all but the last step, which the learner completes for reinforcement; after mastery, the learner does the final two, etc.","page":559,"ch":23},{"term":"backward chaining with leaps ahead","def":"Backward chaining that skips steps the learner can already do, making long chains faster to teach.","page":null,"ch":null},{"term":"bar graph","def":"A graph showing each summary value as a bar (e.g., average tantrums per condition) instead of plotting separate data points over time like a line graph. Also called a histogram.","page":127,"ch":6},{"term":"baseline","def":"The comparison condition: the independent variable (IV) being tested is left out, though regular teaching or treatment may continue. Behavior here is the yardstick for judging the IV's effect.","page":194,"ch":9},{"term":"baseline logic","def":"The reasoning behind single-case designs, built on three steps: prediction (where behavior is headed), verification, and replication.","page":162,"ch":7},{"term":"behavior","def":"Any movement of part of an organism as it interacts with its surroundings. Quick check: if a dead person could do it (like 'sitting still'), it isn't behavior.","page":26,"ch":2},{"term":"Behavior Analyst Certification Board's (BACB's) Professional and Ethical Compliance Code for Behavior Analysts","def":"The BACB's 2016 ethics code (10 sections plus a glossary), which replaced its earlier conduct guidelines. It is now superseded by the 2022 Ethics Code for Behavior Analysts.","page":null,"ch":null},{"term":"behavior chain","def":"Linked responses (e.g., making toast) where each step's result does double duty: conditioned reinforcer for that step and SD for the next. Reinforcement at the end keeps every link working.","page":558,"ch":23},{"term":"behavior chain interruption strategy","def":"Deliberately interrupt a chain the learner already does alone, e.g., hide the cup at snack, so another behavior (asking for the cup) can be prompted or happen on its own.","page":571,"ch":23},{"term":"behavior chain with a limited hold","def":"A chain that must be finished within a set time for reinforcement to be delivered. Example: assembling a sandwich order within 3 minutes.","page":558,"ch":23},{"term":"behavior change tactic","def":"A named, clearly described procedure grounded in behavior principles (e.g., time-out, grounded in negative punishment) that works across enough people, settings, or behaviors to be written up and taught.","page":37,"ch":2},{"term":"behavior checklist","def":"A skills inventory, e.g., rating 'ties shoes' or 'greets peers' on a 1–5 Likert scale. Items describe specific skills, often ordered easy to hard, and when each should occur.","page":52,"ch":3},{"term":"behavior trap","def":"A web of reinforcement contingencies that hooks learners for lasting change: tempting bait, easy entry with a known response, new skills built inside, and little satiation.","page":724,"ch":30},{"term":"behavior-altering effect (of a motivating operation)","def":"A motivating operation's effect on how often behavior that earned a given reinforcer happens right now: more (evocative effect) or less (abative effect). Cold evokes jacket-grabbing; warmth abates it.","page":373,"ch":16},{"term":"behavioral assessment","def":"Using interviews, checklists, tests, and direct observation to pick and define target behaviors, and to learn what maintains them plus the resources, competing contingencies, and reinforcers available for a plan.","page":49,"ch":3},{"term":"behavioral contract","def":"Another name for a contingency contract: a written agreement linking specific behaviors to specific reinforcers.","page":672,"ch":28},{"term":"behavioral contrast","def":"On a multiple schedule, when a changed component's rate rises or falls, the untouched component's rate shifts the opposite way. Example: whining drops with Dad (extinction) but rises with Mom.","page":317,"ch":13},{"term":"behavioral cusp","def":"A game-changing behavior: once learned, it suddenly gives access to new settings, reinforcers, contingencies, and things to learn, so its impact far outgrows the behavior itself. Example: learning to read.","page":60,"ch":3},{"term":"behavioral inflexibility","def":"In ACT, getting stuck: thoughts and feelings (private events) crowd out the outside world, blocking the actions that would earn a person's most valued reinforcers.","page":520,"ch":20},{"term":"behavioral momentum","def":"Like a rolling ball, a behavior's rate resists change when reinforcement conditions shift. The term also describes the high-p effect: easy requests first make compliance with a hard one likelier.","page":619,"ch":26},{"term":"behaviorism","def":"The worldview beneath a science of behavior: its philosophy, not its experiments. Versions include methodological behaviorism and Skinner's radical behaviorism.","page":7,"ch":1},{"term":"believability","def":"Can we trust these data enough to analyze them? Believability is how convincingly the answer is yes, for the researcher and readers. Interobserver agreement (IOA) is ABA's most-used evidence.","page":102,"ch":5},{"term":"bidirectional naming (BiN)","def":"A higher-order verbal cusp joining listener and speaker skills: taught to point to a heron when asked, a child can then name herons (tact) untaught, and the reverse also works.","page":421,"ch":18},{"term":"bonus response cost","def":"Response cost from an extra stash: the person starts with bonus reinforcers beyond their usual ones (say, 10 extra game minutes), and loses a preset chunk after each target behavior.","page":365,"ch":15},{"term":"brief functional analysis","def":"A functional analysis using one or two 5–10-min sessions per condition. Function is confirmed by switching between a problem-evoking condition and a control condition, or by contingency reversal.","page":634,"ch":27},{"term":"calibration","def":"Checking a measurement system against a known standard or true value, then fixing any error found. Example: observers score a video with a known true count; misses lead to retraining.","page":109,"ch":5},{"term":"causal relations","def":"'If this, then that' links, the core of scientific thinking. In stimulus-relations work, they can set up how a stimulus class is built, or how its members' functions change.","page":504,"ch":20},{"term":"celeration","def":"How a response rate grows or shrinks over time, stated as a multiplier (×2: doubles per week; ÷2: halves). Drawn on a Standard Celeration Chart as a trend line.","page":78,"ch":4},{"term":"celeration time period","def":"The time span (week, month, year) used to measure celeration on a Standard Celeration Chart, e.g., change in rate per week.","page":null,"ch":null},{"term":"celeration trend line","def":"The line that shows celeration: how many times rate is multiplied or divided per celeration time period (e.g., x1.5 per week).","page":null,"ch":null},{"term":"chained schedule","def":"Two or more schedules completed in a fixed order before reinforcement, each signaled by its own SD (e.g., green light: FR 5; then tone: FI 30-s).","page":317,"ch":13},{"term":"chaining","def":"The family of teaching methods that link individual steps (stimulus-response pairs) into one longer performance, such as forward, backward, and total-task chaining.","page":559,"ch":23},{"term":"changing criterion design","def":"Baseline, then stepwise treatment phases, each setting a new criterion for reinforcement or punishment (e.g., 10, then 15, then 20 minutes of reading). Behavior matching each step shows experimental control.","page":195,"ch":9},{"term":"class expansion","def":"Growing an equivalence class: teach one new conditional discrimination linking an outside stimulus to a member, and it joins the class. Example: with A=B=C shown, teaching C→D brings in D.","page":460,"ch":19},{"term":"class merger","def":"Teaching one conditional discrimination that bridges two separate equivalence classes fuses them into a single bigger class. Example: classes A1-B1-C1 and D1-E1-F1 merge after teaching C1→D1.","page":460,"ch":19},{"term":"class-specific reinforcement","def":"A match-to-sample method where each correct choice earns a consequence unique to its class (e.g., class 1 earns stickers, class 2 earns tokens); those consequences then join the classes.","page":477,"ch":19},{"term":"clicker training","def":"Pryor's popular term for shaping with a clicker: the click is paired with treats until it becomes a conditioned reinforcer, then used to mark correct responses.","page":541,"ch":22},{"term":"codic","def":"Verbal behavior evoked by a verbal stimulus that it matches part-by-part (point-to-point correspondence) but in a different form (no formal similarity), maintained by generalized reinforcement. Examples: reading aloud, taking dictation.","page":415,"ch":18},{"term":"combinatorial entailment","def":"When two stimuli are each linked by mutual entailment to the same third stimulus, the two become related untaught. Example: taught A=B and B=C, a learner relates A and C.","page":501,"ch":20},{"term":"Compliance Code","def":"Short name for the BACB's 2016 ethics code for behavior analysts (full title in the linked card). It has since been replaced by the 2022 Ethics Code.","page":759,"ch":31},{"term":"component analysis","def":"Taking a treatment package apart experimentally: compare phases with pieces left out to learn which pieces work, how much each adds, and which are necessary or sufficient.","page":222,"ch":10},{"term":"compound schedule","def":"A schedule combining two or more basic ones (e.g., FR, VI, extinction). Parts run in sequence or at once, signaled or not, and reinforcement may require one part or all.","page":303,"ch":13},{"term":"compound verbal discrimination","def":"Two or more verbal SDs that could each evoke behavior alone combine to evoke a more specific response (convergent multiple control). Example: 'Name a red fruit' evokes 'strawberry.'","page":426,"ch":18},{"term":"concept","def":"A group of stimuli that belong together because they have certain features in common (e.g., everything that counts as a 'triangle').","page":396,"ch":17},{"term":"concept formation","def":"A complex kind of stimulus control: generalizing across members of one class while discriminating between that class and others. Example: calling every breed 'dog' but never a cat.","page":401,"ch":17},{"term":"concurrent chains design","def":"A choice-based design: the participant picks among two or more treatments, each tied to its own SD, revealing which they prefer. Also called concurrent schedule design.","page":187,"ch":8},{"term":"concurrent schedule (conc)","def":"Side-by-side schedules: two or more run at once, each independent and tied to its own behavior, so the person chooses where to respond. Used to study choice (matching law).","page":315,"ch":13},{"term":"conditional discrimination","def":"In match-to-sample, which comparison is correct depends on the sample shown on that trial. Example: choose the red card when the sample is 'red,' the blue card when it's 'blue.'","page":398,"ch":17},{"term":"conditional probability","def":"How tightly a behavior is tied to an antecedent or consequence, as a 0-to-1 proportion (higher means stronger). Example: 9 of 10 tantrums came after hearing 'no', so 0
